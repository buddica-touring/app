function typeLabel(t,nm){if(t==="PU"||t==="PUB")return"PU";if(t==="BD"||t==="BDB")return"BD";if(t==="来店"||t==="PUB来店")return"来店";if(t==="返却")return"返却";if(t==="DEL"||t==="貸出")return"貸出(不明)";if(t==="COL"||t==="返却待")return"返却(不明)";if(t==="返却後洗車")return"返洗";if(t==="洗車"){var n=String(nm||"").trim();var mp=[["当日洗車","当洗"],["事前洗車","事洗"],["返却洗車","返洗"],["返却後洗車","返洗"],["内装洗車","内洗"],["外装洗車","外洗"]];for(var i=0;i<mp.length;i++){if(n.indexOf(mp[i][0])===0)return mp[i][1];}var old=["出発/フル","緊急洗車","引渡前洗車","内装メンテ/美装","外装メンテ/美装"];for(var j=0;j<old.length;j++){if(n.indexOf(old[j])===0)return old[j];}if(n.indexOf("無稼働")>=0)return"無稼働洗車";return"洗車";}return t||"";}
