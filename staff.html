function saInspPre(tk){ /* 戻り値 {n,t}／null＝対象の出発予約なし／-1＝読めない */

    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(a){var hit=(a||[]).filter(function(r){return String(r.plate_no||"")===String(tk.plate)&&String(r.start_date||"")>=tk.date;})
      .sort(function(x,y){return String(x.start_date).localeCompare(String(y.start_date))||String(x.start_time||"99").localeCompare(String(y.start_time||"99"));})[0];
      if(!hit)return null;var n=SA_INSP_PRE.filter(function(k){var c=(hit.checks||{})[k];return c&&c.checked;}).length;return {n:n,t:SA_INSP_PRE.length};})

}
window.saDone=function(tid,_inspOk){

      .then(function(r){return r.json();})
      .then(function(d){
        if(!d||d.ok===false){busy=false;alert("完了できませんでした（"+((d&&d.error)||"エラー")+"）");draw();return;}
        try{document.body.removeChild(ov);}catch(e){}
        if(window.saCelebrate)saCelebrate();
        setTimeout(load,700);
      })
      .catch(function(){busy=false;alert("通信エラー。電波を確認してください");draw();});
  }
  document.body.appendChild(ov); draw();
};
load();
setInterval(function(){if(!document.hidden&&TOKEN&&MODE==="tasks")load();},30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&MODE==="tasks")load();});
</script>
</body></html>
