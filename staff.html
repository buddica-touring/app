<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>スタッフ専用ページ - BUDDICA TOURISM 高松空港店</title>
<style>
.sa-pop{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:99999;pointer-events:none;background:linear-gradient(135deg,#10b981,#0891b2,#3b82f6);color:#fff;font-size:22px;font-weight:900;padding:18px 26px;border-radius:18px;box-shadow:0 12px 40px rgba(16,185,129,.45);display:flex;align-items:center;gap:10px;white-space:nowrap;animation:saPop 1.6s cubic-bezier(.2,.9,.3,1) forwards}
.sa-pop .ic{font-size:26px}
@keyframes saPop{0%{transform:translate(-50%,-50%) scale(.5) rotate(-6deg);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12) rotate(2deg);opacity:1}72%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}100%{transform:translate(-50%,-50%) scale(.96) translateY(-16px);opacity:0}}
:root{--blue:#2563eb;--red:#dc2626;--teal:#0d9488;--green:#059669;--amber:#d97706;--slate:#64748b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:#f1f5f9;color:#0f172a;font-size:15px;max-width:560px;margin:0 auto;padding-bottom:40px}
.hero{background:linear-gradient(135deg,#0f172a,#7c2d12);color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hero .brand{font-size:12px;opacity:.8;letter-spacing:1px}
.hero .name{font-size:22px;font-weight:800;margin-top:2px}
.hero .sub{font-size:12px;opacity:.85;margin-top:3px}
.wrap{padding:12px}
.parkbtn{display:block;width:100%;text-align:center;background:#fff;border:2px solid var(--slate);color:#475569;font-weight:800;font-size:15px;padding:12px;border-radius:12px;margin:4px 0 14px;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.sechd{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;font-weight:800;font-size:15px}
.sechd .cnt{margin-left:auto;font-size:12px;color:var(--slate);font-weight:700}
.card{background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:9px;box-shadow:0 1px 3px rgba(0,0,0,.07);border-left:5px solid var(--slate)}
.card.DEL,.card.PU,.card.PUB,.card.来店{border-left-color:var(--blue)}
.card.COL,.card.BD,.card.BDB,.card.返却{border-left-color:var(--red)}
.card.洗車{border-left-color:var(--teal)}
.card.done{opacity:.5}
.r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-weight:800;color:#fff;border-radius:6px;padding:3px 9px;font-size:14px;background:var(--slate)}
.jpay{font-weight:800;font-size:11px;border-radius:6px;padding:2px 7px;margin-left:6px;text-decoration:none;display:inline-block}
.jpay.ok{background:#f0fdf4;color:#059669;border:1px solid #bbf7d0}
.jpay.no{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.jpay.jtap{cursor:pointer}
.badge.DEL,.badge.PU,.badge.PUB,.badge.来店{background:var(--blue)}
.badge.COL,.badge.BD,.badge.BDB,.badge.返却{background:var(--red)}
.badge.洗車{background:var(--teal)}
.tm{font-size:19px;font-weight:800}
.cust{font-size:15px;font-weight:700}
.r2{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px}
.veh{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;font-weight:800;border-radius:7px;padding:3px 9px;font-size:14px}
.veh.nov{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.otab{font-weight:800;font-size:11px;border-radius:5px;padding:2px 7px;margin-left:6px;background:#f1f5f9;color:#475569;border:1px solid #e2e8f0}
.hdmb{font-weight:800;font-size:11px;border-radius:5px;padding:2px 7px;margin-left:4px;background:#1e3a8a;color:#fff;border:1px solid #1e3a8a;letter-spacing:.3px}
.card.hdm{background:#eef2ff;border-color:#c7d2fe}
.chk{font-weight:800;font-size:11px;border-radius:5px;padding:2px 6px;margin-left:5px;display:inline-block}
.chk.ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.chk.no{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.place{color:#334155;font-size:13px}
.r3{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.abtn{font-size:13px;font-weight:800;padding:8px 12px;border-radius:8px;border:none;cursor:pointer;color:#fff}
.abtn.done{background:#0f172a;color:#fff;margin-left:auto}
a.place{color:#1d4ed8;text-decoration:underline;font-size:13px}
a.myp{background:#7c2d12;color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:3px 8px;text-decoration:none;white-space:nowrap;margin-left:auto}
.tabs{display:flex;gap:4px;padding:8px 8px 0;background:#0f172a;position:sticky;top:0;z-index:6;overflow-x:auto}
.tab{flex:0 0 auto;background:none;border:none;color:#94a3b8;font-weight:700;font-size:12px;padding:9px 10px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px}
.tab.on{background:#f1f5f9;color:#0f172a}
.tab .tb{font-size:10px;font-weight:800;background:#475569;color:#fff;border-radius:8px;padding:1px 6px}
.tab.on .tb{background:#cbd5e1;color:#0f172a}
.dayhd{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:#1e293b;background:#e2e8f0;border-radius:8px;padding:7px 11px;margin:14px 0 8px}
.dayhd .ttag{font-size:10px;font-weight:800;color:#fff;background:#059669;border-radius:6px;padding:2px 8px}
.empty{text-align:center;color:var(--slate);padding:20px;font-size:14px}
.loading{text-align:center;padding:50px 20px;color:var(--slate)}
.spin{width:34px;height:34px;border:4px solid #e2e8f0;border-top-color:var(--amber);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:16px;margin:16px;text-align:center}
.err button{margin-top:10px;background:var(--red);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-weight:700;font-size:14px}
.ver{text-align:center;color:#94a3b8;font-size:10px;margin-top:16px}
.note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font-size:12px;border-radius:10px;padding:9px 11px;margin-bottom:12px}
</style></head>
<body>
<style>@keyframes tbBlink{0%,100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}50%{box-shadow:0 0 16px 2px rgba(34,211,238,.9)}}.tbBlinkBtn{animation:tbBlink 1.1s ease-in-out infinite;box-shadow:0 4px 14px rgba(8,145,178,.35)}</style>

<div id="app"><div class="loading"><div class="spin"></div>読み込み中…</div></div>
<script>
var SB="https://ggqugvyskyiblxiycpci.supabase.co";
var ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18";
var STORE="bt";
var VER="staff-v1.7-bt";
var TOKEN=new URLSearchParams(location.search).get("t")||"";
var app=document.getElementById("app");

function esc(s){return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function shortDate(d){var p=(d||"").split("-");return p.length===3?(+p[1])+"/"+(+p[2]):d;}
function jstToday(){var n=new Date(Date.now()+9*3600*1000);return n.toISOString().slice(0,10);}
function jpWd(d){var p=(d||"").split("-");if(p.length!==3)return"";return "日月火水木金土"[new Date(+p[0],+p[1]-1,+p[2]).getDay()];}
function addDays(d,n){var p=(d||"").split("-");if(p.length!==3)return d;var dt=new Date(+p[0],+p[1]-1,+p[2]+n);return dt.getFullYear()+"-"+("0"+(dt.getMonth()+1)).slice(-2)+"-"+("0"+dt.getDate()).slice(-2);}
function dayHead(d,today){var tag=(d===today)?'<span class="ttag">本日</span>':(d===addDays(today,1))?'<span class="ttag" style="background:#0284c7">明日</span>':'';return '<div class="dayhd">📅 '+shortDate(d)+'（'+jpWd(d)+'）'+tag+'</div>';}
function groupByDate(list,cardFn,today){var by={},order=[];list.forEach(function(x){var d=x.date||"";if(!by[d]){by[d]=[];order.push(d);}by[d].push(x);});order.sort();return order.map(function(d){return dayHead(d,today)+by[d].map(cardFn).join("");}).join("");}

function typeLabel(t){var m={DEL:"お届け",PU:"送迎お迎え",PUB:"バスお迎え",COL:"回収",BD:"お見送り",BDB:"バスお見送り","返却":"返却","洗車":"洗車","来店":"来店"};return m[t]||t;}
function mypLink(x){return x.mypage?('<a class="myp" href="guide/?t='+encodeURIComponent(x.mypage)+'&ro=1" target="_blank" rel="noopener">📄 ご利用ガイド</a>'):'';}

function otaAbbrS(o){var m={"じゃらん":"JLN","楽天":"RKT","エアトリ":"ART","スカイチケット":"SKT","レンタカードットコム":"RDC","レンタカー.com":"RDC","オフィシャル":"BDC","たびらい":"TBR","J":"JLN","R":"RKT","O":"ART","A":"ART","S":"SKT","RC":"RDC","HP":"BDC","direct":"直接","DIRECT":"直接"};var k=String(o==null?"":o).trim();if(!k)return "";return m[k]||k;}
function isHdmS(o){var k=String(o==null?"":o).trim();return k==="J"||k==="じゃらん"||k.indexOf("じゃらん")>=0;}
function taskCard(x){
  var t=x.type||"";
  var plate=x.plate?(" "+x.plate):"";
  var veh=x.vehicle?('<span class="veh">🚗 '+esc(x.vehicle)+esc(plate)+'</span>'):'<span class="veh nov">未配車</span>';
  var ab=otaAbbrS(x.ota);var otaB=ab?('<span class="otab" title="予約媒体">'+esc(ab)+'</span>'):'';
  var hdmB=isHdmS(x.ota)?('<span class="hdmb" title="HANDYMAN予約（じゃらん）— 送迎プラカード・問い合わせ対応・支払いツールが異なるため要注意">HDM</span>'):'';
  var tm=x.time||"";
  var pl=x.place?('<a class="place" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.place)+'" target="_blank" rel="noopener">📍 '+esc(x.place)+'</a>'):'';
  var cust=x.customer?('<span class="cust">'+esc(x.customer)+'</span>'):'';
  var tid=esc(x._id||"");
  var jpay='';
  var _pamt=Number(x.price)||0; var _pas=_pamt>0?(' ¥'+_pamt.toLocaleString()):'';
  var _isJ=(x.ota==='じゃらん'); var _isSP=(x.ota==='SP'||x.payment==='現地決済');
  if(_isJ&&x.pay_url){ jpay = x.paid ? '<span class="jpay ok" title="じゃらん事前決済 入金済み">💳入金済</span>' : '<a class="jpay no" href="'+esc(x.pay_url)+'" target="_blank" rel="noopener" title="じゃらん事前決済 未決済（クリックで決済リンク）">💳未決済'+_pas+'</a>'; }
  else if(_isJ||_isSP){ jpay = x.paid ? '<span class="jpay ok" title="決済 入金済み">💳入金済</span>' : '<span class="jpay no jtap" title="タップで現地決済を完了にする" onclick="saPay(\''+esc(x.resv||'')+'\','+_pamt+',\''+esc((x.customer||'').replace(/\x27/g,''))+'\')">💳未決済'+_pas+'</span>'; }
  var chk='';
  if(x.resv&&(t==='DEL'||t==='PU'||t==='PUB'||t==='来店'||t==='PUB来店')){
    chk='<span class="chk '+(x.lic?'ok':'no')+'" title="免許証">🪪'+(x.lic?'':'未')+'</span>'
      +'<span class="chk '+(x.terms?'ok':'no')+'" title="約款サイン">📄'+(x.terms?'':'未')+'</span>'
      +'<span class="chk '+(x.damage?'ok':'no')+'" title="傷サイン">🩹'+(x.damage?'':'未')+'</span>';
  }
  var opStr='';
  if(t!=='返却後洗車'){
    var op=[];var os='display:inline-block;padding:1px 6px;border-radius:4px;font-weight:800;font-size:12px;margin-right:4px';
    if(+(x.opt_b||0)>0)op.push('<span style="'+os+';background:#fef3c7;color:#92400e">👶B×'+(+x.opt_b)+'</span>');
    if(+(x.opt_c||0)>0)op.push('<span style="'+os+';background:#dbeafe;color:#1e40af">🧒C×'+(+x.opt_c)+'</span>');
    if(+(x.opt_j||0)>0)op.push('<span style="'+os+';background:#e0e7ff;color:#4338ca">J×'+(+x.opt_j)+'</span>');
    if(+(x.opt_usb||0)>0)op.push('<span style="'+os+';background:#dcfce7;color:#166534">🔌×'+(+x.opt_usb)+'</span>');
    if(op.length)opStr='<div class="r2" style="margin-top:5px">'+op.join('')+'</div>';
  }
  var btns='<div class="r3">';
  if(tid&&!x.done){ btns+='<button class="abtn done" onclick="saDone(\''+tid+'\')">✅完了</button>'; }
  btns+='</div>';
  return '<div class="card '+esc(t)+(isHdmS(x.ota)?' hdm':'')+(x.done?' done':'')+'">'
    +'<div class="r1"><span class="badge '+esc(t)+'">'+esc(typeLabel(t))+'</span>'
    +(tm?'<span class="tm">'+esc(tm)+'</span>':'')+cust+otaB+hdmB+(x.done?' <span style="color:#059669;font-weight:800;font-size:13px">✓済</span>':'')+mypLink(x)+jpay+'</div>'
    +'<div class="r2">'+veh+pl+'</div>'
    +opStr
    +(chk?'<div class="r2" style="margin-top:5px">'+chk+'</div>':'')+btns+'</div>';
}
function ymShift(ym,delta){var p=(ym||jstToday().slice(0,7)).split("-");var y=+p[0],m=+p[1]-1+delta;var d=new Date(Date.UTC(y,m,1));return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0");}
window.openHistory=function(ym){
  MODE="history";
  ym=ym||jstToday().slice(0,7);
  app.innerHTML='<div class="loading"><div class="spin"></div>対応履歴を読み込み中…</div>';
  fetch(SB+"/rest/v1/rpc/bt_staff_history",{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify({p_token:TOKEN,p_ym:ym})})
    .then(function(r){return r.json();})
    .then(function(d){ if(!d||d.ok===false){showErr("履歴の読み込みに失敗しました");return;} renderHistory(d); })
    .catch(function(){showErr("通信エラー");});
};
function renderHistory(d){
  var ym=d.ym||jstToday().slice(0,7);var tk=(d.tasks||[]);
  var name=String(d.staff||"").replace(/\s*さん\s*$/,"");
  var h='<div class="hero" style="background:linear-gradient(135deg,#7c2d12,#b45309)"><div class="brand">対応履歴（給与の基礎）</div>'
    +'<div class="name">'+esc(name)+' さん</div></div>';
  h+='<div class="wrap">';
  h+='<button class="parkbtn" onclick="load()">← タスクに戻る</button>';
  h+='<div style="display:flex;align-items:center;gap:8px;margin:10px 0">'
    +'<button class="abtn" style="background:#e2e8f0;color:#334155" onclick="openHistory(\''+ymShift(ym,-1)+'\')">‹ 前月</button>'
    +'<div style="flex:1;text-align:center;font-weight:800;font-size:16px">'+ym.replace("-","年")+'月</div>'
    +'<button class="abtn" style="background:#e2e8f0;color:#334155" onclick="openHistory(\''+ymShift(ym,1)+'\')">翌月 ›</button></div>';
  h+='<div style="background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px solid #fcd34d;border-radius:12px;padding:16px;text-align:center;margin-bottom:12px">'
    +'<div style="font-size:12px;color:#92400e;font-weight:700">今月の対応（完了）件数</div>'
    +'<div style="font-size:36px;font-weight:900;color:#b45309;line-height:1.1">'+(d.count||0)+'<span style="font-size:16px"> 件</span></div>'
    +'<div style="font-size:11px;color:#a16207;margin-top:4px">※この件数が給与明細の基礎になります</div></div>';
  h+='<div class="sechd">✅ 完了したタスク<span class="cnt">'+tk.length+'件</span></div>';
  if(!tk.length){h+='<div class="empty">この月の完了タスクはありません</div>';}
  else{h+=tk.map(function(x){
    return '<div class="card '+esc(x.type)+'"><div class="r1"><span class="badge '+esc(x.type)+'">'+esc(typeLabel(x.type))+'</span>'
      +'<span style="font-size:12px;color:#64748b;font-weight:700">'+shortDate(x.date)+(x.time?" "+esc(x.time):"")+'</span>'
      +(x.customer?'<span class="cust">'+esc(x.customer)+'</span>':'')+'</div>'
      +(x.vehicle?'<div class="r2"><span class="veh">🚗 '+esc(x.vehicle)+(x.plate?" "+esc(x.plate):"")+'</span></div>':'')+'</div>';
  }).join("");}
  h+='<div class="ver">'+VER+'</div></div>';
  app.innerHTML=h;
}
function saCelebrate(){try{var el=document.createElement("div");el.className="sa-pop";el.innerHTML='<span class="ic">✅</span><span>お疲れ様 Good Job !!!</span><span class="ic">🎉</span>';document.body.appendChild(el);setTimeout(function(){el.remove();},1650);}catch(e){}}
window.saDone=function(tid){
  if(!confirm("このタスクを完了にしますか？"))return;
  fetch(SB+"/rest/v1/rpc/bt_staff_done",{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify({p_token:TOKEN,p_task_id:tid})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||d.ok===false){alert("⚠️ 完了にできませんでした（"+((d&&d.error)||"エラー")+"）");return;}
      saCelebrate();
      setTimeout(load,900);
    })
    .catch(function(){alert("⚠️ 通信エラー。電波を確認してください");});
};

var STAB="today";var LASTD=null;var MODE="tasks";
window.setTab=function(tab){
  if(tab==="history"){ openHistory(""); return; }
  if(tab==="shift"){ openShift(""); return; }
  STAB=tab;if(LASTD)render(LASTD);
};
function render(d){
  MODE="tasks";
  LASTD=d;
  var today=jstToday();
  var tk=(d.tasks||[]);
  var tdy=tk.filter(function(x){return x.date===today;});
  var fut=tk.filter(function(x){return x.date>today;});
  var name=esc(String(d.staff||"").replace(/\s*さん\s*$/,""));
  var h='<div class="hero"><div class="brand">BUDDICA TOURISM 高松空港店</div>'
    +'<div class="name">'+name+' さん</div>'
    +'<div class="sub">本日 '+tdy.length+'件 ／ 未来 '+fut.length+'件</div></div>';
  function tab(id,label,cnt){return '<button class="tab'+(STAB===id?" on":"")+'" onclick="setTab(\''+id+'\')">'+label+(cnt!=null?'<span class="tb">'+cnt+'</span>':'')+'</button>';}
  h+='<a href="https://nosh2318.github.io/spk-task/company3d.html" target="_blank" rel="noopener" class="tbBlinkBtn" style="display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 6px;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,#0e7490,#0891b2);color:#fff;font-weight:900;font-size:15px;text-decoration:none;border:2px solid #22d3ee;">📊 リアルタイム/チーム状況 <span style="font-weight:700;font-size:12px;opacity:.9;">（3Dバーチャル本社）</span></a>';
  h+='<div class="tabs">'
    +tab("today","📋本日",tdy.length)
    +tab("future","🗓未来",fut.length)
    +tab("shift","🗓出勤簿")
    +tab("history","📋履歴")
    +'</div>';
  h+='<div class="wrap">';
  if(STAB==="future"){
    h+='<div class="sechd">🗓 未来の担当タスク（本日以外）<span class="cnt">'+fut.length+'件</span></div>';
    h+= fut.length?groupByDate(fut,taskCard,today):'<div class="empty">本日以外の担当タスクはありません</div>';
  }else{
    h+='<div class="note">OPシートで担当・時間が変わると、この画面も自動で最新になります（30秒ごと）。</div>';
    h+='<div class="sechd">📋 本日 <span style="color:#94a3b8;font-weight:600;font-size:12px">'+shortDate(today)+'</span><span class="cnt">'+tdy.length+'件</span></div>';
    h+= tdy.length?tdy.map(taskCard).join(""):'<div class="empty">本日の担当タスクはありません</div>';
  }
  h+='<div class="ver">'+VER+'</div></div>';
  app.innerHTML=h;
}

function showErr(msg){
  app.innerHTML='<div class="err">⚠️ '+esc(msg)+'<br><button onclick="load()">再読み込み</button></div>';
}

// ===== 🗓 出勤簿（閲覧＋先の月の休み希望入力） =====
var SHSYM={'●':{l:'出勤',c:'#2563eb',bg:'#D4EBFA'},'公':{l:'公休',c:'#64748b',bg:'#E8E8E8'},'希':{l:'希望休',c:'#b45309',bg:'#FFF3CD'},'有':{l:'有休',c:'#15803d',bg:'#dcfce7'},'出':{l:'出張',c:'#6d28d9',bg:'#ede9fe'}};
var SHDATA=null;
window.openShift=function(ym){
  MODE="shift";
  ym=ym||jstToday().slice(0,7);
  app.innerHTML='<div class="loading"><div class="spin"></div>出勤簿を読み込み中…</div>';
  fetch(SB+"/rest/v1/rpc/bt_staff_shifts",{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify({p_token:TOKEN,p_ym:ym})})
    .then(function(r){return r.json();})
    .then(function(d){ if(!d||d.ok===false){showErr("出勤簿の読み込みに失敗しました");return;} MODE="shift"; SHDATA=d; renderShift(d); })
    .catch(function(){showErr("通信エラー");});
};
window.toggleWish=function(date,on){
  var el=document.getElementById("cell-"+date); if(el){el.style.opacity=.5;el.style.pointerEvents="none";}
  fetch(SB+"/rest/v1/rpc/bt_staff_wish",{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},body:JSON.stringify({p_token:TOKEN,p_date:date,p_on:on})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||d.ok===false){ alert("⚠️ "+((d&&d.msg)||"登録できませんでした")); }
      openShift((SHDATA&&SHDATA.ym)||date.slice(0,7));
    })
    .catch(function(){ alert("通信エラー。もう一度お試しください"); openShift((SHDATA&&SHDATA.ym)||date.slice(0,7)); });
};
function renderShift(d){
  var ym=d.ym||jstToday().slice(0,7);var today=d.today||jstToday();
  var name=esc(String(d.staff||"").replace(/\s*さん\s*$/,""));
  var editable=!!d.editable;
  var map={};(d.shifts||[]).forEach(function(s){map[s.date]=s;});
  var yy=+ym.slice(0,4),mm=+ym.slice(5,7);
  var first=new Date(yy,mm-1,1),ndays=new Date(yy,mm,0).getDate(),off=first.getDay();
  var work=(d.shifts||[]).filter(function(s){return s.symbol==='●'||(!s.symbol&&s.start);}).length;
  var wish=(d.shifts||[]).filter(function(s){return s.symbol==='希';}).length;
  var h='<div class="hero" style="background:linear-gradient(135deg,#0f172a,#059669)"><div class="brand">🗓 出勤簿</div>'
    +'<div class="name">'+name+' さん</div></div>';
  h+='<div class="wrap">';
  h+='<button class="parkbtn" onclick="load()">← タスクに戻る</button>';
  h+='<div style="display:flex;align-items:center;gap:8px;margin:10px 0">'
    +'<button class="abtn" style="background:#e2e8f0;color:#334155" onclick="openShift(\''+ymShift(ym,-1)+'\')">‹ 前月</button>'
    +'<div style="flex:1;text-align:center;font-weight:800;font-size:16px">'+ym.replace("-","年")+'月</div>'
    +'<button class="abtn" style="background:#e2e8f0;color:#334155" onclick="openShift(\''+ymShift(ym,1)+'\')">翌月 ›</button></div>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">';
  Object.keys(SHSYM).forEach(function(k){var s=SHSYM[k];h+='<span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:'+s.bg+';color:'+s.c+'">'+k+' '+s.l+'</span>';});
  h+='</div>';
  if(editable){
    h+='<div class="note" style="background:#fffbeb;border-color:#fde68a;color:#92400e">✏️ <b>先の月です。</b>休みたい日をタップすると <b>希望休</b>を登録できます（もう一度タップで取消）。<br>すでに出勤・公休などの予定が入っている日は変更できません。</div>';
  }else{
    h+='<div class="note">👀 閲覧専用です。休み希望は<b>先の月</b>から入力できます（「翌月 ›」で移動）。</div>';
  }
  var wd=['日','月','火','水','木','金','土'];
  h+='<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">';
  wd.forEach(function(w,i){h+='<div style="text-align:center;font-size:11px;font-weight:800;padding:4px 0;color:'+(i===0?'#dc2626':i===6?'#2563eb':'#64748b')+'">'+w+'</div>';});
  for(var i=0;i<off;i++){h+='<div></div>';}
  for(var day=1;day<=ndays;day++){
    var ds=ym+'-'+("0"+day).slice(-2);var s=map[ds];var sym=s?s.symbol:'';
    var isToday=(ds===today);var dow=new Date(yy,mm-1,day).getDay();
    var cfg=SHSYM[sym];var bg=cfg?cfg.bg:'#fff';var bd=isToday?'2px solid #059669':'1px solid #e2e8f0';
    var canTap=editable&&(sym===''||sym==='希');
    var inner='<div style="font-size:12px;font-weight:800;color:'+(dow===0?'#dc2626':dow===6?'#2563eb':'#334155')+'">'+day+'</div>';
    if(cfg){inner+='<div style="font-size:11px;font-weight:800;color:'+cfg.c+';margin-top:2px">'+sym+'</div>';
      if(sym==='●'&&s.start){inner+='<div style="font-size:8px;color:#475569;line-height:1.15">'+esc((s.start||'').slice(0,5))+(s.end?'<br>〜'+esc((s.end||'').slice(0,5)):'')+'</div>';}
    }else if(!sym&&s&&s.start){inner+='<div style="font-size:8px;color:#94a3b8;margin-top:2px;line-height:1.15">'+esc((s.start||'').slice(0,5))+(s.end?'<br>〜'+esc((s.end||'').slice(0,5)):'')+'</div>';}
    if(canTap&&sym==='希'){inner+='<div style="font-size:8px;color:#b45309;margin-top:1px">タップで取消</div>';}
    else if(canTap){inner+='<div style="font-size:8px;color:#cbd5e1;margin-top:1px">＋休</div>';}
    var tap=canTap?(' onclick="toggleWish(\''+ds+'\','+(sym==='希'?'false':'true')+')" style="cursor:pointer"'):'';
    h+='<div id="cell-'+ds+'"'+tap+' style="min-height:52px;border:'+bd+';border-radius:8px;background:'+bg+';padding:3px 2px 2px;text-align:center;'+(canTap?'':'opacity:'+(editable?'.75':'1'))+'">'+inner+'</div>';
  }
  h+='</div>';
  h+='<div style="margin-top:12px;display:flex;gap:8px;text-align:center">'
    +'<div style="flex:1;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:8px"><div style="font-size:11px;color:#1d4ed8;font-weight:700">出勤予定</div><div style="font-size:22px;font-weight:900;color:#1d4ed8">'+work+'<span style="font-size:12px">日</span></div></div>'
    +'<div style="flex:1;background:#fffbeb;border:1px solid #fcd34d;border-radius:10px;padding:8px"><div style="font-size:11px;color:#b45309;font-weight:700">希望休</div><div style="font-size:22px;font-weight:900;color:#b45309">'+wish+'<span style="font-size:12px">日</span></div></div></div>';
  h+='<div class="ver">'+VER+'</div></div>';
  app.innerHTML=h;
}

function load(){
  if(!TOKEN){showErr("URLが正しくありません（token無し）");return;}
  var ctrl=new AbortController();var to=setTimeout(function(){ctrl.abort();},15000);
  fetch(SB+"/rest/v1/rpc/bt_staff_view",{method:"POST",signal:ctrl.signal,
    headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},
    body:JSON.stringify({p_token:TOKEN})})
  .then(function(r){return r.json();})
  .then(function(d){clearTimeout(to);
    if(!d||d.ok===false){showErr(d&&d.error==="invalid_token"?"このURLは無効です（担当者へ連絡してください）":"読み込みに失敗しました");return;}
    render(d);})
  .catch(function(e){clearTimeout(to);showErr("通信エラー。電波を確認して再読み込みしてください");});
}
window.saPay=function(resv,amount,cust){
  if(!resv){alert("予約情報が取得できませんでした");return;}
  var amt=Number(amount)||0;
  var method="カード", step=1, busy=false;
  var ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px";
  function close(){if(busy)return;document.body.removeChild(ov);}
  function esc2(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function draw(){
    var mbtn=function(m){return '<button data-m="'+m+'" style="flex:1;padding:9px 0;border-radius:9px;border:'+(method===m?'2px solid #2563eb':'1px solid #cbd5e1')+';background:'+(method===m?'#eff6ff':'#fff')+';font-weight:800;font-size:14px;color:'+(method===m?'#1d4ed8':'#475569')+'">'+(m==="カード"?"💳 カード":"💵 現金")+'</button>';};
    var body= step===1
      ? '<div style="font-size:12px;font-weight:700;color:#334155;margin-bottom:4px">支払方法</div>'
        +'<div style="display:flex;gap:8px;margin-bottom:12px" id="pm">'+mbtn("カード")+mbtn("現金")+'</div>'
        +'<div style="font-size:12px;font-weight:700;color:#334155;margin-bottom:4px">Squareレシート番号 <span style="font-weight:500;color:#94a3b8">（任意・空でOK）</span></div>'
        +'<input id="prc" placeholder="例）tU7a" style="width:100%;padding:9px 10px;border-radius:9px;border:1px solid #cbd5e1;font-size:14px;margin-bottom:14px;box-sizing:border-box">'
        +'<div style="display:flex;gap:8px"><button id="pcancel" style="flex:1;padding:11px 0;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-weight:800;font-size:14px;color:#475569">キャンセル</button>'
        +'<button id="pnext" style="flex:1.4;padding:11px 0;border-radius:10px;border:none;background:#2563eb;font-weight:800;font-size:14px;color:#fff">次へ</button></div>'
      : '<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 14px;margin-bottom:14px;text-align:center"><div style="font-size:15px;font-weight:900;color:#92400e;margin-bottom:4px">決済は完了しましたか？</div><div style="font-size:12px;color:#78716c">'+esc2(method)+'で ¥'+amt.toLocaleString()+' を受領済み<br>入金済みにして会計（予約外売上）に計上します</div></div>'
        +'<div style="display:flex;gap:8px"><button id="pback" style="flex:1;padding:11px 0;border-radius:10px;border:1px solid #cbd5e1;background:#fff;font-weight:800;font-size:14px;color:#475569">戻る</button>'
        +'<button id="pdo" style="flex:1.4;padding:11px 0;border-radius:10px;border:none;background:'+(busy?'#94a3b8':'#059669')+';font-weight:800;font-size:14px;color:#fff">'+(busy?"処理中…":"✅ はい、完了")+'</button></div>';
    ov.innerHTML='<div style="background:#fff;border-radius:16px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden">'
      +'<div style="background:linear-gradient(135deg,#0f172a,#7c2d12);color:#fff;padding:14px 16px"><div style="font-size:15px;font-weight:900">💳 現地決済の完了</div><div style="font-size:12px;opacity:.85;margin-top:2px">'+esc2(cust||"")+' ・ '+esc2(resv)+'</div></div>'
      +'<div style="padding:16px"><div style="text-align:center;font-size:13px;color:#64748b">受領金額</div><div style="text-align:center;font-size:30px;font-weight:900;color:#991b1b;margin:2px 0 12px">¥'+amt.toLocaleString()+'</div>'+body+'</div></div>';
    wire();
  }
  function wire(){
    ov.onclick=function(e){if(e.target===ov)close();};
    var pm=ov.querySelector("#pm"); if(pm){pm.querySelectorAll("button").forEach(function(b){b.onclick=function(){method=b.getAttribute("data-m");draw();};});}
    var c=ov.querySelector("#pcancel"); if(c)c.onclick=close;
    var n=ov.querySelector("#pnext"); if(n)n.onclick=function(){window._prcv=(ov.querySelector("#prc")||{}).value||"";step=2;draw();};
    var bk=ov.querySelector("#pback"); if(bk)bk.onclick=function(){step=1;draw();};
    var d=ov.querySelector("#pdo"); if(d)d.onclick=run;
  }
  function run(){
    if(busy)return; busy=true; draw();
    fetch(SB+"/rest/v1/rpc/bt_complete_onsite_payment",{method:"POST",headers:{"apikey":ANON,"Authorization":"Bearer "+ANON,"Content-Type":"application/json"},
      body:JSON.stringify({p_resv:resv,p_receipt:window._prcv||null,p_method:method,p_token:TOKEN})})
      .then(function(r){return r.json();})
      .then(function(d){
        if(!d||d.ok===false){busy=false;alert("完了できませんでした（"+((d&&d.error)||"エラー")+"）");draw();return;}
        try{document.body.removeChild(ov);}catch(e){}
        if(window.saCelebrate)saCelebrate();
        setTimeout(load,700);
      })
      .catch(function(){busy=false;alert("通信エラー。電波を確認してください");draw();});
  }
  document.body.appendChild(ov); draw();
};
load();
setInterval(function(){if(!document.hidden&&TOKEN&&MODE==="tasks")load();},30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&MODE==="tasks")load();});
</script>
</body></html>
