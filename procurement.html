<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>🚗 TOURISM 進行管理</title>
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#faf7f3;color:#1c1917;font-size:14px}
  .wrap{max-width:1760px;margin:0 auto;padding:10px}
  h1{font-size:18px;margin:6px 0 2px;display:flex;align-items:center;gap:8px}
  .sub{font-size:11px;color:#64748b;margin-bottom:10px}
  /* dashboard */
  .dash{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .card{flex:1 1 130px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card .lb{font-size:11px;color:#64748b;font-weight:700}
  .card .vv{font-size:24px;font-weight:900;line-height:1.1;margin-top:2px}
  .card small{font-size:11px;font-weight:700;color:#94a3b8}
  .bar{height:14px;background:#e2e8f0;border-radius:8px;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#22c55e)}
  .need{border-color:#fca5a5;background:#fef2f2}
  .need .vv{color:#dc2626}
  /* toolbar */
  .tb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
  .chip{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;color:#475569}
  .chip.on{background:#0f172a;color:#fff;border-color:#0f172a}
  .chip b{font-weight:900}
  .chip.cOK.on{background:#16a34a;border-color:#16a34a}
  .chip.cNG.on{background:#64748b;border-color:#64748b}
  .chip.cSold.on{background:#dc2626;border-color:#dc2626}
  .who{margin-left:auto;display:flex;gap:6px;align-items:center}
  .who input{border:1px solid #cbd5e1;border-radius:8px;padding:5px 8px;font-size:13px;width:120px}
  .btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;color:#334155}
  .btn.p{background:#2563eb;color:#fff;border-color:#2563eb}
  @keyframes pulseAdd{0%{box-shadow:0 0 0 0 rgba(37,99,235,.55)}70%{box-shadow:0 0 0 9px rgba(37,99,235,0)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}
  #add{animation:pulseAdd 1.5s infinite}
  /* table */
  .tblwrap{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:0;table-layout:fixed}
  th{font-size:10.5px;color:#64748b;font-weight:700;text-align:left;padding:7px 3px;border-bottom:2px solid #e2e8f0;line-height:1.2;position:sticky;top:0;background:#f8fafc;z-index:1}
  td{padding:5px 3px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
  .ro{padding:2px 3px;font-size:12px}
  select.st{padding:4px 3px;font-size:12px}
  td .cp,td .refetch{font-size:12px}
  a.lnk{font-size:11px}
  @keyframes flashrow{0%{background:#fde68a}60%{background:#fef3c7}100%{background:transparent}}
  tr.flash{animation:flashrow 2.2s ease}
  tr[data-st="OK"]{background:#dcfce7;box-shadow:inset 5px 0 0 #16a34a}
  tr[data-st="OK"] td:first-child{color:#15803d}
  tr[data-st="NG"]{background:#fef2f2;opacity:.62}
  tr.sold{background:#fff1f2!important;opacity:1!important;box-shadow:inset 5px 0 0 #dc2626}
  .soldbadge{display:inline-block;background:#dc2626;color:#fff;font-weight:900;font-size:11px;letter-spacing:.5px;padding:4px 9px;border-radius:6px;box-shadow:0 1px 3px rgba(220,38,38,.4)}
  tr[data-st="確認中"]{background:#fffbeb}
  tr[data-st="対応中"]{background:#eff6ff}
  .car{font-weight:800}
  .car small{color:#64748b;font-weight:600}
  .cell{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 5px;font-size:13px;width:100%;font-family:inherit}
  textarea.autg{min-height:36px;overflow:hidden}
  .cell:focus{border-color:#93c5fd;background:#fff;outline:none}
  .ro{display:block;padding:3px 5px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#0f172a}
  .cp{cursor:pointer;font-size:13px;opacity:.7}
  .cp:hover{opacity:1}
  select.st{border:1px solid #cbd5e1;border-radius:8px;padding:5px 6px;font-size:13px;font-weight:800}
  .stU{color:#64748b}.stC{color:#b45309}.stO{color:#166534}.stN{color:#b91c1c}.stX{color:#1d4ed8}
  select.meU{background:#f1f5f9;color:#64748b}
  select.meBD{background:#f97316;color:#fff;border-color:#ea580c!important}
  select.meHDM{background:#2563eb;color:#fff;border-color:#1d4ed8!important}
  a.lnk{color:#2563eb;font-weight:700;text-decoration:none;font-size:12px}
  .refetch{cursor:pointer;font-size:13px;margin-left:2px;opacity:.7}
  .refetch:hover{opacity:1}
  @keyframes mtblink{0%,100%{background:#eff6ff;box-shadow:0 0 0 0 rgba(37,99,235,.45);border-color:#bfdbfe}50%{background:#bfdbfe;box-shadow:0 0 0 5px rgba(37,99,235,0);border-color:#60a5fa}}
  .mtoggle{display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:#1d4ed8;background:#eff6ff;border:1px solid #bfdbfe;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:800;margin-top:4px;white-space:nowrap;animation:mtblink 1.5s ease-in-out infinite}
  .mtoggle:hover{background:#dbeafe;animation:none}
  .memoflag{display:inline-flex;align-items:center;gap:3px;background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:900;margin-top:4px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .memoflag.ok{background:#dcfce7;color:#15803d;border-color:#86efac}
  .mtoggle b{display:inline-block;font-size:9px;transition:transform .15s}
  tr.open .mtoggle{background:#dbeafe;border-color:#93c5fd;animation:none;box-shadow:none}
  tr.open .mtoggle b{transform:rotate(180deg)}
  tr.detailrow{display:none}
  tr.grpRow.open + tr.detailrow{display:table-row}
  tr.detailrow>td{padding:0;background:#f8fafc;border-left:3px solid var(--cc);border-right:3px solid var(--cc);border-bottom:3px solid var(--cc)}
  .pdetail{display:flex;flex-wrap:wrap;gap:10px 18px;padding:11px 16px 13px;align-items:flex-end}
  .pdetail .ptitle{width:100%;font-size:11px;font-weight:900;color:#0f172a;margin-bottom:1px}
  .pdetail .fld{display:flex;flex-direction:column;gap:3px}
  .pdetail .fld label{font-size:11px;font-weight:800;color:#475569}
  .pdetail .fld input[type=date]{border:1px solid #cbd5e1;border-radius:8px;padding:6px 8px;font-size:13px;font-family:inherit;background:#fff}
  .pdetail .memo{flex:1 1 220px;min-width:180px}
  .pdetail .memo textarea{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:8px;padding:6px 8px;font-size:13px;font-family:inherit;line-height:1.6;resize:vertical;min-height:40px;background:#fff}
  .opd{font-size:12px;font-weight:800;color:#0f766e}
  .opd.z{color:#cbd5e1;font-weight:600}
  .del{color:#cbd5e1;cursor:pointer;font-size:15px}
  .del:hover{color:#dc2626}
  .num{width:58px;text-align:right}
  .yr{width:54px}
  .help{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:2px 12px;margin-bottom:10px;font-size:12px}
  .help summary{cursor:pointer;font-weight:800;color:#1d4ed8;padding:8px 0;list-style:none}
  .help summary::-webkit-details-marker{display:none}
  .help .hbody{color:#334155;line-height:1.9;padding:2px 0 10px}
  .help .hbody b{color:#0f172a}
  .clswrap{margin-bottom:10px}
  .clswrap summary{cursor:pointer;font-size:12px;font-weight:800;color:#334155;list-style:none;padding:7px 2px}
  .clswrap summary::-webkit-details-marker{display:none}
  .clswrap summary::before{content:"▸ ";color:#94a3b8}
  .clswrap[open] summary::before{content:"▾ ";color:#94a3b8}
  .clsum{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px;align-items:center}
  .clsum .lbl{font-size:11px;font-weight:800;color:#64748b}
  .clsum .cc{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800}
  .clsum .cc b{font-size:13px;color:#166534}
  .clsum .cc .pk{color:#64748b;font-weight:800;font-size:12px}
  .clsum .cc.z{opacity:.5}
  .clsum .cc.z b{color:#94a3b8}
  .foot{font-size:11px;color:#94a3b8;margin-top:8px;text-align:center}
  #st{position:fixed;bottom:12px;left:12px;right:auto;background:#0f172a;color:#fff;font-size:11px;padding:5px 10px;border-radius:8px;opacity:.85}
  #reload{position:fixed;right:16px;bottom:16px;z-index:60;width:56px;height:56px;border-radius:50%;background:#2563eb;color:#fff;border:none;font-size:24px;box-shadow:0 4px 12px rgba(37,99,235,.45);cursor:pointer;display:flex;align-items:center;justify-content:center}
  #reload:active{transform:scale(.93)}
  #reload.spin{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:760px){
    html,body{overflow-x:hidden;max-width:100%}
    .wrap{padding:8px;overflow-x:hidden;max-width:100%}
    h1{font-size:16px}
    .card{flex-basis:calc(50% - 4px);padding:8px 10px}
    .card .vv{font-size:20px}
    .who{margin-left:0;width:100%;justify-content:flex-end}
    .who input{width:110px}
    /* 横スクロール不要＝各行をカード化（既定は折りたたみ＝最低限のみ） */
    .tblwrap{overflow-x:hidden;border:none;background:transparent;border-radius:0;max-width:100%}
    table{min-width:0!important;width:100%!important;table-layout:auto}
    thead{display:none}
    tbody,tr,td{display:block;max-width:100%;box-sizing:border-box}
    .cell,textarea.cell,select.st{max-width:100%;box-sizing:border-box}
    tr.grpRow{border:1px solid #e2e8f0;border-left:5px solid var(--cc)!important;border-radius:12px;margin:0 0 8px;padding:8px 12px;position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    tr.grpRow td{border:none!important;padding:4px 0;display:flex;align-items:center;gap:10px;min-height:30px}
    tr.grpRow td:before{content:attr(data-lb);font-size:11px;color:#64748b;font-weight:800;flex:0 0 74px}
    /* 車種＝見出し（大・ラベルなし） */
    td[data-lb="車種"]{font-size:15px;font-weight:800;padding:2px 40px 4px 0!important;min-height:28px}
    td[data-lb="車種"]:before{display:none}
    td.noNo{position:absolute;top:9px;right:12px;padding:0!important;min-height:0!important;font-size:14px;color:#94a3b8;font-weight:800;display:block}
    td.noNo:before{content:""}
    .mtoggle{margin-left:auto;flex-shrink:0}
    /* ▼折りたたみ：既定は 車種＋進捗(仕入/整備/回収/準備) だけ。タップで全項目 */
    tr.grpRow:not(.open) td{display:none}
    tr.grpRow:not(.open) td[data-lb="車種"],
    tr.grpRow:not(.open) td[data-lb="ナンバー"],
    tr.grpRow:not(.open) td[data-lb="仕入"],
    tr.grpRow:not(.open) td[data-lb="整備"],
    tr.grpRow:not(.open) td[data-lb="店舗回収"],
    tr.grpRow:not(.open) td[data-lb="準備"],
    tr.grpRow:not(.open) td[data-lb="販売開始"]{display:flex}
    tr.grpRow td[data-lb="車種"]{margin-bottom:0;padding-bottom:2px!important}
    /* ナンバー＝車種見出しの直下に大きく表示（同じ車種を識別できるように） */
    tr.grpRow td[data-lb="ナンバー"]{border-bottom:1px solid #eef2f7!important;margin-bottom:3px;padding:0 0 6px!important}
    tr.grpRow td[data-lb="ナンバー"]:before{content:"🚗 ナンバー";flex:0 0 auto;color:#64748b;font-size:11px;font-weight:800}
    tr.grpRow td[data-lb="ナンバー"] span{font-size:16px!important;font-weight:900!important;color:#0f172a}
    tr.grpRow td[data-lb="ナンバー"] input{flex:1;max-width:160px}
    /* 展開時：幅広入力は縦フル幅 */
    td[data-lb="車両状態"],td[data-lb="対応概要"]{flex-direction:column;align-items:stretch;gap:4px}
    td[data-lb="車両状態"]:before,td[data-lb="対応概要"]:before{flex:none;width:100%;text-align:left;margin-bottom:2px}
    td[data-lb="車両状態"] textarea.autg,td[data-lb="対応概要"] textarea.autg{min-height:46px!important;height:auto;overflow:auto;display:block;box-sizing:border-box}
    .cell{border:1px solid #cbd5e1;background:#fff;padding:7px 9px;width:100%}
    select.st{width:100%;flex:1}
    td .ro{flex:1;text-align:right}
    td.delc{justify-content:flex-end;padding-top:8px!important}
    td.delc:before{content:"";flex:0}
    td.delc .del{font-size:22px}
    td[data-lb="車両URL"]>div{flex:1;justify-content:flex-end}
    /* 進捗予定（日付）は展開時に表示 */
    tr.grpRow.open + tr.detailrow{display:block}
    tr.detailrow{border:1px solid #e2e8f0;border-top:none;margin:-8px 0 8px;border-radius:0 0 12px 12px;padding:0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    tr.detailrow>td{border:none;padding:0;display:block;max-width:100%}
    tr.detailrow>td:before{content:""}
    .pdetail{padding:10px 12px}
    .pdetail .fld,.pdetail .memo{width:100%}
    .pdetail .fld input[type=date]{width:100%;box-sizing:border-box}
    tr.clsgrp td{font-size:12px;padding:8px 10px}
    /* ★2026-10-15 スマホ最適化（カード）：見出し左寄せ・進捗は3列グリッド・タップ領域を大きく */
    .wrap{padding-bottom:96px}
    tr.grpRow{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:8px;row-gap:2px;padding:10px 12px 10px}
    tr.grpRow>td{grid-column:1/-1}
    tr.grpRow td[data-lb="車種"]{flex-wrap:wrap;gap:6px;padding:0 44px 2px 0!important}
    tr.grpRow td[data-lb="車種"] .ro{flex:0 1 auto!important;text-align:left!important;font-size:16px;white-space:normal;overflow:visible}
    tr.grpRow td[data-lb="車種"] .memoflag,tr.grpRow td[data-lb="車種"] .mtoggle{margin-top:0}
    tr.grpRow td[data-lb="車種"] .mtoggle{margin-left:0;padding:5px 12px;font-size:12px}
    tr.grpRow td[data-lb="仕入"],tr.grpRow td[data-lb="整備"],tr.grpRow td[data-lb="店舗回収"],tr.grpRow td[data-lb="準備"],tr.grpRow td[data-lb="名義"],tr.grpRow td[data-lb="販売開始"]{grid-column:auto;flex-direction:column;align-items:stretch;gap:3px;padding:6px 0 0!important;min-height:0}
    tr.grpRow td[data-lb="仕入"]:before,tr.grpRow td[data-lb="整備"]:before,tr.grpRow td[data-lb="店舗回収"]:before,tr.grpRow td[data-lb="準備"]:before,tr.grpRow td[data-lb="名義"]:before,tr.grpRow td[data-lb="販売開始"]:before{flex:none;font-size:10.5px}
    tr.grpRow td select.st{width:100%;min-height:40px;padding:6px 4px;font-size:13.5px}
    tr.grpRow td[data-lb="仕入"]>span,tr.grpRow td[data-lb="整備"]>span,tr.grpRow td[data-lb="店舗回収"]>span,tr.grpRow td[data-lb="準備"]>span{min-height:40px;display:flex;align-items:center}
    tr.grpRow td[data-lb="車両状態"]:before,tr.grpRow td[data-lb="対応概要"]:before{flex:none}
    tr.grpRow td[data-lb="車両状態"],tr.grpRow td[data-lb="対応概要"]{padding-top:8px!important}
    tr.grpRow .cell{min-height:40px;font-size:16px}
    tr.grpRow td.delc .del{padding:6px}
    tr.detailrow .pdetail .fld input[type=date],tr.detailrow .pdetail .memo textarea{min-height:42px;font-size:16px}
    /* サマリー（数字カード）は既定たたむ＝1行の要約だけ表示 */
    .dashsum{display:flex!important;align-items:center;gap:10px;width:100%;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:11px 12px;margin:0 0 10px;font-family:inherit;font-size:13px;color:#334155;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .dashsum .ds-t{font-weight:900;color:#0f172a}
    .dashsum .ds-v{font-weight:700;white-space:nowrap}
    .dashsum .ds-v b{font-size:15px;color:#16a34a}
    .dashsum .ds-tg{margin-left:auto;color:#2563eb;font-weight:900}
    body:not(.dash-open) #dash{display:none}
    /* 進捗段階グループ（折りたたみ） */
    tr.grpRow.gHide,tr.detailrow.gHide{display:none!important}
    tr.clsgrp.stg{margin:10px 0 8px;cursor:pointer}
    tr.clsgrp.stg td{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e2e8f0;border-left:6px solid var(--cc);border-top:1px solid #e2e8f0;border-radius:12px;padding:13px 12px;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    tr.clsgrp.stg.sopen td{background:#f8fafc}
    tr.clsgrp.stg .cbadge{padding:2px 6px;margin-right:0;background:transparent!important;font-size:16px}
    tr.clsgrp.stg .ccount{margin-left:2px;font-size:14px;color:#0f172a;font-weight:900}
    tr.clsgrp.stg .stog{margin-left:auto;font-size:12px;font-weight:800;color:#2563eb;white-space:nowrap}
    .mcls{display:inline-block;color:#fff;font-weight:900;font-size:11px;border-radius:5px;padding:1px 7px;flex:0 0 auto}
    /* タブ：横スクロールせず4列のボタンで固定（指でぶれない） */
    html,body{overscroll-behavior-x:none}
    .wrap .tabs{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin:8px 0 14px;border-bottom:none;overflow:visible;touch-action:manipulation}
    .wrap .tabbtn{margin:0;grid-column:span 3;order:5;border:1px solid #e2e8f0;border-radius:8px;padding:5px 2px;font-size:10.5px;font-weight:700;color:#64748b;background:#f8fafc;line-height:1.2;white-space:normal;text-align:center;word-break:keep-all;overflow-wrap:anywhere;min-height:34px;display:flex;align-items:center;justify-content:center}
    /* 主役タブ＝点検・仕入候補・ETC：上段に大きく */
    .wrap .tabbtn[data-v="insp"],.wrap .tabbtn[data-v="proc"],.wrap .tabbtn[data-v="etc"],.wrap .tabbtn[data-v="tire"]{grid-column:span 3;min-height:52px;font-size:12.5px;font-weight:900;color:#0f172a;background:#fff;border:1.5px solid #cbd5e1;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .wrap .tabbtn .tl-l{display:none}.wrap .tabbtn .tl-s{display:inline}
    .wrap .tabbtn[data-v="karte"]{grid-column:span 12;order:0;min-height:52px;font-size:14px;font-weight:900;color:#0f172a;background:#fff;border:1.5px solid #cbd5e1;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .wrap .tabbtn[data-v="kpi"]{grid-column:span 12;order:0;min-height:44px;font-size:13px;font-weight:900;color:#0f172a;background:#fff;border:1.5px solid #cbd5e1;border-radius:12px}
    .wrap .tabbtn[data-v="insp"]{order:1}.wrap .tabbtn[data-v="tire"]{order:2}.wrap .tabbtn[data-v="proc"]{order:3}.wrap .tabbtn[data-v="etc"]{order:4}
    .wrap .tabbtn[data-v="karte"],.wrap .tabbtn[data-v="kpi"],.wrap .tabbtn[data-v="insp"]{grid-column:span 4;order:0;min-height:48px;font-size:13.5px}
    .wrap .tabbtn.on{background:#0f172a!important;color:#fff!important;border-color:#0f172a!important}
    #st{bottom:14px;left:8px;font-size:10px;padding:3px 8px;opacity:.75;pointer-events:none;max-width:calc(100% - 90px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card small{font-size:10.5px;line-height:1.45}
  }

tr.clsgrp td{background:#eef2f7;font-weight:800;color:#0f172a;padding:6px 10px;border-top:3px solid var(--cc);font-size:12px}
tr.clsgrp .cbadge{display:inline-block;color:#fff;padding:1px 9px;border-radius:5px;font-weight:900;margin-right:8px}

async function save(id,field,val){
  if(field==="url"&&val.trim()){const d=dupOf(val,id);if(d){render();flashRow(d.id);alert(dupMsg(d));return;}}
  const r=rows.find(x=>x.id===id); if(!r)return;
  const prev=r[field];                       // 保存失敗時の巻き戻し用
  r[field]=val; if(field==="status")renderDash();
  // ★ 変更した「その1項目だけ」を書く（他の項目・他の行は絶対に触らない）＋保存中はガード
  const pk=id+":"+field; pending.add(pk);
  const patch={updated_at:new Date().toISOString()}; patch[field]=val;
  const {error}=await sb.from("bt_procurement").update(patch).eq("id",id);
  pending.delete(pk);
  if(error){ r[field]=prev; render(); setStatus("⚠️ 保存失敗（変更を元に戻しました）"); return; }
  setStatus("保存OK "+new Date().toLocaleTimeString("ja-JP").slice(0,5));
  if(field==="status"){render();}         // 仕入OKで整備/現場/保険・クラス別確定数が変わる
  else if(field==="maint_status"){render();} // 整備OKで現場引き取りの表示が変わる
  else if(field==="vclass"){render();}      // クラス変更で並び替え・集計が変わる
  else if(field==="pickup_status"||field==="prep_status"||field==="sale_status"){const s=$("tb").querySelector(`tr[data-id="${id}"] select[data-f="${field}"]`);if(s)s.className="st "+(STCLS[val]||"stU");}
  else if(field==="pickup"){const s=$("tb").querySelector(`tr[data-id="${id}"] select[data-f="pickup"]`);if(s)s.className="st "+(MEIGICLS[val]||"meU");}
  else if(field==="insurance"){const s=$("tb").querySelector(`tr[data-id="${id}"] select[data-f="insurance"]`);if(s)s.className="st "+INSCLS[val];}
  else if(field==="op_start_date"){const c=$("tb").querySelector(`tr.grpRow[data-id="${id}"] td[data-lb="稼働開始"] .opd`);if(c){c.textContent=val?fmtMd(val):"—";c.className="opd"+(val?"":" z");}}
  else if(field==="memo"){const td=$("tb").querySelector(`tr.grpRow[data-id="${id}"] td[data-lb="車種"]`);if(td){let fl=td.querySelector(".memoflag");const has=val&&val.trim();if(has){if(!fl){fl=document.createElement("span");fl.className="memoflag";const mt=td.querySelector(".mtoggle");if(mt)mt.insertAdjacentElement("beforebegin",fl);else td.appendChild(fl);}const m=val.trim().replace(/\s+/g," ");const ok=/OK/.test(m);fl.className="memoflag"+(ok?" ok":"");fl.textContent=(ok?"✅ ":"🚩 ")+(m.length>18?m.slice(0,18)+"…":m);fl.title="メモ："+m;}else if(fl){fl.remove();}}}
  // ★ URLを貼付/変更したら自動で車種/年式/走行/価格/カラー/展示場所を取得
  if(field==="url"&&val.trim()&&/buddica\.jp\/usedcar/.test(val)){
    setStatus("URLから取得中…");
    const meta=await fetchMeta(val.trim());
    if(meta&&meta.found){
      const p={model:meta.model||r.model,year:meta.year||r.year,mileage:meta.mileage||r.mileage,price:meta.price||r.price,color:meta.color||r.color,location:meta.location||r.location,inquiry:meta.inquiry||r.inquiry,updated_at:new Date().toISOString()};
      if(meta.sold)p.status="NG";
      await sb.from("bt_procurement").update(p).eq("id",id); Object.assign(r,p); render(); setStatus(meta.sold?"SOLD OUT→NG":"取得OK "+(meta.model||""));
    } else { render(); setStatus("URL保存(情報は取得できず)"); }
  }
}

// 画像は長辺1600pxのJPEGに縮小してから保存（通信量・容量を抑える）。縮小できない形式はそのまま。
function inspShrink(file){return new Promise(res=>{try{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||file),"image/jpeg",0.82);};img.onerror=()=>{URL.revokeObjectURL(u);res(file);};img.src=u;}catch(e){res(file);}});}
