<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BUDDICA TOURISM 時間貸し（モック）</title>
<style>
:root{--org:#f26522;--org2:#ee6a1c;--bg:#0d0d0f;--card:#17171b;--card2:#1f1f25;--line:#2a2a31;--txt:#f5f5f7;--sub:#9a9aa5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5;padding-bottom:96px}
.wrap{max-width:520px;margin:0 auto}
.mockbar{background:#3a2410;color:#fcd9b6;text-align:center;font-size:11px;padding:6px 10px;letter-spacing:.5px}
/* hero */
.topbar{background:#0a0a0c;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.topbar .logo{height:26px;width:auto;display:block}
.topbar .cl{margin-left:auto;font-size:9px;letter-spacing:2px;color:var(--sub)}
.hero{position:relative;background:#0d0d0f;overflow:hidden}
.hero .kv{width:100%;display:block}
.herobody{padding:16px 18px 22px}
.badge{display:inline-block;background:var(--org);color:#fff;font-weight:800;font-size:11px;padding:4px 12px;border-radius:20px;letter-spacing:1px}
.hsub{color:var(--sub);font-size:13px;margin-top:10px}
.hpill{display:inline-flex;gap:6px;align-items:center;background:rgba(242,101,34,.12);border:1px solid rgba(242,101,34,.4);color:#ffd0b0;font-size:12px;font-weight:700;padding:5px 12px;border-radius:8px;margin-top:12px}
/* sections */
.sec{padding:22px 18px 6px}
.slabel{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:2px;color:var(--org);font-weight:800}
.slabel .no{background:var(--org);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-style:italic}
.stitle{font-size:19px;font-weight:800;margin:6px 0 14px}
/* date */
.field{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;color:var(--txt);width:100%;appearance:none}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.7)}
/* slots */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 6px;text-align:center;cursor:pointer;transition:.15s}
.slot .h{font-size:22px;font-weight:900}
.slot .l{font-size:10px;color:var(--sub);margin-top:2px}
.slot.on{border-color:var(--org);background:linear-gradient(180deg,rgba(242,101,34,.18),rgba(242,101,34,.04));box-shadow:0 0 0 3px rgba(242,101,34,.12)}
.slot.on .h{color:var(--org)}
.field.tc{text-align:center;text-align-last:center}
.datef{width:100%;background:linear-gradient(180deg,#1c1c22,#141418);border:1px solid #34343f;border-radius:16px;padding:16px 14px;font-size:17px;font-weight:700;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3);appearance:none}
.timepick{margin-top:10px;display:flex;align-items:flex-end;gap:10px;background:linear-gradient(180deg,#1c1c22,#141418);border:1px solid #34343f;border-radius:16px;padding:14px 14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.tcol{flex:1;text-align:center;min-width:0}
.tlab{font-size:11px;letter-spacing:3px;color:var(--org);font-weight:800;margin-bottom:7px}
.tbig{width:100%;background:#0e0e12;border:1px solid #3a3a46;border-radius:12px;color:#fff;font-size:21px;font-weight:800;text-align:center;text-align-last:center;padding:11px 2px;appearance:none;-webkit-appearance:none;letter-spacing:.5px;line-height:1}
.tbig:focus{border-color:var(--org);outline:none}
.tilde{color:#6a6a73;font-weight:800;font-size:20px;padding-bottom:16px}
.tcap{font-size:11px;color:#8a8a95;text-align:center;margin-top:13px;letter-spacing:.5px}
.flowline{text-align:center;font-size:12px;color:#9a9aa5;font-weight:600;margin:14px 0 4px;letter-spacing:.5px}
.flowline .fl-ico{color:var(--org);font-weight:900}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px;pointer-events:none;transition:.25s}
.tiers.dim{filter:grayscale(1);opacity:.55}
.tg{background:transparent;border:none;border-radius:10px;padding:7px 4px;text-align:center;opacity:.35;transition:.2s;cursor:default}
.tg b{display:block;font-size:15px;font-weight:800}
.tg span{font-size:10px;color:var(--sub)}
.tg.on{opacity:1;background:linear-gradient(180deg,rgba(242,101,34,.2),rgba(242,101,34,.04));border:1px solid var(--org);box-shadow:0 0 0 2px rgba(242,101,34,.22)}
.tg.on b{color:var(--org)}
.tg.on span{color:var(--org);font-weight:800}
.planbox{margin-top:14px;background:linear-gradient(180deg,#1b1b21,#141418);border:1px solid #30303a;border-radius:14px;padding:16px 18px;text-align:center}
.pl1{font-size:14px;font-weight:600;color:#c7c7d0;letter-spacing:.3px}
.pl1 b{color:#fff;font-weight:800}
.pl2{font-size:12px;color:#8a8a95;margin-top:9px;letter-spacing:1px;font-weight:600}
.pl2 b{display:inline-block;font-size:18px;color:var(--org);font-weight:900;letter-spacing:.5px;margin-left:4px}
.pl3{margin-top:13px;padding-top:13px;border-top:1px solid #30303a;font-size:13px;font-weight:600;color:#c7c7d0}
.pl3 .amt{display:block;color:var(--org);font-size:25px;font-weight:900;letter-spacing:.6px;margin-top:4px}
.pl3 .sub{display:block;font-size:11px;color:#8a8a95;font-weight:500;letter-spacing:.5px;margin-top:5px}
.tnote{font-size:11px;color:#6a6a73;text-align:center;margin-top:10px;letter-spacing:.3px}
/* car cards */
.cars{display:flex;flex-direction:column;gap:12px}
.car{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.15s}
.car.on{border-color:var(--org);box-shadow:0 0 0 3px rgba(242,101,34,.12)}
.car .pic{height:132px;background:radial-gradient(120% 130% at 70% 20%,#2c2c34,#141418);display:flex;align-items:center;justify-content:center;font-size:54px;position:relative;overflow:hidden}
.car .pic .carimg{height:118px;width:auto;max-width:94%;object-fit:contain;filter:drop-shadow(0 8px 9px rgba(0,0,0,.5))}
.car .cat{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);border:1px solid var(--line);color:#ddd;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.car .avail{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px}
.av-ok{background:rgba(34,197,94,.18);color:#4ade80;border:1px solid rgba(34,197,94,.4)}
.av-few{background:rgba(245,158,11,.18);color:#fbbf24;border:1px solid rgba(245,158,11,.4)}
.car .body{padding:12px 14px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.car .nm{font-size:17px;font-weight:800}
.car .mk{font-size:11px;color:var(--sub);margin-top:2px}
.car .price{text-align:right;white-space:nowrap}
.car .price .p{font-size:22px;font-weight:900;color:var(--org)}
.car .price .u{font-size:11px;color:var(--sub)}
.car .price .add{font-size:10px;color:var(--sub);margin-top:2px}
/* process */
.proc{background:#111;margin-top:22px;padding:24px 18px 30px}
.proc .ph{font-size:12px;letter-spacing:2px;color:var(--org);font-weight:800}
.proc .pt{font-size:20px;font-weight:900;margin:4px 0 16px}
.step{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.step .n{background:var(--org);color:#fff;width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.step .st{font-weight:800;font-size:14px}
.step .sd{font-size:12px;color:var(--sub);margin-top:2px}
.foot{padding:20px 18px 30px;text-align:center;color:var(--sub);font-size:11px}
.foot .logo{height:20px;width:auto;opacity:.9}
/* sticky bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(20,20,24,.97);border-top:1px solid var(--line);backdrop-filter:blur(8px);padding:10px 16px;z-index:20}
.bar .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;min-width:0}
.bar .sum .l1{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sum .l2{font-size:20px;font-weight:900}
.bar .sum .l2 small{font-size:11px;color:var(--sub);font-weight:600}
.bar .go{background:var(--org);color:#fff;font-weight:900;font-size:15px;border:none;border-radius:12px;padding:14px 20px;white-space:nowrap;cursor:pointer}
.bar .go:disabled{background:#3a3a42;color:#777}
.hint{font-size:11px;color:var(--sub);margin-top:8px;line-height:1.6}
/* ゲート（段階開示） */
.sec.gated{filter:grayscale(1);opacity:.4;pointer-events:none;transition:filter .35s,opacity .35s}
@keyframes pulseb{0%,100%{box-shadow:0 0 0 0 rgba(242,101,34,0)}50%{box-shadow:0 0 0 5px rgba(242,101,34,.32)}}
.sec.await #timepick,.sec.await .datef{animation:pulseb 1.7s ease-in-out infinite;border-color:var(--org)}
.gobtn{width:100%;margin-top:15px;background:var(--org);color:#fff;font-weight:900;font-size:15px;border:none;border-radius:12px;padding:15px;cursor:pointer;letter-spacing:.5px;box-shadow:0 4px 14px rgba(242,101,34,.3)}
.gobtn:active{transform:translateY(1px)}
</style></head>
<body>
<div class="mockbar">🖼 デザインモック（DB未接続・料金/写真は仮）</div>
<div class="wrap">
  <div class="topbar">
    <img src="images/bt-logo.png" class="logo" alt="BUDDICA TOURISM">
    <span class="cl">CAR AND LIFE.</span>
  </div>
  <div class="hero">
    <img src="images/bt-kv.png" class="kv" alt="BUDDICA TOURISM その旅にふさわしいクルマを。">
  </div>
  <div class="stepbar">
    <div class="st now">日時</div>
    <div class="st">お車</div>
    <div class="st">ご確認</div>
    <div class="st">お支払い</div>
  </div>

  <!-- STEP① 時間 -->
  <div class="sec await" id="sec1">
    <div class="slabel"><span class="no">1</span>まず、ご利用時間をお選びください</div>
    <input type="date" id="date" class="field tc datef">
    <div class="timepick" id="timepick">
      <div class="tcol">
        <div class="tlab">貸出</div>
        <select id="start" class="tbig"></select>
      </div>
      <span class="tilde">〜</span>
      <div class="tcol">
        <div class="tlab">返却</div>
        <select id="end" class="tbig"></select>
      </div>
    </div>
  </div>

  <div class="flowline"><span class="fl-ico">▼</span> 選んだ時間で、料金プランが決まります</div>

  <!-- STEP② プラン確定 -->
  <div class="sec gated" id="sec2">
    <div class="slabel"><span class="no">2</span>ご利用プランが確定します<span style="margin-left:auto;font-size:10px;color:#8a8a95;font-weight:600;letter-spacing:0">自動判定</span></div>
    <div class="tiers" id="tiers">
      <div class="tg" data-h="3"><b>3h</b><span data-sub="〜3時間">〜3時間</span></div>
      <div class="tg" data-h="6"><b>6h</b><span data-sub="〜6時間">〜6時間</span></div>
      <div class="tg" data-h="12"><b>12h</b><span data-sub="〜12時間">〜12時間</span></div>
      <div class="tg" data-h="24"><b>24h</b><span data-sub="〜1日">〜1日</span></div>
    </div>
    <div class="planbox">
      <div class="pl1" id="dur">貸出・返却のお時間をお選びください</div>
      <div class="pl2">ご利用プラン<b id="tier">—</b></div>
    </div>
    <div class="tnote">ご返却後3時間は点検・清掃のため、次のご予約はお受けできません</div>
  </div>

  <div class="foot"><img src="images/bt-logo.png" class="logo" alt="BUDDICA TOURISM"><div style="margin-top:8px">高松空港店｜お問い合わせ：reserve.touring@buddica.co.jp</div></div>
</div>

<div class="bar"><div class="in">
  <div class="sum"><div class="l1" id="sumL">まず、ご利用日時をお選びください</div><div class="l2" id="sumP" style="font-size:14px;color:#9a9aa5">日付・時間の選択でお進みいただけます</div></div>
  <button class="go" id="go" disabled>お車を選ぶ →</button>
</div></div>

<script>
var slot=0, dur=0;
function opts(sel,from,to){var h='<option value="" selected>--:--</option>';for(var m=from;m<=to;m+=30){var d=m>=1440?"翌":"";var mm2=m%1440;var hh=("0"+Math.floor(mm2/60)).slice(-2),mm=("0"+(mm2%60)).slice(-2);h+='<option value="'+m+'">'+d+hh+":"+mm+'</option>';}sel.innerHTML=h;}
opts(document.getElementById("start"),9*60,19*60);
opts(document.getElementById("end"),9*60+30,33*60);
// 日付・時間ともに初期未選択（セットで選ばせる）
function tierFor(h){return h<=3?3:h<=6?6:h<=12?12:24;}
function hhmm(m){m=((m%(24*60))+24*60)%(24*60);return ("0"+Math.floor(m/60)).slice(-2)+":"+("0"+(m%60)).slice(-2);}
function markTier(){var tgs=document.querySelectorAll("#tiers .tg");for(var k=0;k<tgs.length;k++){var on=(+tgs[k].getAttribute("data-h")===slot);tgs[k].classList.toggle("on",on);var sp=tgs[k].querySelector("span");if(sp)sp.textContent=on?"✓ ご希望":sp.getAttribute("data-sub");}}
function updateGate(){
  var s1=document.getElementById("sec1"),s2=document.getElementById("sec2");
  var dateOk=!!document.getElementById("date").value, ok=dateOk&&slot>0;
  s2.classList.toggle("gated",!ok);
  s1.classList.toggle("await",!ok);
  var g=document.getElementById("go"),L=document.getElementById("sumL"),P=document.getElementById("sumP");
  g.disabled=!ok;
  if(ok){L.textContent="ご利用プラン "+slot+"時間プラン";P.innerHTML='この日時でお車を選べます';}
  else{L.textContent="まず、ご利用日時をお選びください";P.innerHTML='日付・時間の選択でお進みいただけます';}
}
function recalc(){
  var sv=document.getElementById("start").value, ev=document.getElementById("end").value;
  var st=+sv, en=+ev;
  var dEl=document.getElementById("dur"), tEl=document.getElementById("tier"), box=document.getElementById("tiers");
  if(!sv||!ev){dEl.innerText="貸出・返却のお時間をお選びください";tEl.innerText="—";slot=0;if(box)box.classList.add("dim");markTier();updateGate();return;}
  if(box)box.classList.remove("dim");
  dur=(en-st)/60;
  if(dur<=0){dEl.innerText="返却は貸出より後のお時間をお選びください";tEl.innerText="—";slot=0;if(box)box.classList.add("dim");markTier();updateGate();return;}
  slot=tierFor(dur);
  var enTxt=(en>=24*60?"翌":"")+hhmm(en);
  dEl.innerHTML='ご利用 <b>'+hhmm(st)+' – '+enTxt+'</b> ・ '+(Number.isInteger(dur)?dur:dur.toFixed(1))+'時間';
  tEl.innerText=slot+"時間プラン";
  markTier();updateGate();
}
document.getElementById("date").addEventListener("change",recalc);
document.getElementById("start").addEventListener("change",recalc);
document.getElementById("end").addEventListener("change",recalc);
document.getElementById("go").addEventListener("click",function(){
  if(!document.getElementById("date").value||slot<=0)return;
  var q="d="+encodeURIComponent(document.getElementById("date").value)+"&s="+document.getElementById("start").value+"&e="+document.getElementById("end").value+"&slot="+slot;
  location.href="hourly-mock2.html?"+q;
});
recalc();

</script>
</body></html>
