<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>情報照会（OP ↔ マイページ）</title>
<style>
:root{--bg:#eef2f7;--card:#ffffff;--line:#d7dee8;--txt:#1e293b;--sub:#64748b;--accent:#2563eb;--ok:#16a34a;--warn:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h1{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg button,.btn{background:#fff;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.tg.on{background:#fee2e2;border-color:var(--warn);color:#b91c1c}
.meta{color:var(--sub);font-size:12px;margin-left:auto}
.wrap{padding:10px 10px 60px;max-width:960px;margin:0 auto}
.moretog{display:block;width:100%;text-align:center;background:#f1f5f9;color:var(--sub);border:none;border-top:1px solid var(--line);padding:9px;font-size:12px;font-weight:700;cursor:pointer}
.moretog:active{background:#e2e8f0}
@media(max-width:560px){
  .wrap{padding:8px 7px 60px}
  h1{font-size:15px}
  th{width:72px;font-size:11px;padding:8px 6px}
  td{padding:8px 6px;font-size:13px}
  .chead{padding:9px 10px;gap:6px}
  .rid{font-size:14px}
  .pill{font-size:10px;padding:3px 6px}
  .seg button,.btn{padding:9px 12px}
}
.legend{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12px;color:var(--sub);line-height:1.7;margin-bottom:12px}
.legend b{color:#1e293b}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0;margin-bottom:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card.diff{border-color:#f0a5a5}
.chead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:#f8fafc;border-bottom:1px solid var(--line)}
.rid{font-weight:800;font-size:15px}
.nm{font-weight:700}
.pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;background:#eef2f7;color:#475569;border:1px solid #d7dee8}
.pill.rec{background:#ecfdf5;color:#047857;border-color:#a7f3d0}
.pill.airport{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.pill.deliv{background:#fffbeb;color:#b45309;border-color:#fde68a}
.pill.und{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
.pill.hdm{background:#eef2ff;color:#3730a3;border-color:#c7d2fe}
.pill.buddica{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}
a.mplink{font-size:12px;font-weight:800;padding:5px 11px;border-radius:8px;background:var(--accent);color:#fff;border:1px solid var(--accent);text-decoration:none;white-space:nowrap}
a.mplink:active{opacity:.8}
.dbadge{margin-left:auto;font-size:12px;font-weight:800;color:var(--warn)}
.dbadge.ok{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{width:94px;color:var(--sub);font-weight:700;background:#f8fafc}
td.op,td.mp{width:calc((100% - 94px)/2)}
.colh th,.colh td{font-size:11px;color:var(--sub);font-weight:700;padding:6px 10px;background:#f1f5f9}
tr.d td{background:#fff7f7}
tr.d th{color:#b91c1c;background:#fef2f2}
td.okc{background:#dcfce7 !important;box-shadow:inset 5px 0 0 var(--ok);color:#14532d;font-weight:800}
td.ngc{background:#fee2e2 !important;box-shadow:inset 5px 0 0 var(--warn);color:#7f1d1d;font-weight:800}
td.chkc{background:#fef3c7 !important;box-shadow:inset 5px 0 0 #f59e0b;color:#78350f;font-weight:800}
.tag{display:inline-block;font-size:11px;font-weight:900;padding:2px 8px;border-radius:6px;margin-right:6px;vertical-align:1px}
.tag.ok{background:var(--ok);color:#fff}
.tag.ng{background:var(--warn);color:#fff}
.tag.chk{background:#f59e0b;color:#fff}
tr.rsn td{background:#f8fafc;color:#475569;font-size:11.5px;padding:6px 10px 9px;line-height:1.55}
tr.act td{background:#fffbeb;color:#7c5a09;font-size:12.5px;padding:8px 10px 9px;line-height:1.6;border-bottom:1px solid #fde68a}
tr.act b{color:#92400e}
.fixbar{background:#fef2f2;border-bottom:2px solid var(--warn);padding:10px 12px;font-size:13px;line-height:1.65;color:#991b1b}
.fixbar b{color:#b91c1c}.fixbar .g{color:#047857;font-weight:900}
.val{white-space:pre-wrap;word-break:break-word}
.empty{color:#94a3b8;font-style:italic}
.mm{color:var(--warn);font-weight:800}
.hint{font-size:11px;color:var(--sub);margin-top:2px}
.note{background:#fff;border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--sub)}
.count{font-size:12px;color:var(--sub);margin:2px 0 10px}
</style>
</head>
<body>
<header>
  <h1>🔍 情報照会 <span style="font-size:12px;font-weight:600;color:var(--sub)">OP ↔ マイページ/ご利用ガイド</span></h1>
  <div class="bar">
    <div class="seg" id="storeSeg"></div>
    <button class="btn tg on" id="diffTg" onclick="toggleDiff()">⚠️ 相違のみ</button>
    <button class="btn" onclick="load()">↻ 更新</button>
    <span class="meta" id="meta">—</span>
  </div>
</header>
<div class="wrap">
  <div class="legend">
    <b>OP（配車表）＝マイページ が一致しているかの監視画面。</b>本来この2つは同じ情報を映すので<b>一致するのが当たり前</b>（＝ほぼ <span style="color:#047857;font-weight:800">✅一致</span>）。<br>
    <b>⚠️不一致が出たら</b>＝どこかにまだズレが残っている合図。その時は<b>台帳（audit_log）の最終更新</b>で自動判定します：<span class="g" style="color:#047857">新しく書かれた方＝正</span>／<span style="color:#b91c1c;font-weight:800">古い方＝誤（システム側の対応漏れ）</span>。人でなく記録が正誤を決めます。
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>
<script>
const MAIN='https://ckrxttbnawkclshczsia.supabase.co', MANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
const BTSB='https://ggqugvyskyiblxiycpci.supabase.co', BTANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18';
// 店別マッピング（OP=タスク列／予約=マイページ源）
const CFG={
  // model: 'mixed'(那覇=送迎+お届け・お届け先で判定) / 'delivery'(札幌=お届け専門・常にDEL/COL) / 'shuttle'(高松=空港送迎のみ・常にPUB/BDB)
  nha:{sb:MAIN,anon:MANON,name:'那覇',model:'mixed',res:'nha_reservations',task:'nha_tasks',tkey:'予約番号',jp:true,
       delType:'内容',delPlace:'送迎場所',delTime:'時間',colType:'内容',colPlace:'集客',colTime:'時間',ins:'確定',c:'C',j:'J',b:'B',sdate:'start_date',edate:'end_date',
       mpLabel:'📱 マイページ',mpUrl:t=>'https://nosh2318.github.io/naha-project/my-nha.html?t='+t+'&ro=1'},
  spk:{sb:MAIN,anon:MANON,name:'札幌',model:'delivery',res:'reservations',task:'tasks',tkey:'reservation_id',jp:false,
       delType:'type',delPlace:'place',delTime:'time',colType:'type',colPlace:'col_place',colTime:'time',ins:'insurance',c:'opt_c',j:'opt_j',b:'opt_b',sdate:'lend_date',edate:'return_date',
       mpLabel:'📱 マイページ',mpUrl:t=>'https://nosh2318.github.io/spk-task/my.html?t='+t+'&ro=1'},
  bt_hdm:{sb:BTSB,anon:BTANON,name:'高松HDM',model:'shuttle',res:'bt_reservations',task:'bt_tasks',tkey:'予約番号',jp:true,brand:'HDM',
       delType:'内容',delPlace:'送迎場所',delTime:'時間',colType:'内容',colPlace:'集客',colTime:'時間',ins:'確定',c:'C',j:'J',b:'B',sdate:'start_date',edate:'end_date',
       mpLabel:'📱 マイページ',mpUrl:t=>'https://rent-handyman.com/my-tkm.html?t='+t},
  bt_buddica:{sb:BTSB,anon:BTANON,name:'高松BUDDICA',model:'shuttle',res:'bt_reservations',task:'bt_tasks',tkey:'予約番号',jp:true,brand:'BUDDICA',
       delType:'内容',delPlace:'送迎場所',delTime:'時間',colType:'内容',colPlace:'集客',colTime:'時間',ins:'確定',c:'C',j:'J',b:'B',sdate:'start_date',edate:'end_date',
       mpLabel:'📖 ご利用ガイド',mpUrl:t=>'https://buddica-touring.github.io/app/guide/?t='+t}
};
// オリジン別：BTは別Supabase＆別ログイン → BTリポ配信時のみ高松(HDM/BUDDICA)。nosh2318オリジン(那覇/札幌)はmainトークン共有
const STORES = location.hostname.indexOf('buddica')>=0 ? ['bt_hdm','bt_buddica'] : ['nha','spk'];
let STORE=(new URLSearchParams(location.search).get('store')||STORES[0]).toLowerCase();
if(STORE==='bt')STORE='bt_hdm'; // 旧リンク互換
if(STORES.indexOf(STORE)<0)STORE=STORES[0];
let DIFFONLY=true, C=CFG[STORE];

function _sbToken(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('sb-')===0&&k.indexOf('auth-token')>=0){let v=null;try{v=JSON.parse(localStorage.getItem(k));}catch(e){continue;}const t=(v&&v.access_token)||(v&&v.currentSession&&v.currentSession.access_token)||(v&&v.session&&v.session.access_token)||(Array.isArray(v)&&typeof v[0]==='string'?v[0]:null);if(t)return t;}}}catch(e){}return null;}
async function sel(path){const tok=_sbToken();const H={apikey:C.anon};if(tok)H.Authorization='Bearer '+tok;const r=await fetch(C.sb+'/rest/v1/'+path,{headers:H});if(!r.ok)throw new Error(path+' '+r.status);return r.json();}
async function rpc(fn,args){const tok=_sbToken();const H={apikey:C.anon,'Content-Type':'application/json'};if(tok)H.Authorization='Bearer '+tok;const r=await fetch(C.sb+'/rest/v1/rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(args||{})});if(!r.ok)throw new Error(fn+' '+r.status);return r.json();}
// 台帳(audit_log)で各不一致項目の「最終更新時刻」を引き、新しい方=正／古い方=誤 を確定する
async function applyAudit(rows){
  const diffRows=rows.filter(x=>x.nDiff>0);
  if(!diffRows.length)return;
  const resIds=diffRows.map(x=>x.r.id);
  const taskIds=[]; diffRows.forEach(x=>{taskIds.push('d-'+x.r.id,'c-'+x.r.id);});
  let aud=[];
  try{ aud=await rpc(C.brand?'bt_reconcile_audit':'reconcile_audit',{p_res:resIds,p_tasks:taskIds}); }catch(e){ return; }
  const M={}; (aud||[]).forEach(a=>{ (M[a.row_id]=M[a.row_id]||{})[a.k]=a.last_at; });
  diffRows.forEach(x=>{
    x.fields.forEach(f=>{
      if(!f.diff||!f.map)return;
      const opRowId=f.map.opRow+x.r.id;
      let opAt=null; f.map.op.forEach(col=>{const t=M[opRowId]&&M[opRowId][col]; if(t&&(!opAt||t>opAt))opAt=t;});
      const mpAt=(M[x.r.id]&&M[x.r.id][f.map.mp])||null;
      f.opAt=opAt; f.mpAt=mpAt;
      f.correct=(opAt&&mpAt)?(opAt>mpAt?'op':'mp'):(opAt?'op':(mpAt?'mp':null));
    });
  });
}
function q(s){return encodeURIComponent(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

function buildSeg(){document.getElementById('storeSeg').innerHTML=STORES.map(s=>`<button class="${s===STORE?'on':''}" onclick="setStore('${s}')">${CFG[s].name}</button>`).join('');if(STORES.length<2)document.getElementById('storeSeg').style.display='none';}
function setStore(s){STORE=s;C=CFG[s];history.replaceState(null,'','?store='+s);buildSeg();load();}
function toggleDiff(){DIFFONLY=!DIFFONLY;document.getElementById('diffTg').classList.toggle('on',DIFFONLY);render();}

// 場所の種別（空港/実場所/未確定）→ 推奨区分
function placeKind(p){p=(p||'').trim();if(!p)return'und';if(/空港/.test(p))return'airport';return'deliv';}
function recVisit(delp){const k=placeKind(delp);return k==='airport'?'送迎(PUB)':k==='deliv'?'お届け(DEL)':'未確定';}
function recReturn(colp){const k=placeKind(colp);return k==='airport'?'送迎(BDB)':k==='deliv'?'お届け(COL)':'未確定';}
// 区分の正規化（表記ゆれを吸収して比較）
function normVt(v){v=(v||'').trim();if(!v)return'';if(/^DEL|delivery|お届け/i.test(v))return'DEL';if(/^PUB|^PU|来店|送迎/i.test(v))return'PU';if(/^COL|回収/i.test(v))return'COL';if(/^BDB|^BD|返却/i.test(v))return'BD';return v;}
function normPlace(p){return (p||'').replace(/[　\s]/g,'').trim();}
function normTime(t){return (t||'').trim();}
function seatN(v){if(v===true)return 1;const n=parseInt(v,10);return isNaN(n)?0:n;}

let ROWS=[];
async function load(){
  C=CFG[STORE];
  const list=document.getElementById('list'); list.innerHTML='<div class="note">読み込み中…</div>';
  document.getElementById('count').textContent='';
  const tok=_sbToken();
  if(!tok){list.innerHTML='<div class="note">🔒 先にアプリ本体にログインしてから、この画面を開いてください。</div>';return;}
  try{
    const today=new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);
    // 未来(利用中〜これから)の予約（BTはブランドで絞る）
    const bf=C.brand?`&brand=eq.${q(C.brand)}`:'';
    const res=await sel(`${C.res}?${q(C.edate)}=gte.${today}${bf}&select=*&order=${q(C.sdate)}.asc&limit=400`);
    const active=res.filter(r=>{const st=(r.status||'').trim();return !['キャンセル','cancelled','cancel'].includes(st);});
    // タスク(d-/c-)を一括取得
    const ids=active.map(r=>r.id);
    let tasks=[];
    for(let i=0;i<ids.length;i+=80){
      const chunk=ids.slice(i,i+80);
      const inl='('+chunk.map(x=>'"'+x.replace(/"/g,'')+'"').join(',')+')';
      const t=await sel(`${C.task}?${q(C.tkey)}=in.${q(inl)}&deleted=is.false&select=*`);
      tasks=tasks.concat(t);
    }
    const byRid={};
    tasks.forEach(t=>{const rid=t[C.tkey];const id=(t._id||'');(byRid[rid]=byRid[rid]||{})[id.slice(0,2)]=t;});
    ROWS=active.map(r=>buildRow(r,byRid[r.id]||{}));
    render(); // まず一致確認を即表示
    await applyAudit(ROWS); // 台帳で不一致の正誤(新しい方=正)を確定
    document.getElementById('meta').textContent=C.name+'｜'+active.length+'件｜'+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    render();
  }catch(e){list.innerHTML='<div class="note">読み込みに失敗しました：'+esc(e.message)+'<br>（アプリのログインが切れている場合は本体を開き直してください）</div>';}
}

function buildRow(r,tk){
  const d=tk['d-']||{}, c=tk['c-']||{};
  // OP側（タスク値）
  const op={
    delType:d[C.delType]||'', delPlace:d[C.delPlace]||'', delTime:d[C.delTime]||'',
    colType:c[C.colType]||'', colPlace:c[C.colPlace]||'', colTime:c[C.colTime]||'',
    ins:d[C.ins]||c[C.ins]||'', c:seatN(d[C.c]), j:seatN(d[C.j]), b:seatN(d[C.b]),
    hasTask:!!(tk['d-']||tk['c-'])
  };
  // マイページ側（予約値＝お客様が見る）
  const mp={
    delType:r.visit_type||'', delPlace:r.del_place||'', delTime:r.del_time||r.lend_time||'',
    colType:r.return_type||'', colPlace:r.col_place||'', colTime:r.col_time||r.return_time||'',
    ins:r.insurance||'', c:seatN(r.opt_c), j:seatN(r.opt_j), b:seatN(r.opt_b)
  };
  // 区分の正解＝店モデルで確定。mixed(那覇)のみお届け先(場所)で判定。delivery(札幌)=常にお届け／shuttle(高松)=常に送迎
  const model=C.model||'mixed';
  const delKind=placeKind(r.del_place||op.delPlace), colKind=placeKind(r.col_place||op.colPlace);
  let delCorrect,colCorrect,delReason,colReason,delLabel,colLabel;
  if(model==='delivery'){ // 札幌＝デリバリー専門（送迎なし）
    delCorrect='DEL';colCorrect='COL';delLabel='お届け(DEL)';colLabel='お届け回収(COL)';
    delReason='札幌はお届け（デリバリー）専門 → お届け(DEL)が正';colReason='札幌はお届け（デリバリー）専門 → お届け回収(COL)が正';
  }else if(model==='shuttle'){ // 高松＝空港送迎のみ（お届けなし）
    delCorrect='PU';colCorrect='BD';delLabel='送迎(PUB)';colLabel='送迎(BDB)';
    delReason='高松は空港送迎のみ → 送迎(PUB)が正';colReason='高松は空港送迎のみ → 送迎(BDB)が正';
  }else{ // 那覇＝送迎＋お届け（お届け先で判定）
    delCorrect=delKind==='deliv'?'DEL':delKind==='airport'?'PU':null;
    colCorrect=colKind==='deliv'?'COL':colKind==='airport'?'BD':null;
    delLabel=delKind==='deliv'?'お届け(DEL)':delKind==='airport'?'送迎(PUB)':'';
    colLabel=colKind==='deliv'?'お届け回収(COL)':colKind==='airport'?'送迎(BDB)':'';
    delReason=delKind==='deliv'?('お届け先＝「'+(r.del_place||op.delPlace)+'」＝実場所 → お届け(DEL)が正'):delKind==='airport'?'お届け先＝空港 → 送迎(PUB)が正':'お届け先が未入力 → 区分は未確定（お客様に確認）';
    colReason=colKind==='deliv'?('回収先＝「'+(r.col_place||op.colPlace)+'」＝実場所 → お届け回収(COL)が正'):colKind==='airport'?'回収先＝空港 → 送迎(BDB)が正':'回収先が未入力 → 区分は未確定';
  }
  // 監査キー: mp=予約(マイページ側)の列 / opRow=OPタスクの行(d-/c-) / op=OPタスク側の列(複数可・最終更新はmax)
  const TM=C.jp?['変更']:[]; // NHA/BTは時間の手動編集が「変更」列にも入る
  const A={
    'お届け区分':{mp:'visit_type',opRow:'d-',op:[C.delType]},
    'お届け場所':{mp:'del_place',opRow:'d-',op:[C.delPlace]},
    'お届け時間':{mp:'del_time',opRow:'d-',op:[C.delTime].concat(TM)},
    '回収区分':{mp:'return_type',opRow:'c-',op:[C.colType]},
    '回収場所':{mp:'col_place',opRow:'c-',op:[C.colPlace]},
    '回収時間':{mp:'col_time',opRow:'c-',op:[C.colTime].concat(TM)},
    '補償':{mp:'insurance',opRow:'d-',op:[C.ins]},
    'ｼｰﾄCS':{mp:'opt_c',opRow:'d-',op:[C.c]},
    'ｼｰﾄJS':{mp:'opt_j',opRow:'d-',op:[C.j]},
    'ｼｰﾄBS':{mp:'opt_b',opRow:'d-',op:[C.b]}
  };
  const fields=[
    {k:'お届け区分',a:op.delType,b:mp.delType,cmp:(x,y)=>normVt(x)===normVt(y)},
    {k:'お届け場所',a:op.delPlace,b:mp.delPlace,cmp:(x,y)=>normPlace(x)===normPlace(y)},
    {k:'お届け時間',a:op.delTime,b:mp.delTime,cmp:(x,y)=>normTime(x)===normTime(y)},
    {k:'回収区分',a:op.colType,b:mp.colType,cmp:(x,y)=>normVt(x)===normVt(y)},
    {k:'回収場所',a:op.colPlace,b:mp.colPlace,cmp:(x,y)=>normPlace(x)===normPlace(y)},
    {k:'回収時間',a:op.colTime,b:mp.colTime,cmp:(x,y)=>normTime(x)===normTime(y)},
    {k:'補償',a:op.ins,b:mp.ins,cmp:(x,y)=>String(x).trim()===String(y).trim()},
    {k:'ｼｰﾄCS',a:op.c,b:mp.c,cmp:(x,y)=>x===y},
    {k:'ｼｰﾄJS',a:op.j,b:mp.j,cmp:(x,y)=>x===y},
    {k:'ｼｰﾄBS',a:op.b,b:mp.b,cmp:(x,y)=>x===y}
  ];
  // 不一致＝両方入力済みで食い違う時だけ。正誤は台帳(最終更新)で load() が後から確定する。
  const isEmpty=v=>(v===''||v==null||v===0);
  fields.forEach(f=>{
    f.correct=null; f.map=A[f.k];
    f.diff=(!isEmpty(f.a)&&!isEmpty(f.b))?!f.cmp(f.a,f.b):false;
  });
  const nDiff=fields.filter(f=>f.diff).length;
  return {r,op,mp,fields,nDiff};
}

function render(){
  const list=document.getElementById('list');
  let rows=ROWS.slice();
  if(DIFFONLY)rows=rows.filter(x=>x.nDiff>0);
  const total=ROWS.length, diffTotal=ROWS.filter(x=>x.nDiff>0).length;
  document.getElementById('count').innerHTML=`全 ${total} 件中 <b class="mm">相違 ${diffTotal} 件</b>`+(DIFFONLY?'（相違のみ表示中）':'');
  if(!rows.length){list.innerHTML='<div class="note">'+(DIFFONLY?'✅ 相違はありません（OPとマイページは一致）':'表示する予約がありません')+'</div>';return;}
  list.innerHTML=rows.map(cardHtml).join('');
}

function cellHtml(side,f,raw){
  const empty=(raw===''||raw==null);
  const v=empty?'<span class="empty">（空）</span>':esc(raw);
  if(!f.diff)return `<td class="${side} val">${v}</td>`;
  // 台帳で確定：新しい方=正／古い方=誤。台帳が引けない時のみ「不一致」。
  let cls=side+' val', tag='';
  if(f.correct===side){cls+=' okc';tag='<span class="tag ok">正（新）</span>';}
  else if(f.correct && f.correct!==side && !empty){cls+=' ngc';tag='<span class="tag ng">古い（誤）</span>';}
  else if(!empty){cls+=' chkc';tag='<span class="tag chk">不一致</span>';}
  return `<td class="${cls}">${tag}${v}</td>`;
}
function actionOf(f){
  if(!f.diff)return '';
  if(f.correct==='op'||f.correct==='mp'){
    const okSide=f.correct==='op'?'OP（配車表）':'マイページ';
    const at=f.correct==='op'?f.opAt:f.mpAt;
    return `🧭 台帳の最終更新＝<b>${okSide}が新しい＝正</b>${at?'（'+esc(String(at).replace('T',' ').slice(5,16))+'）':''}。もう片方は古い値。本来は一致するはずの項目で、システム側の対応漏れの合図です。`;
  }
  return `⚠️ ${esc(f.k)}が不一致（台帳で最終更新を特定できず＝要調査）。`;
}
function rowHtml(f){
  const main=`<tr class="${f.diff?'d':''}"><th>${f.k}${f.diff?' <span class="mm">≠</span>':''}</th>${cellHtml('op',f,f.a)}${cellHtml('mp',f,f.b)}</tr>`;
  const act=f.diff?`<tr class="rsn act"><th></th><td colspan="2">${actionOf(f)}</td></tr>`:'';
  return main+act;
}
let _open={}; // 展開状態（予約IDごと）
function tglCard(id){_open[id]=!_open[id];render();}
function cardHtml(x){
  const r=x.r, kind=placeKind(r.del_place||x.op.delPlace);
  const kindPill=kind==='airport'?'<span class="pill airport">空港＝送迎</span>':kind==='deliv'?'<span class="pill deliv">実場所＝お届け</span>':'<span class="pill und">お届け先未入力</span>';
  const diffF=x.fields.filter(f=>f.diff), sameF=x.fields.filter(f=>!f.diff);
  const open=!!_open[r.id];
  const fixbar='';
  // 相違ありカード＝相違項目を常時表示・一致項目は折りたたみ。相違なしカード＝全項目は折りたたみ。
  let bodyRows, moreCount, moreLabel;
  if(x.nDiff){ bodyRows=diffF.map(rowHtml).join('')+(open?sameF.map(rowHtml).join(''):''); moreCount=sameF.length; moreLabel=open?'一致項目を隠す ▲':('一致項目も表示（'+moreCount+'） ▼'); }
  else{ bodyRows=open?x.fields.map(rowHtml).join(''):''; moreCount=x.fields.length; moreLabel=open?'閉じる ▲':('全項目を表示（'+moreCount+'） ▼'); }
  const colh=(x.nDiff||open)?`<tr class="colh"><th></th><td>🚗 OP（配車表）</td><td>📱 マイページ（お客様）</td></tr>`:'';
  const more=moreCount>0?`<button class="moretog" onclick="tglCard('${esc(r.id).replace(/'/g,"")}')">${moreLabel}</button>`:'';
  return `<div class="card ${x.nDiff?'diff':''}">
    <div class="chead">
      <span class="rid">${esc(r.id)}</span>
      <span class="nm">${esc(r.name||'')}</span>
      <span class="pill">${esc(r.ota||'')}</span>
      <span class="pill">${esc(r[C.sdate]||'')} 〜 ${esc(r[C.edate]||'')}</span>
      ${kindPill}
      <span class="pill rec">推奨: ${recVisit(r.del_place||x.op.delPlace)} / ${recReturn(r.col_place||x.op.colPlace)}</span>
      ${(C.mpUrl&&r.mypage_token)?`<a class="mplink" href="${C.mpUrl(esc(r.mypage_token))}" target="_blank" rel="noopener">${C.mpLabel}を開く</a>`:''}
      <span class="dbadge ${x.nDiff?'':'ok'}">${x.nDiff?('⚠️ 相違 '+x.nDiff+'項目'):'✅ 一致'}</span>
    </div>
    ${fixbar}
    ${(bodyRows)?`<table>${colh}${bodyRows}</table>`:''}
    ${more}
  </div>`;
}
buildSeg();load();
</script>
</body>
</html>
