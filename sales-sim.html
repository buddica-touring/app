<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>売上・稼働 3ヶ月アウトルック｜高松店</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f8fafc;color:#0f172a;font-size:14px}
  .wrap{max-width:820px;margin:0 auto;padding:12px 10px 70px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:12px;overflow:hidden}
  .card h2{margin:0;padding:11px 13px;font-size:14px;font-weight:800;background:#1e293b;color:#fff;display:flex;align-items:center;gap:8px}
  .card .bd{padding:8px 10px}
  .note{font-size:11px;color:#64748b;padding:0 2px 8px}
  .rst{margin-left:auto;font-size:11px;color:#cbd5e1;text-decoration:none;font-weight:700}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:662px;table-layout:fixed}
  th,td{padding:6px 6px;text-align:right;border-bottom:1px solid #f1f5f9;white-space:nowrap}
  th{background:#f1f5f9;color:#475569;font-weight:700;font-size:11px;border-bottom:1px solid #e2e8f0}
  td.l,th.l{text-align:left;white-space:normal;overflow:hidden;text-overflow:ellipsis}
  .avg{background:#f8fafc;font-weight:800;color:#0f172a}
  .sep{border-left:2px solid #e2e8f0}
  .cls{display:inline-block;min-width:18px;text-align:center;font-weight:800;color:#fff;border-radius:5px;padding:0 5px;font-size:11px}
  .gh td{background:#eef2f7;color:#334155;font-weight:800;text-align:left;font-size:12px;padding:6px 8px}
  .tot td{background:#f8fafc;font-weight:800;border-top:2px solid #cbd5e1}
  .sub{font-size:10px;color:#94a3b8}
  .st{display:none;margin:10px;padding:10px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;color:#b91c1c;font-size:12.5px}
  .dim{color:#94a3b8}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>📊 売上・稼働 3ヶ月アウトルック — 🚐高松店 <a class="rst" href="#" onclick="reload_();return false">🔄 更新</a></h2>
    <div class="bd">
      <div class="note" id="note">読み込み中…</div>
      <div class="scroll" id="area"><div style="padding:12px;color:#94a3b8">読み込み中…</div></div>
      <div class="note" style="padding-top:8px">当月/翌月/翌々月＝各月の予約(配車表)から算出。<b>稼働率＝その月の予約日数÷月の日数</b>（複数月にまたがる予約は日割り）。<b>売上＝その月に配分した予約売上</b>（日割り按分・基本＋オプション−割引）。<b>平均＝3ヶ月の平均</b>。キャンセルは除外。</div>
    </div>
  </div>
  <div id="status" class="st"></div>
</div>

<script>
const BT_SB='https://ggqugvyskyiblxiycpci.supabase.co';
const BT_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18';
const CLASS_ORDER=['AA','A','B','C','D','E','F','G','H'];
const CO=t=>{const i=CLASS_ORDER.indexOf(t||'');return i<0?99:i;};
const CLSCOL={AA:'#b45309',A:'#7c3aed',B:'#0284c7',C:'#0284c7',D:'#d97706',E:'#0d9488',F:'#059669',G:'#475569',H:'#64748b'};
const pad2=n=>String(n).padStart(2,'0');
const g=id=>document.getElementById(id);
const pct=n=>(Math.round(n)||0)+'%';
const man=n=>{if(!n||n<=0)return '<span class="dim">—</span>';const v=n/10000;return (v<10?(Math.round(v*10)/10):Math.round(v))+'万';};
let VEH=[], ACT={MS:[],byV:{},upd:''};

function _sbToken(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('sb-')===0&&k.indexOf('auth-token')>=0){let v=null;try{v=JSON.parse(localStorage.getItem(k));}catch(e){continue;}const t=(v&&v.access_token)||(v&&v.currentSession&&v.currentSession.access_token)||(v&&v.session&&v.session.access_token)||(Array.isArray(v)&&typeof v[0]==='string'?v[0]:null);if(t)return t;}}}catch(e){}return null;}
function H(){const t=_sbToken();return {apikey:BT_ANON,Authorization:'Bearer '+(t||BT_ANON)};}

async function fetchVeh(){
  const r=await fetch(BT_SB+'/rest/v1/bt_vehicles?select=code,name,plate_no,type&active=eq.true&order=type.asc,name.asc',{headers:H()});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return await r.json();
}
async function fetchData(){
  const now=new Date();
  const [fl,rs]=await Promise.all([
    fetch(BT_SB+'/rest/v1/bt_fleet?select=reservation_id,vehicle_code',{headers:H()}).then(r=>r.json()),
    fetch(BT_SB+'/rest/v1/bt_reservations?select=id,base_price,option_price,discount,price,start_date,end_date,status',{headers:H()}).then(r=>r.json())
  ]);
  const CX=['cancelled','キャンセル','cancel'];
  const byId={};
  (rs||[]).forEach(x=>{if(CX.indexOf(String(x.status||''))>=0)return;if(!x.start_date||!x.end_date)return;
    const bp=+x.base_price||0,op=+x.option_price||0,d=+x.discount||0;x._rev=(bp>0||op>0)?Math.max(0,bp+op-d):(+x.price||0);byId[x.id]=x;});
  // 当月・翌月・翌々月
  const MS=[];let y=now.getFullYear(),m=now.getMonth()+1;
  for(let i=0;i<3;i++){let yy=y,mm=m+i;while(mm>12){mm-=12;yy++;}MS.push({y:yy,m:mm,dim:new Date(yy,mm,0).getDate(),ms:new Date(yy,mm-1,1),me:new Date(yy,mm,0)});}
  const byV={};
  (fl||[]).forEach(f=>{const r=byId[f.reservation_id];if(!r)return;const v=f.vehicle_code;
    const sp=String(r.start_date).slice(0,10).split('-'),ep=String(r.end_date).slice(0,10).split('-');
    const s=new Date(+sp[0],+sp[1]-1,+sp[2]),e=new Date(+ep[0],+ep[1]-1,+ep[2]);
    if(isNaN(s.getTime())||isNaN(e.getTime())||e<s||(e-s)/86400000>=400)return;
    const total=Math.floor((e-s)/86400000)+1;
    if(!byV[v])byV[v]={d:[0,0,0],r:[0,0,0]};
    MS.forEach((M,i)=>{const from=s>M.ms?s:M.ms,to=e<M.me?e:M.me;const dc=to>=from?Math.floor((to-from)/86400000)+1:0;if(dc>0){byV[v].d[i]+=dc;byV[v].r[i]+=r._rev*(dc/total);}});
  });
  ACT={MS,byV,upd:now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})};
  if(g('note'))g('note').textContent='配車表(予約)から自動集計 ｜ 対象 '+MS.map(x=>x.m+'月').join(' / ')+' ｜ 最終更新 '+ACT.upd+' 🟢オンタイム';
}
function render(){
  const MS=ACT.MS||[],byV=ACT.byV||{};if(!MS.length)return;
  const dim=MS.map(x=>x.dim);
  const uCells=(d)=>{const ut=d.map((dd,i)=>dim[i]?dd/dim[i]*100:0);const av=(ut[0]+ut[1]+ut[2])/3;
    return '<td>'+pct(ut[0])+'</td><td>'+pct(ut[1])+'</td><td>'+pct(ut[2])+'</td><td class="avg">'+pct(av)+'</td>';};
  const rCells=(r)=>{const av=(r[0]+r[1]+r[2])/3;
    return '<td class="sep">'+man(r[0])+'</td><td>'+man(r[1])+'</td><td>'+man(r[2])+'</td><td class="avg">'+man(av)+'</td>';};
  const rowHtml=v=>{const a=byV[v.code]||{d:[0,0,0],r:[0,0,0]};const col=CLSCOL[v.type]||'#64748b';
    return '<tr><td class="l">'+(v.name||v.code)+' <span class="sub">'+(v.plate_no||'')+'</span></td>'
      +'<td><span class="cls" style="background:'+col+'">'+(v.type||'')+'</span></td>'+uCells(a.d)+rCells(a.r)+'</tr>';};
  const totRow=(list,label,cls)=>{const n=list.length;const D=[0,0,0],R=[0,0,0];
    list.forEach(v=>{const a=byV[v.code]||{d:[0,0,0],r:[0,0,0]};for(let i=0;i<3;i++){D[i]+=a.d[i];R[i]+=a.r[i];}});
    const ut=D.map((dd,i)=>(n*dim[i])?dd/(n*dim[i])*100:0);const uav=(ut[0]+ut[1]+ut[2])/3;const rav=(R[0]+R[1]+R[2])/3;
    return '<tr class="'+(cls||'')+'"><td class="l">'+label+' <span class="sub">('+n+'台)</span></td><td></td>'
      +'<td>'+pct(ut[0])+'</td><td>'+pct(ut[1])+'</td><td>'+pct(ut[2])+'</td><td class="avg">'+pct(uav)+'</td>'
      +'<td class="sep">'+man(R[0])+'</td><td>'+man(R[1])+'</td><td>'+man(R[2])+'</td><td class="avg">'+man(rav)+'</td></tr>';};
  const head='<colgroup><col style="width:130px"><col style="width:34px"><col style="width:48px"><col style="width:48px"><col style="width:48px"><col style="width:52px"><col style="width:62px"><col style="width:62px"><col style="width:62px"><col style="width:66px"></colgroup>'
    +'<thead><tr><th class="l" rowspan="2">車両</th><th rowspan="2">クラス</th><th colspan="4">🚗 稼働率%</th><th colspan="4" class="sep">💴 売上(万円)</th></tr>'
    +'<tr><th>'+MS[0].m+'月<br><span class="sub">当月</span></th><th>'+MS[1].m+'月<br><span class="sub">翌月</span></th><th>'+MS[2].m+'月<br><span class="sub">翌々月</span></th><th class="avg">平均</th>'
    +'<th class="sep">'+MS[0].m+'月<br><span class="sub">当月</span></th><th>'+MS[1].m+'月<br><span class="sub">翌月</span></th><th>'+MS[2].m+'月<br><span class="sub">翌々月</span></th><th class="avg">平均</th></tr></thead>';
  const AA=VEH.filter(v=>v.type==='AA'),OTH=VEH.filter(v=>v.type!=='AA');
  let body='';
  if(AA.length){body+='<tr class="gh"><td colspan="10">🏆 AAクラス（輸入・最上位）</td></tr>'+AA.map(rowHtml).join('')+totRow(AA,'AA 小計');}
  if(OTH.length){body+='<tr class="gh"><td colspan="10">🚗 スタンダード（A〜H）</td></tr>'+OTH.map(rowHtml).join('')+totRow(OTH,'小計');}
  body+=totRow(VEH,'Σ 合計（全車）','tot');
  g('area').innerHTML='<table>'+head+'<tbody>'+body+'</tbody></table>';
}
function reload_(){fetchData().then(render).catch(e=>{if(g('note'))g('note').textContent='更新エラー: '+(e.message||e);});}

(async function(){
  const st=g('status');
  if(!_sbToken()){st.style.display='block';st.textContent='⚠️ 管理APPにログインしてからこのページを開いてください（車両マスター・予約はログイン必須）。';return;}
  try{
    VEH=await fetchVeh();
    VEH.sort((a,b)=>CO(a.type)-CO(b.type)||String(a.name||a.code).localeCompare(String(b.name||b.code),'ja'));
    if(!VEH.length){st.style.display='block';st.textContent='車両マスターに有効な車両がありません。';return;}
    await fetchData();render();
    setInterval(()=>fetchData().then(render).catch(()=>{}),300000);
  }catch(e){st.style.display='block';st.textContent='⚠️ 読み込みエラー: '+(e.message||e)+'（ログインしてから再度お開きください）';}
})();
</script>
</body>
</html>
