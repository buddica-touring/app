<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BUDDICA TOURISM 時間貸し お車を選ぶ（モック）</title>
<style>
:root{--org:#f26522;--bg:#0d0d0f;--card:#17171b;--line:#2a2a31;--sub:#9a9aa5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:var(--bg);color:#f5f5f7;font-size:15px;line-height:1.5;padding-bottom:100px}
.wrap{max-width:520px;margin:0 auto}
.mockbar{background:#3a2410;color:#fcd9b6;text-align:center;font-size:11px;padding:6px 10px;letter-spacing:.5px}
.topbar{background:#0a0a0c;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
.topbar .back{color:#c7c7d0;text-decoration:none;font-size:22px;font-weight:800}
.topbar .logo{height:24px;width:auto}
/* KEYDROP風ステップバー */
.stepbar{display:flex;gap:6px;padding:12px 14px;background:#0a0a0c;border-bottom:1px solid var(--line)}
.stepbar .st{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:800;padding:7px 3px;border-radius:8px;background:#1a1a20;color:#7a7a85;border:1.5px solid transparent;white-space:nowrap}
.stepbar .st.now{background:rgba(242,101,34,.15);color:#ffb98a;border-color:var(--org)}
.stepbar .st.done{background:rgba(34,197,94,.12);color:#4ade80;border-color:rgba(34,197,94,.4)}
.sec{padding:16px 18px 4px}
.slabel{font-size:12px;letter-spacing:2px;color:var(--org);font-weight:800;display:flex;align-items:center;gap:8px}
.slabel .no{background:var(--org);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-style:italic}
.stitle{font-size:18px;font-weight:800;margin:6px 0 12px}
/* 選択中の日時サマリ */
.picked{margin-top:12px;background:linear-gradient(180deg,#1b1b21,#141418);border:1px solid #30303a;border-radius:14px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.picked .k{font-size:11px;color:#8a8a95;font-weight:700;letter-spacing:1px}
.picked .v{font-size:15px;font-weight:800}
.picked .plan{color:var(--org);font-weight:900}
.picked .edit{font-size:11px;color:#c7c7d0;text-decoration:underline}
/* car cards */
.cars{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.car{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.15s}
.car.on{border-color:var(--org);box-shadow:0 0 0 3px rgba(242,101,34,.14)}
.car .pic{height:132px;background:radial-gradient(120% 130% at 70% 20%,#2c2c34,#141418);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.car .pic .carimg{height:118px;width:auto;max-width:94%;object-fit:contain;filter:drop-shadow(0 8px 9px rgba(0,0,0,.5))}
.car .cat{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);border:1px solid var(--line);color:#ddd;font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.car .avail{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px}
.av-ok{background:rgba(34,197,94,.18);color:#4ade80;border:1px solid rgba(34,197,94,.4)}
.av-few{background:rgba(245,158,11,.18);color:#fbbf24;border:1px solid rgba(245,158,11,.4)}
.car .sel{position:absolute;bottom:10px;right:12px;font-size:12px;font-weight:900;color:var(--org);opacity:0;transition:.15s}
.car.on .sel{opacity:1}
.car .body{padding:12px 14px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.car .nm{font-size:17px;font-weight:800}
.car .mk{font-size:11px;color:var(--sub);margin-top:2px}
.car .price{text-align:right;white-space:nowrap}
.car .price .p{font-size:22px;font-weight:900;color:var(--org)}
.car .price .u{font-size:11px;color:var(--sub)}
.car .price .add{font-size:10px;color:var(--sub);margin-top:2px}
.hint{font-size:11px;color:var(--sub);margin-top:10px;line-height:1.6}
.foot{padding:22px 18px 30px;text-align:center;color:var(--sub);font-size:11px}.foot .logo{height:20px;opacity:.9}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(20,20,24,.97);border-top:1px solid var(--line);backdrop-filter:blur(8px);padding:10px 16px;z-index:20}
.bar .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .sum{flex:1;min-width:0}.bar .sum .l1{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar .sum .l2{font-size:20px;font-weight:900}
.bar .sum .l2 small{font-size:11px;color:var(--sub);font-weight:600}
.bar .go{background:var(--org);color:#fff;font-weight:900;font-size:15px;border:none;border-radius:12px;padding:14px 18px;white-space:nowrap;cursor:pointer;box-shadow:0 4px 14px rgba(242,101,34,.3)}
.bar .go:disabled{background:#3a3a42;color:#777;box-shadow:none}
</style></head>
<body>
<div class="mockbar">🖼 デザインモック（DB未接続・料金/写真は仮・税抜）</div>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="javascript:history.back()">‹</a>
    <img src="images/bt-logo.png" class="logo" alt="BUDDICA TOURISM">
  </div>
  <div class="stepbar">
    <div class="st done">✓ 日時</div>
    <div class="st now">お車</div>
    <div class="st">ご確認</div>
    <div class="st">お支払い</div>
  </div>

  <div class="sec">
    <div class="picked">
      <div><div class="k">ご利用</div><div class="v" id="pkTime">—</div></div>
      <div style="text-align:right"><div class="k">プラン</div><div class="v plan" id="pkPlan">—</div></div>
      <a class="edit" href="javascript:history.back()">変更</a>
    </div>
  </div>

  <div class="sec">
    <div class="slabel"><span class="no">2</span>お車を選ぶ</div>
    <div class="stitle">この時間でご利用いただけるお車</div>
    <div class="cars" id="cars"></div>
    <div class="hint">※ ◯=空きあり／△=残りわずか（当日の他予約＋整備3hを考慮）。写真・料金は仮置き（税抜）です。</div>
  </div>

  <div class="foot"><img src="images/bt-logo.png" class="logo" alt="BUDDICA TOURISM"><div style="margin-top:8px">高松空港店｜お問い合わせ：reserve.touring@buddica.co.jp</div></div>
</div>

<div class="bar"><div class="in">
  <div class="sum"><div class="l1" id="sumL">お車をお選びください</div><div class="l2" id="sumP">¥—</div></div>
  <button class="go" id="go" disabled>ご確認へ進む</button>
</div></div>

<script>
// 料金は税抜。add=24時間超の超過1時間あたり単価（税抜）
var CATS=[
  {cat:"ラグジュアリー",nm:"ランボルギーニ ウルス",mk:"Lamborghini",img:"images/car-urus.png",p:{3:80000,6:100000,12:150000,24:200000},add:20000,av:"few"},
  {cat:"ラグジュアリー",nm:"Porsche 911",mk:"Porsche",img:"images/car-911.png",p:{3:48000,6:60000,12:90000,24:120000},add:12000,av:"ok"},
  {cat:"ラグジュアリー",nm:"Mercedes-Benz G400d",mk:"Mercedes-Benz",img:"images/car-gclass.png",p:{3:40000,6:50000,12:75000,24:100000},add:10000,av:"ok"},
  {cat:"ラグジュアリー",nm:"Mercedes-Benz E カブリオレ",mk:"Mercedes-Benz",img:"images/car-eclass.png",p:{3:24000,6:30000,12:45000,24:60000},add:6000,av:"ok"},
  {cat:"ラグジュアリー",nm:"Range Rover イヴォーク",mk:"Land Rover",img:"images/car-evoque.png",p:{3:18000,6:22500,12:33750,24:45000},add:4500,av:"ok"},
  {cat:"ラグジュアリーミニバン",nm:"アルファード 等",mk:"Toyota",img:"images/car-alphard.png",p:{3:10800,6:13500,12:20250,24:27000},add:2700,av:"ok"}
];
var q=new URLSearchParams(location.search);
var d=q.get("d")||"", s=q.get("s"), e=q.get("e"), slot=+(q.get("slot")||0);
var carIdx=-1;
var yen=function(n){return "¥"+Number(n||0).toLocaleString();};
function hhmm(m){m=+m;var x=m>=1440?"翌":"";m=((m%1440)+1440)%1440;return x+("0"+Math.floor(m/60)).slice(-2)+":"+("0"+(m%60)).slice(-2);}
function jpDate(str){var p=(str||"").split("-");if(p.length!==3)return"";var wd="日月火水木金土"[new Date(+p[0],+p[1]-1,+p[2]).getDay()];return (+p[1])+"/"+(+p[2])+"（"+wd+"）";}
// サマリ
var dur=(s!=null&&e!=null)?((+e-+s)/60):0;
document.getElementById("pkTime").textContent=(d?jpDate(d)+" ":"")+(s!=null?hhmm(s):"—")+"–"+(e!=null?hhmm(e):"—");
document.getElementById("pkPlan").textContent=slot?(slot+"時間プラン"):"—";
function renderCars(){
  var h="";CATS.forEach(function(c,i){
    var av=c.av==="few"?'<span class="avail av-few">△ 残りわずか</span>':'<span class="avail av-ok">◯ 空きあり</span>';
    var price=slot?yen(c.p[slot]):"—", unit=slot?("／"+slot+"時間プラン"):"";
    h+='<div class="car'+(i===carIdx?' on':'')+'" onclick="pick('+i+')">'
      +'<div class="pic"><span class="cat">'+c.cat+'</span>'+av+'<img class="carimg" src="'+c.img+'" alt=""><span class="sel">✓ 選択中</span></div>'
      +'<div class="body"><div><div class="nm">'+c.nm+'</div><div class="mk">'+c.mk+'</div></div>'
      +'<div class="price"><span class="p">'+price+'</span><span class="u">'+unit+'</span>'
      +'<div class="add">24時間超は1時間ごと +'+yen(c.add)+'</div></div></div></div>';
  });
  document.getElementById("cars").innerHTML=h;
}
function updateBar(){
  var L=document.getElementById("sumL"),P=document.getElementById("sumP"),G=document.getElementById("go");
  if(carIdx<0){L.textContent="お車をお選びください";P.innerHTML="¥—";G.disabled=true;return;}
  var c=CATS[carIdx];L.textContent=c.nm;P.innerHTML=yen(c.p[slot])+' <small>税抜</small>';G.disabled=false;
}
window.pick=function(i){carIdx=i;renderCars();updateBar();};
document.getElementById("go").addEventListener("click",function(){
  if(carIdx<0)return;var c=CATS[carIdx];
  var qs="d="+encodeURIComponent(d)+"&s="+s+"&e="+e+"&slot="+slot
    +"&car="+encodeURIComponent(c.nm)+"&mk="+encodeURIComponent(c.mk)
    +"&price="+c.p[slot]+"&over="+c.add+"&img="+encodeURIComponent(c.img||"");
  location.href="hourly-mock3.html?"+qs;
});
renderCars();updateBar();
</script>
</body></html>
