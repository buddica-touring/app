<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>車両整備</title>
<style>
body{font-family:-apple-system,"Hiragino Sans",sans-serif;margin:0;background:#f5f6f8;color:#222;font-size:14px}
header{background:#fff;padding:8px 12px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input,textarea{font:inherit}button{padding:5px 10px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
button.on{background:#1a56db;color:#fff;border-color:#1a56db}button.pri{background:#1a56db;color:#fff;border-color:#1a56db}
main{padding:10px;max-width:900px;margin:auto}
.row{background:#fff;border:1px solid #ddd;border-radius:8px;margin:6px 0;padding:8px 10px;cursor:pointer}
.row:hover{border-color:#1a56db}.t{font-weight:600}.s{color:#666;font-size:12px}
.tag{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;margin-right:3px;background:#eef}
.warn{background:#fde8e8;color:#b00}.ok{background:#e3f6e8;color:#176}.gray{background:#eee;color:#555}
.card{background:#fff;border:1px solid #ccc;border-radius:8px;padding:12px;margin:8px 0}
.card label{display:block;margin:8px 0 2px;font-size:12px;color:#555}.card input,.card select,.card textarea{width:100%;box-sizing:border-box;padding:6px;border:1px solid #bbb;border-radius:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.doc{display:flex;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed #ddd}
#msg{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:9}
body{font-size:15px}main{max-width:1100px;padding:14px}
header{padding:10px 14px}header b{font-size:17px;margin-right:6px}
.row{padding:12px 14px;margin:8px 0}.row .t{font-size:16px;margin-bottom:6px}
.tag{font-size:13px;padding:3px 9px;margin:2px 4px 2px 0}
.card{padding:16px;margin:14px 0}.card>.t{font-size:16px;border-left:4px solid #1a56db;padding-left:8px;margin-bottom:10px}
.doc{padding:8px 0}.doc a{color:#1a56db}
button{padding:7px 14px}
</style></head><body>
<header><b>車両整備</b>
<span id="stb"></span><span id="fb"></span><input id="q" placeholder="車名・ナンバー" style="padding:5px"></header>
<main id="m">読み込み中…</main><div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 齊藤さんの「車両整備」：車両ごとの車検証・請求書（整備内容）・整備履歴（オイル/タイヤ等）・アラート。
// 書くのは1アクション＝1行（車検証/履歴の追加・墓標、走行距離の更新）。アラートは保存せず、開くたびに導出する。
// 請求書は既存の整備案件の書類(maint_case_docs/bt_maint_case_docs, kind=invoice)をそのまま読む・足す。
const MAINU='https://ckrxttbnawkclshczsia.supabase.co',MAINK='sb_publishable_aTVhlY0YD-5BBfI03ZNnsg_MzO_vsIe',BTU='https://ggqugvyskyiblxiycpci.supabase.co',BTK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18';
const CFG={spk:{u:MAINU,k:MAINK,mt:'maintenance',vt:'vehicles',pre:''},nha:{u:MAINU,k:MAINK,mt:'nha_maintenance',vt:'nha_vehicles',pre:''},bt:{u:BTU,k:BTK,mt:'bt_maintenance',vt:'bt_vehicles',pre:'bt_'}};
const P=new URLSearchParams(location.search);let store=CFG[P.get('store')]?P.get('store'):'spk',cur=P.get('v')||'',flt='alert';
const SBCS={},C=()=>CFG[store],URL_=()=>C().u,ANON=()=>C().k,SBC=()=>SBCS[store]||(SBCS[store]=window.supabase.createClient(C().u,C().k));
// 新設表と書類表は高松だけ bt_ 接頭
const tp=p=>p.replace(/^(maint_vehicle_docs|maint_service_log|maint_vehicle_state|maint_case_docs)/,m=>C().pre+m);
const ITEMS={oil:'オイル交換',oil_filter:'オイルフィルター',tire:'タイヤ交換',battery:'バッテリー',brake:'ブレーキ',wiper:'ワイパー',other:'その他'};
const DAYS_WARN=30,KM_WARN=1000,STATE_STALE=45;
let VEHS=[],MTS=[],VDOCS=[],LOGS=[],STATE={},INV={};
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t){const e=$('#msg');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500);}
const today=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
const dd=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
async function tok(){const{data}=await SBC().auth.getSession();return data&&data.session?data.session.access_token:null;}
async function sb(path,method,body,prefer){const t=await tok();if(!t)throw new Error('LOGIN');const r=await fetch(URL_()+'/rest/v1/'+tp(path),{method:method||'GET',headers:{apikey:ANON(),Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:prefer||'return=representation'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,200));const x=await r.text();return x?JSON.parse(x):null;}
async function sbAll(p){let a=[];for(let o=0;o<50000;o+=1000){const x=await sb(p+'&limit=1000&offset='+o);a=a.concat(x||[]);if(!x||x.length<1000)break;}return a;}
const pick=(o,ks)=>{for(const k of ks)if(o[k])return String(o[k]).slice(0,10);return '';};
async function mileage(){const r=await fetch(URL_()+'/rest/v1/rpc/'+(store==='bt'?'bt_company_mileage':'company_mileage'),{method:'POST',headers:{apikey:ANON(),Authorization:'Bearer '+ANON(),'Content-Type':'application/json'},body:JSON.stringify(store==='bt'?{}:{p_store:store})});if(!r.ok)throw new Error('走行距離を読めません HTTP '+r.status);const a=await r.json();return Array.isArray(a)?a:[];}
async function load(){
  const [vs,mts,vd,lg,mi]=await Promise.all([
    sbAll(C().vt+'?select=*&order=code.asc'),
    sbAll(C().mt+'?select=id,vehicle_code,start_date,end_date,label,workshop,work_detail,actual_cost,status&order=start_date.desc,id.asc'),
    sbAll('maint_vehicle_docs?select=*&deleted=eq.false&order=created_at.desc'),
    sbAll('maint_service_log?select=*&deleted=eq.false&order=done_date.desc,created_at.desc'),
    mileage()]);
  // 売却・抹消など非稼働の車は一覧に出さない（active=false）。列が無い店はそのまま全車
  VEHS=vs.filter(v=>v.active!==false&&v.deleted!==true);MTS=mts;VDOCS=vd;LOGS=lg;STATE={};
  // 走行距離の正本＝各店の既存 RPC（hq「走行距離」と同じ）。ここでは読むだけで書かない
  mi.forEach(m=>{if(m.code)STATE[m.code]={odometer_km:m.km,odometer_at:m.date};});
  // 請求書（整備案件ごとの書類 kind=invoice）
  const ds=await sbAll('maint_case_docs?select=*&store=eq.'+store+'&kind=eq.invoice&deleted=eq.false&order=created_at.asc');
  INV={};ds.forEach(d=>(INV[d.maint_id]=INV[d.maint_id]||[]).push(d));}
// ---- アラート導出（保存しない） ----
function alerts(v){const A=[],T=today(),code=v.code,odo=(STATE[code]||{}).odometer_km;
  if(!VDOCS.some(d=>d.vehicle_code===code&&d.kind==='shaken_cert'))A.push({lv:1,t:'車検証が未登録'});
  const due=pick(v,['inspection_due_date','inspectionDueDate','shaken_due','shaken_date']);
  if(!due)A.push({lv:1,t:'車検期日が未登録'});else{const n=dd(due,T);if(n<0)A.push({lv:2,t:'車検期日 超過（'+due+'）'});else if(n<=DAYS_WARN)A.push({lv:1,t:'車検期日まで'+n+'日（'+due+'）'});}
  const td=pick(v,['tenken_due_date','tenkenDueDate']);
  if(!td)A.push({lv:0,t:'半年点検の期限が未登録'});else{const n=dd(td,T);if(n<0)A.push({lv:2,t:'半年点検 期限超過（'+td+'）'});else if(n<=DAYS_WARN)A.push({lv:1,t:'半年点検まで'+n+'日（'+td+'）'});}
  for(const it of Object.keys(ITEMS)){if(it==='other')continue;
    const last=LOGS.find(l=>l.vehicle_code===code&&l.item===it);if(!last)continue;
    if(last.next_due_date){const n=dd(last.next_due_date,T);if(n<0)A.push({lv:2,t:ITEMS[it]+' 期限超過（'+last.next_due_date+'）'});else if(n<=DAYS_WARN)A.push({lv:1,t:ITEMS[it]+' まであと'+n+'日'});}
    if(last.next_due_km!=null){if(odo==null)A.push({lv:0,t:ITEMS[it]+'：走行距離が未入力のため km 判定不可'});else{const r=last.next_due_km-odo;if(r<0)A.push({lv:2,t:ITEMS[it]+' '+(-r)+'km 超過'});else if(r<=KM_WARN)A.push({lv:1,t:ITEMS[it]+' あと'+r+'km'});}}}
  const s=STATE[code];if(s&&s.odometer_at&&dd(T,s.odometer_at)>STATE_STALE)A.push({lv:0,t:'走行距離が'+dd(T,s.odometer_at)+'日前の値'});
  return A;}
const lvTag=a=>'<span class="tag '+(a.lv>=2?'warn':a.lv==1?'':'gray')+'" style="'+(a.lv==1?'background:#fff3cd;color:#8a6d00':'')+'">'+esc(a.t)+'</span>';
function render(){
  $('#stb').innerHTML=(store==='bt'?['bt']:['spk','nha']).map(s=>'<button class="'+(s===store?'on':'')+'" onclick="setStore(\''+s+'\')">'+(s==='spk'?'札幌':s==='nha'?'那覇':'高松')+'</button>').join('');
  $('#fb').innerHTML=[['alert','要対応のみ'],['all','全車']].map(f=>'<button class="'+(f[0]===flt?'on':'')+'" onclick="flt=\''+f[0]+'\';cur=\'\';render()">'+f[1]+'</button>').join('');
  if(cur){const v=VEHS.find(x=>x.code===cur);if(v)return detail(v);}
  const q=$('#q').value.trim();let list=VEHS.map(v=>({v,A:alerts(v)}));
  if(q)list=list.filter(({v})=>((v.name||'')+(v.plate_no||'')+v.code).includes(q));
  const need=x=>x.A.some(a=>a.lv>=1);
  if(flt==='alert')list=list.filter(need);
  list.sort((a,b)=>Math.max(0,...b.A.map(x=>x.lv))-Math.max(0,...a.A.map(x=>x.lv)));
  $('#m').innerHTML='<div class="s">'+list.length+'台'+(flt==='alert'?'（要対応）':'')+'</div>'+(list.map(({v,A})=>'<div class="row" onclick="cur=\''+esc(v.code)+'\';render()"><div class="t">'+esc(v.name||v.code)+' '+esc(v.plate_no||'')+'</div><div>'+(A.length?A.map(lvTag).join(''):'<span class="tag ok">問題なし</span>')+'</div></div>').join('')||'<div class="card">該当なし</div>');}
function detail(v){const code=v.code,A=alerts(v),st=STATE[code]||{};
  const vd=VDOCS.filter(d=>d.vehicle_code===code&&d.kind==='shaken_cert');
  const mts=MTS.filter(m=>m.vehicle_code===code);
  const lg=LOGS.filter(l=>l.vehicle_code===code);
  const docRow=(d,del)=>'<div class="doc"><a href="#" onclick="openDoc(\''+d.path+'\');return false">'+esc(d.filename||d.path)+'</a><span class="s">'+esc((d.created_at||'').slice(0,10))+'</span>'+(del?'<button onclick="'+del+'(\''+d.id+'\')">外す</button>':'')+'</div>';
  let h='<button onclick="cur=\'\';render()">← 一覧へ</button><div class="card"><div class="t">'+esc(v.name||code)+' '+esc(v.plate_no||'')+'</div><div>'+(A.length?A.map(lvTag).join(''):'<span class="tag ok">問題なし</span>')+'</div></div>';
  h+='<div class="card"><div class="t">車検証</div>'+(vd.map(d=>docRow(d,'delVDoc')).join('')||'<div class="s">未登録</div>')+'<div class="s" style="margin-top:6px">差し替える時は新しい画像/PDFを追加してください（古いものは外すまで残ります）</div><input type="file" id="vf" accept="image/*,application/pdf"> <button class="pri" onclick="upVDoc(\''+esc(code)+'\')">追加</button></div>';
  h+='<div class="card"><div class="t">現在の走行距離</div><div>'+(st.odometer_km==null?'未登録':Number(st.odometer_km).toLocaleString()+' km')+(st.odometer_at?' <span class="s">（'+esc(st.odometer_at)+' 更新）</span>':'')+'</div><div class="s">各店の走行距離の記録から自動で表示します（ここでは入力しません）</div></div>';
  h+='<div class="card"><div class="t">整備履歴（オイル・タイヤなど）</div>'+(lg.map(l=>'<div class="doc"><span class="tag">'+esc(ITEMS[l.item]||l.item)+'</span><span>'+esc(l.done_date)+(l.odometer_km!=null?' / '+l.odometer_km+'km':'')+(l.next_due_date||l.next_due_km!=null?' → 次回 '+esc(l.next_due_date||'')+(l.next_due_km!=null?' '+l.next_due_km+'km':''):'')+(l.note?' / '+esc(l.note):'')+'</span><button onclick="delLog(\''+l.id+'\')">外す</button></div>').join('')||'<div class="s">記録なし</div>')
   +'<div class="g2" style="margin-top:8px"><div><label>項目</label><select id="l_item">'+Object.keys(ITEMS).map(k=>'<option value="'+k+'">'+ITEMS[k]+'</option>').join('')+'</select></div><div><label>実施日</label><input id="l_date" type="date" value="'+today()+'"></div><div><label>その時の走行距離 km</label><input id="l_km" type="number" min="0"></div><div><label>メモ</label><input id="l_note"></div><div><label>次回の目安（日付）</label><input id="l_nd" type="date"></div><div><label>次回の目安（km）</label><input id="l_nk" type="number" min="0"></div></div><button class="pri" style="margin-top:6px" onclick="addLog(\''+esc(code)+'\')">履歴を追加</button></div>';
  h+='<div class="card"><div class="t">車検・点検ごとの請求書</div>'+(mts.map(m=>{const ds=INV[m.id]||[];return '<div style="border-bottom:1px solid #eee;padding:6px 0"><div><b>'+esc(m.start_date)+'</b> '+esc(m.label||'')+' '+esc(m.workshop||'')+(m.actual_cost?' / '+m.actual_cost+'円':'')+' '+(ds.length?'':'<span class="tag warn">請求書なし</span>')+'</div>'+(m.work_detail?'<div class="s">整備内容：'+esc(m.work_detail)+'</div>':'')+ds.map(d=>docRow(d,'delInv')).join('')+'<input type="file" id="if_'+esc(m.id)+'" accept="image/*,application/pdf"> <button onclick="upInv(\''+esc(m.id)+'\')">請求書を追加</button></div>';}).join('')||'<div class="s">整備案件なし</div>')+'<div class="s" style="margin-top:6px">請求書に書かれたオイル・タイヤ等の内容は、上の「整備履歴」に転記してください</div></div>';
  $('#m').innerHTML=h;}
function setStore(s){store=s;cur='';$('#m').textContent='読み込み中…';load().then(render).catch(err);}
async function putFile(path,f){if(!f)throw new Error('ファイルを選んでください');if(f.size>10485760)throw new Error('10MBまでです');const t=await tok();
  const r=await fetch(URL_()+'/storage/v1/object/maint-docs/'+path,{method:'POST',headers:{apikey:ANON(),Authorization:'Bearer '+t,'Content-Type':f.type||'application/octet-stream'},body:f});if(!r.ok)throw new Error('アップロード失敗 '+r.status);}
const extOf=f=>(f.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').slice(0,5);
async function upVDoc(code){try{const f=$('#vf').files[0];const path=store+'/veh/'+code+'/'+Date.now()+'.'+extOf(f||{name:'x'});await putFile(path,f);
  const x=await sb('maint_vehicle_docs','POST',{store,vehicle_code:code,kind:'shaken_cert',path,filename:f.name});VDOCS.unshift(x[0]);msg('登録しました');render();}catch(e){msg(e.message);}}
async function delVDoc(id){if(!confirm('この車検証を一覧から外しますか？（ファイルは残ります）'))return;try{await sb('maint_vehicle_docs?id=eq.'+id,'PATCH',{deleted:true,deleted_at:new Date().toISOString()});VDOCS=VDOCS.filter(d=>d.id!==id);render();}catch(e){msg(e.message);}}
async function upInv(mid){try{const f=$('#if_'+mid).files[0];const path=store+'/'+mid+'/'+Date.now()+'.'+extOf(f||{name:'x'});await putFile(path,f);
  const x=await sb('maint_case_docs','POST',{store,maint_id:mid,kind:'invoice',path,filename:f.name});(INV[mid]=INV[mid]||[]).push(x[0]);msg('登録しました');render();}catch(e){msg(e.message);}}
async function delInv(id){if(!confirm('この請求書を一覧から外しますか？（ファイルは残ります）'))return;try{await sb('maint_case_docs?id=eq.'+id,'PATCH',{deleted:true,deleted_at:new Date().toISOString()});for(const k in INV)INV[k]=INV[k].filter(d=>d.id!==id);render();}catch(e){msg(e.message);}}
async function openDoc(path){try{const t=await tok();const r=await fetch(URL_()+'/storage/v1/object/sign/maint-docs/'+path,{method:'POST',headers:{apikey:ANON(),Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:300})});const j=await r.json();if(!j.signedURL)throw new Error('開けません');window.open(URL_()+'/storage/v1'+j.signedURL,'_blank');}catch(e){msg(e.message);}}
async function addLog(code){try{const b={store,vehicle_code:code,item:$('#l_item').value,done_date:$('#l_date').value};if(!b.done_date)return msg('実施日を入れてください');
  const km=$('#l_km').value,nd=$('#l_nd').value,nk=$('#l_nk').value,nt=$('#l_note').value.trim();if(km!=='')b.odometer_km=+km;if(nd)b.next_due_date=nd;if(nk!=='')b.next_due_km=+nk;if(nt)b.note=nt;
  const x=await sb('maint_service_log','POST',b);LOGS.unshift(x[0]);LOGS.sort((a,b2)=>(b2.done_date>a.done_date)-(b2.done_date<a.done_date));msg('追加しました');render();}catch(e){msg(e.message);}}
async function delLog(id){if(!confirm('この履歴を外しますか？'))return;try{await sb('maint_service_log?id=eq.'+id,'PATCH',{deleted:true,deleted_at:new Date().toISOString()});LOGS=LOGS.filter(l=>l.id!==id);render();}catch(e){msg(e.message);}}
const err=e=>{$('#m').innerHTML='<div class="card">'+(e.message==='LOGIN'?'ログインが必要です。管理APPで一度ログインしてから開いてください。':'エラー: '+esc(e.message))+'</div>';};
$('#q').oninput=()=>{if(!cur)render();};
load().then(render).catch(err);
</script></body></html>
