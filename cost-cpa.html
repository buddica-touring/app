<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>💸 OTA手数料・広告費・CPA（月別）</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f1f5f9;color:#0f172a;font-size:14px}
  .wrap{max-width:920px;margin:0 auto;padding:12px}
  h1{font-size:17px;margin:4px 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  h1 a{color:#64748b;font-size:11px;font-weight:700;text-decoration:none;margin-left:auto}
  .sub{font-size:11.5px;color:#64748b;line-height:1.7;margin-bottom:10px}
  .sub b{color:#334155}
  .kpis{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
  .kpi{flex:1;min-width:120px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:9px 11px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .kpi .l{font-size:10.5px;color:#64748b;font-weight:800}
  .kpi .v{font-size:20px;font-weight:900;line-height:1.1;margin-top:2px}
  .kpi small{font-size:10.5px;font-weight:700;color:#94a3b8}
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:800;cursor:pointer;color:#334155}
  .btn.g{background:#16a34a;color:#fff;border-color:#16a34a}
  .msg{font-size:11px;font-weight:800;color:#16a34a}
  .mcard{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px 8px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .mcard.now{border-color:#93c5fd;box-shadow:0 0 0 2px #dbeafe}
  .mhd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid #f1f5f9;padding-bottom:7px;margin-bottom:4px}
  .mhd .mym{font-size:16px;font-weight:900}
  .mhd .mtot{font-size:14px;font-weight:900;color:#0f766e}
  .mhd .mtot small{font-size:10.5px;color:#94a3b8;font-weight:700}
  .mhd .mrat{font-size:12px;font-weight:800;margin-left:auto;white-space:nowrap}
  .mrow{display:grid;grid-template-columns:66px 1fr 1fr 1fr 1fr;gap:4px;align-items:center;padding:5px 0;border-bottom:1px solid #fafcff}
  .mrow:last-child{border-bottom:none}
  .rl{font-weight:900;font-size:12.5px}
  .cell{text-align:right;min-width:0}
  .cell .k{display:block;font-size:9.5px;color:#94a3b8;font-weight:700;line-height:1.2}
  .cell b{font-weight:800;font-size:13.5px;white-space:nowrap}
  .cell.cpa b{color:#a16207;font-size:15px}
  input.ad{width:100%;max-width:96px;border:1px solid #cbd5e1;border-radius:7px;padding:4px 6px;font-size:13px;text-align:right;font-family:inherit}
  .r-ota{color:#c2410c}.r-hp{color:#1d4ed8}.r-all{color:#a16207}
  .fee{color:#c2410c;font-weight:800}.adc{color:#1d4ed8;font-weight:800}.cpa2{color:#a16207;font-weight:900}
  .pos{color:#16a34a;font-weight:800}.neg{color:#dc2626;font-weight:800}
  #st{position:fixed;left:12px;bottom:12px;background:#0f172a;color:#fff;font-size:11px;padding:5px 10px;border-radius:8px;opacity:.85}
  @media(max-width:560px){.mrow{grid-template-columns:52px 1fr 1fr 1fr 1fr;gap:3px}.cell b{font-size:12.5px}.cell.cpa b{font-size:13.5px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>💸 OTA手数料・広告費・CPA <span style="font-size:11px;color:#64748b">🚐高松店(HDM＋BUDDICA)・月別</span> <a href="index.html">🏠 管理APP</a></h1>
  <div class="sub">
    高松の全予約（<b>HANDYMAN＋BUDDICA 合算</b>）・返却月ベース・キャンセル/テスト除外。<b class="fee">OTA</b>＝手数料18%／<b class="adc">HP(自社)</b>＝広告費(手動入力)。<br>
    <b>CPA</b>＝コスト÷件数（OTA=手数料÷OTA件数／HP=広告費÷HP件数／合算=両コスト÷総件数）。
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="bar"><button class="btn g" onclick="saveAd()">💾 広告費を保存</button><span class="msg" id="msg"></span><span style="font-size:11px;color:#94a3b8;margin-left:auto">🟧OTA ／ 🟦HP ／ 🟨合算</span></div>

  <div id="tb"></div>
</div>
<div id="st">接続中…</div>
<script>
const SB='https://ggqugvyskyiblxiycpci.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18';
const FEE=0.18;
const $=id=>document.getElementById(id);
const yen=n=>'¥'+Math.round(n||0).toLocaleString();
const yk=n=>'¥'+Math.round((n||0)/10000).toLocaleString()+'万';
function setSt(t){$('st').textContent=t;}
async function sbGet(path){const r=await fetch(SB+'/rest/v1/'+path,{headers:{apikey:ANON,Authorization:'Bearer '+ANON}});if(!r.ok)throw new Error(r.status);return r.json();}
async function sbPost(path,body){const r=await fetch(SB+'/rest/v1/'+path,{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json'},body:JSON.stringify(body||{})});if(!r.ok)throw new Error(r.status);return r.json();}
function nowYM(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
let AD={}, MONTHS=[];
function calc(m){
  const otaRev=m.otaRev||0,otaCnt=m.otaCnt||0,hpRev=m.hpRev||0,hpCnt=m.hpCnt||0;
  const rev=otaRev+hpRev,cnt=otaCnt+hpCnt;
  const fee=Math.round(otaRev*FEE), ad=+AD[m.m]||0, cost=fee+ad;
  const otaCpa=otaCnt?Math.round(fee/otaCnt):0, hpCpa=hpCnt?Math.round(ad/hpCnt):0, allCpa=cnt?Math.round(cost/cnt):0;
  const net=rev-cost, roas=cost?rev/cost:0;
  return {m:m.m,otaRev,otaCnt,hpRev,hpCnt,rev,cnt,fee,ad,cost,otaCpa,hpCpa,allCpa,net,roas};
}
async function load(){
  setSt('読み込み中…');
  try{
    const [agg,st]=await Promise.all([sbPost('rpc/bt_cost_cpa',{}),sbGet('bt_app_settings?select=value&key=eq.hp_adspend_bt')]);
    try{AD=st&&st[0]?JSON.parse(st[0].value||'{}'):{};}catch(e){AD={};}
    const base={};
    (agg||[]).forEach(r=>{const m=String(r.ym||'');if(!/^\d{4}-\d{2}$/.test(m))return;base[m]={m,otaRev:+r.ota_rev||0,otaCnt:+r.ota_cnt||0,hpRev:+r.hp_rev||0,hpCnt:+r.hp_cnt||0};});
    const keys=Array.from(new Set(Object.keys(base).concat(Object.keys(AD)))).filter(m=>/^\d{4}-\d{2}$/.test(m)).sort();
    MONTHS=keys.map(m=>calc(base[m]||{m,otaRev:0,otaCnt:0,hpRev:0,hpCnt:0}));
    render();
    setSt('更新OK '+new Date().toLocaleTimeString('ja-JP').slice(0,5));
  }catch(e){setSt('読込エラー：'+e.message);}
}
function totals(){
  const T=MONTHS.reduce((a,x)=>{a.rev+=x.rev;a.cnt+=x.cnt;a.otaCnt+=x.otaCnt;a.hpCnt+=x.hpCnt;a.otaRev+=x.otaRev;a.hpRev+=x.hpRev;a.fee+=x.fee;a.ad+=x.ad;return a;},{rev:0,cnt:0,otaCnt:0,hpCnt:0,otaRev:0,hpRev:0,fee:0,ad:0});
  T.cost=T.fee+T.ad;T.net=T.rev-T.cost;
  T.otaCpa=T.otaCnt?Math.round(T.fee/T.otaCnt):0;T.hpCpa=T.hpCnt?Math.round(T.ad/T.hpCnt):0;T.allCpa=T.cnt?Math.round(T.cost/T.cnt):0;T.roas=T.cost?T.rev/T.cost:0;
  return T;
}
function renderKpis(){
  const T=totals();
  $('kpis').innerHTML=
    '<div class="kpi"><div class="l">総売上（グロス）</div><div class="v" style="color:#0f766e">'+yk(T.rev)+'</div><small>'+T.cnt+'件 ・ OTA'+(T.rev?Math.round(T.otaRev/T.rev*100):0)+'% / HP'+(T.rev?Math.round(T.hpRev/T.rev*100):0)+'%</small></div>'+
    '<div class="kpi"><div class="l">🟧 OTA-CPA</div><div class="v fee">'+yen(T.otaCpa)+'</div><small>手数料'+yk(T.fee)+'</small></div>'+
    '<div class="kpi"><div class="l">🟦 HP-CPA</div><div class="v adc">'+yen(T.hpCpa)+'</div><small>広告費'+yk(T.ad)+'</small></div>'+
    '<div class="kpi"><div class="l">🟨 合算CPA</div><div class="v cpa2">'+yen(T.allCpa)+'</div><small>コスト'+yk(T.cost)+'</small></div>'+
    '<div class="kpi"><div class="l">手取り（グロス−コスト）</div><div class="v '+(T.net>=0?'pos':'neg')+'">'+yk(T.net)+'</div><small>ROAS '+T.roas.toFixed(2)+'x</small></div>';
}
function cardHTML(x){
  const nm=nowYM();
  const orat=x.rev?Math.round(x.otaRev/x.rev*100):0, hrat=100-orat;
  const cellK=(k,v,cls)=>'<div class="cell'+(cls||'')+'"><span class="k">'+k+'</span><b>'+v+'</b></div>';
  return '<div class="mcard'+(x.m===nm?' now':'')+'" data-m="'+x.m+'">'+
    '<div class="mhd"><span class="mym">'+x.m+'</span><span class="mtot">'+yen(x.rev)+' <small>'+x.cnt+'件</small></span>'+
      '<span class="mrat"><span class="fee">OTA '+(x.rev?orat:'—')+'%</span> / <span class="adc">HP '+(x.rev?hrat:'—')+'%</span></span></div>'+
    '<div class="mrow"><div class="rl r-ota">🟧 OTA</div>'+cellK('件数',x.otaCnt)+cellK('売上',yen(x.otaRev))+cellK('手数料18%',yen(x.fee))+cellK('CPA',(x.otaCnt?yen(x.otaCpa):'—'),' cpa')+'</div>'+
    '<div class="mrow"><div class="rl r-hp">🟦 HP</div>'+cellK('件数',x.hpCnt)+cellK('売上',yen(x.hpRev))+
      '<div class="cell"><span class="k">広告費</span><input class="ad" type="number" data-m="'+x.m+'" value="'+(x.ad||'')+'" placeholder="0"></div>'+
      '<div class="cell cpa"><span class="k">CPA</span><b data-r="hpcpa">'+(x.hpCnt&&x.ad?yen(x.hpCpa):'—')+'</b></div></div>'+
    '<div class="mrow"><div class="rl r-all">🟨 合算</div>'+cellK('件数',x.cnt)+cellK('売上',yen(x.rev))+
      '<div class="cell"><span class="k">コスト</span><b data-r="cost">'+yen(x.cost)+'</b></div>'+
      '<div class="cell cpa"><span class="k">CPA</span><b data-r="allcpa">'+(x.cnt?yen(x.allCpa):'—')+'</b></div></div>'+
    '</div>';
}
function render(){
  renderKpis();
  $('tb').innerHTML=MONTHS.map(cardHTML).join('')||'<div style="color:#94a3b8;padding:20px;text-align:center">データなし</div>';
  $('tb').querySelectorAll('input.ad').forEach(el=>el.addEventListener('input',()=>{
    const m=el.dataset.m; AD[m]=+el.value||0;
    const i=MONTHS.findIndex(o=>o.m===m); if(i<0)return; MONTHS[i]=calc(MONTHS[i]); const x=MONTHS[i];
    const card=el.closest('.mcard');
    card.querySelector('[data-r=hpcpa]').textContent=(x.hpCnt&&x.ad?yen(x.hpCpa):'—');
    card.querySelector('[data-r=cost]').textContent=yen(x.cost);
    card.querySelector('[data-r=allcpa]').textContent=(x.cnt?yen(x.allCpa):'—');
    renderKpis(); $('msg').textContent='未保存';
  }));
}
async function saveAd(){
  setSt('保存中…'); $('msg').textContent='';
  const clean={}; Object.keys(AD).forEach(k=>{if(+AD[k]>0)clean[k]=+AD[k];});
  try{
    let r=await fetch(SB+'/rest/v1/bt_app_settings?key=eq.hp_adspend_bt',{method:'PATCH',headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({value:JSON.stringify(clean)})});
    let d=await r.json();
    if(!Array.isArray(d)||!d.length){ r=await fetch(SB+'/rest/v1/bt_app_settings',{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json'},body:JSON.stringify({key:'hp_adspend_bt',value:JSON.stringify(clean)})}); }
    if(r.ok){$('msg').textContent='✅ 保存しました';setSt('保存OK');setTimeout(()=>{$('msg').textContent='';},2500);}
    else{$('msg').textContent='保存失敗';setSt('保存失敗 '+r.status);}
  }catch(e){$('msg').textContent='保存失敗';setSt('保存失敗 '+e.message);}
}
load();
</script>
</body>
</html>
