<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Rental Car Guide for Visitors</title>
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;background:#f1f5f9;color:#0f172a;font-size:15px;line-height:1.7}
  .wrap{max-width:640px;margin:0 auto;padding:0 0 60px}
  /* hero */
  .hero{padding:22px 18px 20px;color:#fff;position:relative}
  .hero h1{font-size:21px;margin:0 0 4px;font-weight:900;letter-spacing:.3px}
  .hero .brand{font-size:12px;font-weight:800;opacity:.92;letter-spacing:1px;text-transform:uppercase}
  .hero .tag{font-size:13px;opacity:.95;margin-top:6px}
  /* lang bar */
  .langbar{display:flex;gap:6px;padding:10px 14px;background:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid #e2e8f0;overflow-x:auto}
  .lang{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:800;cursor:pointer;color:#475569;white-space:nowrap;flex-shrink:0}
  .lang.on{background:#0f172a;color:#fff;border-color:#0f172a}
  /* section cards */
  .body{padding:14px}
  .sec{background:#fff;border:1px solid #e2e8f0;border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .sec>summary{list-style:none;cursor:pointer;padding:15px 16px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:11px}
  .sec>summary::-webkit-details-marker{display:none}
  .sec>summary .ico{font-size:22px;flex-shrink:0}
  .sec>summary .arw{margin-left:auto;color:#94a3b8;transition:transform .18s;font-size:14px}
  .sec[open]>summary .arw{transform:rotate(180deg)}
  .sec[open]>summary{border-bottom:1px solid #f1f5f9}
  .sbody{padding:6px 17px 17px;color:#334155}
  .sbody h4{font-size:14px;margin:14px 0 5px;color:#0f172a;font-weight:800}
  .sbody h4:first-child{margin-top:6px}
  .sbody ul{margin:5px 0;padding-left:20px}
  .sbody li{margin:5px 0}
  .sbody p{margin:6px 0}
  .sbody b{color:#0f172a}
  .tip{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:9px 13px;margin:9px 0;font-size:14px}
  .warn{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:9px 13px;margin:9px 0;font-size:14px}
  .warn b{color:#b91c1c}
  .ok{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:9px 13px;margin:9px 0;font-size:14px}
  .kv{display:flex;gap:8px;padding:7px 0;border-bottom:1px dashed #e2e8f0;font-size:14px}
  .kv:last-child{border:none}
  .kv .k{min-width:120px;font-weight:800;color:#475569;flex-shrink:0}
  .num{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;background:#0f172a;color:#fff;border-radius:50%;font-size:12px;font-weight:800;margin-right:6px}
  .opt{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
  .opt:last-child{border:none}
  .opt .st{margin-left:auto;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .opt .yes{background:#dcfce7;color:#166534}
  .opt .no{background:#fee2e2;color:#b91c1c}
  .opt .note{color:#64748b;font-size:12.5px;flex-basis:100%;padding-left:0;margin-top:-3px}
  .emg{background:#0f172a;color:#fff;border-radius:14px;padding:16px;margin-bottom:10px;text-align:center}
  .emg .big{font-size:15px;font-weight:800;margin-bottom:10px}
  .emg .nums{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .emg a{display:block;background:#dc2626;color:#fff;text-decoration:none;font-weight:900;padding:11px 16px;border-radius:10px;font-size:15px;flex:1 1 44%;min-width:130px}
  .emg a.police{background:#1d4ed8}
  .emg a.store{background:#059669}
  .foot{text-align:center;font-size:11px;color:#94a3b8;padding:16px}
  .empty{display:none}
</style>
</head>

/* ===== render ===== */
const qs=new URLSearchParams(location.search);
let store=(qs.get("store")||"hdmt").toLowerCase(); if(!STORES[store])store="hdmt";
let lang=(qs.get("lang")||localStorage.getItem("ig_lang")||"en").toLowerCase(); if(!T[lang])lang="en";
const S=STORES[store];
function tr(o){return (o&&(o[lang]||o.en||o.ja))||"";}

function renderLang(){
  document.getElementById("langbar").innerHTML=LANGS.map(([c,n])=>`<div class="lang ${c===lang?"on":""}" data-l="${c}">${n}</div>`).join("");
  document.querySelectorAll(".lang").forEach(el=>el.onclick=()=>{lang=el.dataset.l;localStorage.setItem("ig_lang",lang);document.documentElement.lang=lang;render();});
}
function sec(id,ico,titleKey,inner,open){
  return `<details class="sec" ${open?"open":""}><summary><span class="ico">${ico}</span><span>${T[lang][titleKey]}</span><span class="arw">▼</span></summary><div class="sbody">${inner}</div></details>`;
}
function li(keys){return "<ul>"+keys.map(k=>`<li>${T[lang][k]}</li>`).join("")+"</ul>";}
function steps(keys){return keys.map((k,i)=>`<p><span class="num">${i+1}</span>${T[lang][k]}</p>`).join("");}

function render(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.getElementById("hero").style.background=`linear-gradient(135deg,${S.color},${S.color}dd)`;
  document.getElementById("hero").innerHTML=
    `<div class="brand">${S.brand} · ${S.area}</div><h1>🚗 ${tr(S.name)}</h1><div class="tag">${t.tag}</div>`;

  // emergency (always open, top)
  const emg=`<div class="emg"><div class="big">${t.emg_big}</div><div class="nums">`+
    `<a href="tel:119">${t.emg_amb}</a><a class="police" href="tel:110">${t.emg_pol}</a>`+
    `<a class="store" href="tel:${S.tel}">${t.emg_store}</a></div></div>`;

  // shuttle
  const shuttle = sec("shuttle","🚌","s_shuttle",
    `<p>${tr(S.shuttle.txt)}</p>${S.shuttle.has?`<div class="ok">${t.emg_store.replace('📞 ','')}: <b>${S.tel}</b></div>`:""}`);

  // options
  const opts=optionsFor(store).map(o=>
    `<div class="opt"><span style="font-size:19px">${o.ic}</span><span>${tr(o.label)}</span><span class="st ${o.yes?"yes":"no"}">${o.yes?"✓":"✕"}</span><span class="note">${tr(o.note)}</span></div>`).join("");
  const options=sec("opt","🧳","s_opt",`<p>${t.opt_intro}</p>${opts}`);

  // trouble
  const tb=tr(S.troubles);
  const trouble=sec("trouble","⚠️","s_trouble", tb?`<div class="warn">${tb}</div>`:`<p>${t.trouble_none}</p>`);

  const body=
    emg+
    sec("emg","🚑","s_emg",`<h4>${t.emg_flow}</h4>${steps(["emg_l1","emg_l2","emg_l3","emg_l4","emg_l5"])}`,true)+
    sec("rule","🛣️","s_rule",li(["rule_l1","rule_l2","rule_l3","rule_l4","rule_l5","rule_l6","rule_l7","rule_l8","rule_l9"]))+
    sec("fuel","⛽","s_fuel",`<div class="tip">${t.fuel_note}</div><h4>${t.fuel_type}</h4><p>${t.fuel_type_v}</p><h4>${t.s_fuel}</h4>${steps(["fuel_l1","fuel_l2","fuel_l3","fuel_l4","fuel_l5"])}`)+
    sec("nav","🧭","s_nav",li(["nav_l1","nav_l2","nav_l3","nav_l4"]))+
    sec("traffic","🚦","s_traffic",li(["traffic_l1","traffic_l2","traffic_l3"]))+
    shuttle+
    sec("local","📍","s_local",`<p>${tr(S.notes)}</p>`)+
    options+
    sec("store","📋","s_store",li(["store_l1","store_l2","store_l3","store_l4","store_l5"]))+
    trouble;

  document.getElementById("body").innerHTML=body;
  document.getElementById("foot").innerHTML=`${t.foot}<br>${tr(S.name)} · ${S.tel}`;
  document.title=tr(S.name)+" — Guide";
}
renderLang();render();
</script>
</body>
</html>
