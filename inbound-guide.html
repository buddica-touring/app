<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Rental Car Guide for Visitors</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#f5efe4; --card:#fff; --ink:#1c2430; --sub:#6b7784; --line:#e6ddcd;
    --accent:#0e7a6b; --accent-d:#0a5e52; --warn:#c2410c; --danger:#b91c1c; --gold:#b45309;
    --r:16px; --shadow:0 3px 16px rgba(20,30,45,.09);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:12px 14px 60px}
  /* lang switch (mypage style pills) */
  .langbar{display:flex;gap:6px;justify-content:flex-end;padding:2px 0 10px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
  .lang{font-size:11.5px;font-weight:800;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;white-space:nowrap}
  .lang.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  /* premium hero (nhero) */
  .nhero{position:relative;border-radius:var(--r);overflow:hidden;color:#fff;margin:2px 0 14px;min-height:210px;box-shadow:var(--shadow);
    background:linear-gradient(180deg,rgba(3,8,28,.5) 0%,rgba(4,14,40,.4) 45%,rgba(3,8,28,.8) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:20px 18px}
  .nhero.img{background-size:cover;background-position:center 32%;background-repeat:no-repeat}
  .nhero::before{content:"";position:absolute;left:0;right:0;top:0;height:80px;background:linear-gradient(180deg,rgba(3,8,28,.6),rgba(3,8,28,0))}
  .nhero .nh-eye{font-family:"Hiragino Mincho ProN",serif;font-size:12px;font-style:italic;letter-spacing:2px;opacity:.9;margin-bottom:4px;position:relative}
  .nhero .nh-oki{font-family:"Hiragino Mincho ProN",serif;font-size:44px;font-weight:800;color:var(--goldh,#FABE00);line-height:1;letter-spacing:.12em;padding-left:.12em;text-shadow:0 3px 20px rgba(0,0,0,.5);position:relative}
  .nhero .nh-name{margin-top:12px;font-family:"Hiragino Mincho ProN",serif;font-size:14px;letter-spacing:.5px;opacity:.96;position:relative;font-weight:700}
  .nhero .nh-tag{margin-top:5px;font-size:12px;opacity:.9;position:relative}
  /* section divider label */
  .divlabel{display:flex;align-items:center;gap:10px;margin:16px 4px 10px;color:var(--sub);font-size:10.5px;letter-spacing:3px;font-weight:800}
  .divlabel::before,.divlabel::after{content:"";flex:1;height:1px;background:var(--line)}
  /* accordions (mypage .acc) */
  .sec{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:11px;box-shadow:0 5px 16px rgba(10,59,71,.05);overflow:hidden}
  .sec>summary{list-style:none;cursor:pointer;padding:15px 15px;display:flex;align-items:center;gap:11px;font-weight:800;font-size:15px;color:var(--accent-d)}
  .sec>summary::-webkit-details-marker{display:none}
  .sec>summary .ico{font-size:21px;flex-shrink:0}
  .sec>summary .arw{margin-left:auto;color:var(--sub);transition:.25s;font-size:12px}
  .sec[open]>summary .arw{transform:rotate(180deg)}
  .sbody{padding:4px 17px 17px;color:#334155}
  .sbody h4{font-size:14px;margin:14px 0 5px;color:var(--accent-d);font-weight:800}
  .sbody h4:first-child{margin-top:6px}
  .sbody ul{margin:5px 0;padding-left:20px}
  .sbody li{margin:6px 0}
  .sbody p{margin:6px 0}
  .sbody b{color:var(--ink)}
  .tip{background:#f0f7f5;border:1px solid #cfe7e0;border-radius:12px;padding:10px 13px;margin:9px 0;font-size:14px}
  .warn{background:#fff5ed;border:1px solid #fcd9bd;border-radius:12px;padding:10px 13px;margin:9px 0;font-size:14px}
  .warn b{color:var(--warn)}
  .ok{background:#f0f7f5;border:1px solid #cfe7e0;border-radius:12px;padding:10px 13px;margin:9px 0;font-size:14px}
  .num{display:inline-block;min-width:23px;height:23px;line-height:23px;text-align:center;background:var(--accent);color:#fff;border-radius:50%;font-size:12px;font-weight:800;margin-right:7px}
  .opt{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid #f1ede3;font-size:14px}
  .opt:last-child{border:none}
  .opt .st{margin-left:auto;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .opt .yes{background:#e3f2ee;color:var(--accent-d)}
  .opt .no{background:#fde8e8;color:var(--danger)}
  .opt .note{color:var(--sub);font-size:12.5px;flex-basis:100%;margin-top:-2px}
  /* emergency block */
  .emg{background:linear-gradient(135deg,#1c2430,#0a0f1a);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px;text-align:center;box-shadow:var(--shadow)}
  .emg .big{font-size:14px;font-weight:800;margin-bottom:11px;opacity:.95}
  .emg .nums{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .emg a{display:block;background:#dc2626;color:#fff;text-decoration:none;font-weight:900;padding:12px 14px;border-radius:11px;font-size:14.5px;flex:1 1 44%;min-width:128px}
  .emg a.police{background:#1d4ed8}
  .emg a.store{background:var(--accent)}
  /* shuttle (copied from mypage / BUDDICA guide) */
  .busdiv{background:var(--accent);color:#fff;font-weight:800;font-size:13px;border-radius:10px;padding:9px 12px;margin:12px 0 8px}
  .busdiv2{background:var(--gold)}
  .pkway{font-weight:800;color:var(--accent-d);font-size:13px;margin:10px 0 6px}
  .pkstep{margin-bottom:12px}
  .pkstep .pkhd{display:flex;align-items:flex-start;gap:8px;margin-bottom:5px}
  .pknum{min-width:22px;height:22px;line-height:22px;text-align:center;background:var(--accent);color:#fff;border-radius:50%;font-size:12px;font-weight:800;flex-shrink:0}
  .pkcap{font-size:13px;font-weight:700;padding-top:1px}
  .pkstep img{width:100%;border-radius:10px;display:block}
  .pkimg2{display:flex;gap:6px}.pkimg2 img{width:50%}
  .pu-route{display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(120deg,#0f2b45,#0a5e52);border-radius:12px;padding:14px;color:#fff;margin:6px 0 12px;font-weight:800;font-size:14px}
  .pu-map{width:100%;border-radius:12px;border:1px solid var(--line);display:block;margin-top:8px}
  .pu-cap{font-size:11.5px;color:var(--sub);text-align:center;margin:5px 0 2px}
  .mp2{display:inline-block;margin-top:9px;margin-right:7px;font-size:12.5px;font-weight:800;color:#fff;background:var(--accent);border-radius:10px;padding:9px 15px;text-decoration:none}
  .mp2.o{background:#fff;color:var(--accent);border:1.5px solid var(--accent)}
  body.bt .busdiv{background:#ee6a1c}body.bt .busdiv2{background:#9a7b2e}
  body.bt .pkway,body.bt .pu-spot{color:#c85a12}
  body.bt .pknum{background:#ee6a1c}
  body.bt .pu-route{background:linear-gradient(120deg,#0e0e12,#1c1c1f 55%,#241a12)}
  body.bt .mp2{background:#ee6a1c}body.bt .mp2.o{background:#fff;color:#c85a12;border-color:#ee6a1c}
  .pu-spot{font-size:13px;font-weight:800;color:var(--accent-d);margin-bottom:6px;margin-top:6px}
  .pu-spot-d{font-size:12.5px;color:var(--sub);line-height:1.75;margin-top:8px}
  .foot{text-align:center;font-size:11px;color:var(--sub);padding:18px 8px 4px;line-height:1.8}
  /* ===== BUDDICA (dark navy / orange) skin ===== */
  body.bt{background:#0e0e12}
  body.bt .lang{border-color:#33333a;background:#1c1c1f;color:#c9c9cf}
  body.bt .lang.on{background:var(--btor,#ee6a1c);color:#fff;border-color:var(--btor,#ee6a1c)}
  body.bt .bttop{position:relative;overflow:hidden;background:linear-gradient(120deg,#121214 0%,#1c1c1f 60%,#241a12 100%);color:#fff;border-radius:16px;padding:22px 20px;margin:2px 0 14px;border:1px solid #2a2a2e;min-height:180px;display:flex;flex-direction:column;justify-content:flex-end}
  body.bt .bttop.img{background-size:cover;background-position:center 40%}
  body.bt .bttop::after{content:"";position:absolute;right:-30px;top:0;bottom:0;width:120px;background:linear-gradient(120deg,transparent,#ee6a1c);transform:skewX(-18deg);opacity:.85}
  body.bt .bttop .bt-brand{font-size:12px;font-weight:800;letter-spacing:2px;color:#e9b06a;position:relative}
  body.bt .bttop h1{font-size:22px;font-weight:900;margin:6px 0 4px;position:relative}
  body.bt .bttop .bt-tag{font-size:13px;color:#c9c9cf;position:relative}
  body.bt .divlabel{color:#8a8a93}
  body.bt .divlabel::before,body.bt .divlabel::after{background:#2a2a2e}
  body.bt .sec{background:#fff;border:none;box-shadow:0 1px 6px rgba(0,0,0,.4)}
  body.bt .sec>summary{color:#c85a12}
  body.bt .sbody h4{color:#c85a12}
  body.bt .num{background:#ee6a1c}
  body.bt .opt .yes{background:#fff2e6;color:#c85a12}
  body.bt .tip,body.bt .ok{background:#fff7ef;border-color:#ffd9b8}
  body.bt .emg a.store{background:#ee6a1c}
  body.bt .foot{color:#8a8a93}
</style>
</head>

function shuttleHtml(){
  if(store==="nha"){
    const b=SHU.nha, im=n=>`${NB}/pickup/${n}`;
    return `<div class="busdiv">🛬 ${tr(b.arr)}</div><div class="pkway">📍 ${tr(b.way)}</div>`+
      `<div class="pkstep"><div class="pkhd"><div class="pknum">1</div><div class="pkcap">${tr(b.s1)}</div></div><img src="${im('1.jpg')}" loading="lazy"></div>`+
      `<div class="pkstep"><div class="pkhd"><div class="pknum">2</div><div class="pkcap">${tr(b.s2)}</div></div><img src="${im('2.jpg')}" loading="lazy"></div>`+
      `<div class="pkstep"><div class="pkhd"><div class="pknum">3</div><div class="pkcap">${tr(b.s3)}</div></div><img src="${im('3.jpg')}" loading="lazy"></div>`+
      `<div class="pkstep"><div class="pkhd"><div class="pknum">4</div><div class="pkcap">${tr(b.s4)}</div></div><img src="${im('4.jpg')}" loading="lazy"></div>`+
      `<div class="pkstep"><div class="pkhd"><div class="pknum">5</div><div class="pkcap">${tr(b.s5)}</div></div><div class="pkimg2"><img src="${im('5b.jpg')}" loading="lazy"><img src="${im('5a.jpg')}" loading="lazy"></div></div>`+
      `<div class="tip">${tr(b.arr_note)}</div>`+
      `<div class="busdiv busdiv2">🛫 ${tr(b.dep)}</div>`+
      `<div class="pkstep"><div class="pkhd"><div class="pknum">🚩</div><div class="pkcap">${tr(b.ret_sign)}</div></div><img src="${im('yard-sign.jpg')}" loading="lazy"></div>`+
      `<div><a class="mp2" href="https://maps.app.goo.gl/YUEezxtwXQ4sMYM17" target="_blank" rel="noopener">${tr(b.dep_link)}</a><a class="mp2 o" href="${NB}/bus.html" target="_blank" rel="noopener">🕐 ${tr(b.sch)}</a></div>`+
      `<div class="tip" style="margin-top:8px">${tr(b.dep_note)}</div>`;
  }
  if(store==="hdmt"||store==="bt"){
    const b=SHU.tkm;
    return `<div class="pu-route">✈️ ${tr(b.route_from)} <span style="opacity:.7">↔</span> 🏬 ${tr(b.route_to)}</div>`+
      `<p>${tr(b.lead)}</p>`+
      `<div class="pu-spot">${tr(b.spot)}</div>`+
      `<img class="pu-map" src="${BG}/airport-pickup-map.png" loading="lazy">`+
      `<img class="pu-map" src="${BG}/pickup-spot.jpg" style="margin-top:8px" loading="lazy">`+
      `<div class="pu-cap">${tr(b.cap)}</div>`+
      `<div class="pu-spot-d">${tr(SHU.spot_d[store])}</div>`+
      `<div class="ok" style="margin-top:12px">${tr(b.rt)}</div>`;
  }
  return `<p>${tr(S.shuttle.txt)}</p>`; // spk = delivery
}

/* ===== render ===== */
const qs=new URLSearchParams(location.search);
let store=(qs.get("store")||"hdmt").toLowerCase(); if(!STORES[store])store="hdmt";
let lang=(qs.get("lang")||localStorage.getItem("ig_lang")||"en").toLowerCase(); if(!T[lang])lang="en";
const S=STORES[store];
function tr(o){return (o&&(o[lang]||o.en||o.ja))||"";}

function renderLang(){
  document.getElementById("langbar").innerHTML=LANGS.map(([c,n])=>`<div class="lang ${c===lang?"on":""}" data-l="${c}">${n}</div>`).join("");
  document.querySelectorAll(".lang").forEach(el=>el.onclick=()=>{lang=el.dataset.l;localStorage.setItem("ig_lang",lang);document.documentElement.lang=lang;render();});
}
function sec(id,ico,titleKey,inner,open){
  return `<details class="sec" ${open?"open":""}><summary><span class="ico">${ico}</span><span>${T[lang][titleKey]}</span><span class="arw">▼</span></summary><div class="sbody">${inner}</div></details>`;
}
function li(keys){return "<ul>"+keys.map(k=>`<li>${T[lang][k]}</li>`).join("")+"</ul>";}
function steps(keys){return keys.map((k,i)=>`<p><span class="num">${i+1}</span>${T[lang][k]}</p>`).join("");}

function render(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.body.className = S.family==="bt" ? "bt" : "";
  const hero=document.getElementById("hero");
  if(S.family==="bt"){
    hero.className="bttop"+(S.hero?" img":"");
    if(S.hero) hero.style.backgroundImage=`linear-gradient(120deg,rgba(10,10,14,.82),rgba(28,28,31,.72) 55%,rgba(36,26,18,.8)),url('${S.hero}')`;
    hero.innerHTML=`<div class="bt-brand">${S.brand} · ${S.area}</div><h1>🚗 ${tr(S.name)}</h1><div class="bt-tag">${t.tag}</div>`;
  }else{
    hero.className="nhero"+(S.hero?" img":"");
    if(S.hero) hero.style.backgroundImage=`linear-gradient(180deg,rgba(3,8,28,.5) 0%,rgba(4,14,40,.4) 45%,rgba(3,8,28,.8) 100%),url('${S.hero}')`;
    else hero.style.background="linear-gradient(150deg,#0f2b45,#0a5e52 60%,#083a34)";
    hero.innerHTML=`<div class="nh-eye">${S.eye||S.brand}</div><div class="nh-oki">${S.word}</div>`+
      `<div class="nh-name">${S.brand} · ${tr(S.name)}</div><div class="nh-tag">${t.tag}</div>`;
  }

  // emergency (always open, top)
  const emg=`<div class="emg"><div class="big">${t.emg_big}</div><div class="nums">`+
    `<a href="tel:119">${t.emg_amb}</a><a class="police" href="tel:110">${t.emg_pol}</a>`+
    `<a class="store" href="tel:${S.tel}">${t.emg_store}</a></div></div>`;

  // shuttle (copied from mypage / BUDDICA guide)
  const shuttle = sec("shuttle","🚌","s_shuttle", shuttleHtml(), store!=="spk");

  // options
  const opts=optionsFor(store).map(o=>
    `<div class="opt"><span style="font-size:19px">${o.ic}</span><span>${tr(o.label)}</span><span class="st ${o.yes?"yes":"no"}">${o.yes?"✓":"✕"}</span><span class="note">${tr(o.note)}</span></div>`).join("");
  const options=sec("opt","🧳","s_opt",`<p>${t.opt_intro}</p>${opts}`);

  // trouble
  const tb=tr(S.troubles);
  const trouble=sec("trouble","⚠️","s_trouble", tb?`<div class="warn">${tb}</div>`:`<p>${t.trouble_none}</p>`);

  const body=
    emg+
    `<div class="divlabel">GUIDE</div>`+
    sec("emg","🚑","s_emg",`<h4>${t.emg_flow}</h4>${steps(["emg_l1","emg_l2","emg_l3","emg_l4","emg_l5"])}`,true)+
    sec("rule","🛣️","s_rule",li(["rule_l1","rule_l2","rule_l3","rule_l4","rule_l5","rule_l6","rule_l7","rule_l8","rule_l9"]))+
    sec("fuel","⛽","s_fuel",`<div class="tip">${t.fuel_note}</div><h4>${t.fuel_type}</h4><p>${t.fuel_type_v}</p><h4>${t.s_fuel}</h4>${steps(["fuel_l1","fuel_l2","fuel_l3","fuel_l4","fuel_l5"])}`)+
    sec("nav","🧭","s_nav",li(["nav_l1","nav_l2","nav_l3","nav_l4"]))+
    sec("traffic","🚦","s_traffic",li(["traffic_l1","traffic_l2","traffic_l3"]))+
    shuttle+
    sec("local","📍","s_local",`<p>${tr(S.notes)}</p>`)+
    options+
    sec("store","📋","s_store",li(["store_l1","store_l2","store_l3","store_l4","store_l5"]))+
    trouble;

  document.getElementById("body").innerHTML=body;
  document.getElementById("foot").innerHTML=`${t.foot}<br>${tr(S.name)} · ${S.tel}`;
  document.title=tr(S.name)+" — Guide";
}
renderLang();render();
</script>
