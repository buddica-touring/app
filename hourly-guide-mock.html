<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BUDDICA TOURISM 時間貸し ご利用ガイド（モック）</title>
<style>
:root{--org:#f26522;--bg:#0d0d0f;--card:#17171b;--line:#2a2a31;--sub:#9a9aa5;--grn:#22c55e;--red:#ef4444}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;background:var(--bg);color:#f5f5f7;font-size:15px;line-height:1.5;padding-bottom:30px}
.wrap{max-width:520px;margin:0 auto}
.mockbar{background:#3a2410;color:#fcd9b6;text-align:center;font-size:11px;padding:6px 10px;letter-spacing:.5px}
.hero{background:linear-gradient(135deg,#0f0f13,#1a1410);padding:16px 18px 18px}
.hero .logo{height:24px}
.hero h1{font-size:19px;font-weight:900;margin-top:12px}
.hero .who{font-size:13px;color:var(--sub);margin-top:4px}
.sec{padding:16px 18px 2px}
.slabel{font-size:12px;letter-spacing:1px;color:var(--org);font-weight:800;display:flex;align-items:center;gap:7px;margin-bottom:10px}
/* ⏱ 利用メーター */
.tm{background:linear-gradient(180deg,#20160f,#141014);border:1.5px solid var(--org);border-radius:18px;padding:18px;text-align:center;box-shadow:0 6px 20px rgba(242,101,34,.15)}
.tm .state{font-size:12px;letter-spacing:2px;color:#ffb98a;font-weight:800}
.tm .cd{font-size:44px;font-weight:900;letter-spacing:1px;margin:4px 0 2px;font-variant-numeric:tabular-nums;line-height:1.05}
.tm .cd.over{color:var(--red)}.tm .cd.run{color:var(--org)}.tm .cd.pre{color:#fff}.tm .cd.done{color:var(--grn)}
.tm .now-plan{font-size:14px;font-weight:800;margin-top:4px}
.tm .now-plan b{color:var(--org)}
.tm .prog{height:8px;border-radius:5px;background:#2a2a31;overflow:hidden;margin:13px 0 4px}
.tm .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--org),#ffb15e);width:0;transition:width .5s}
.tm .prog.warn i{background:linear-gradient(90deg,#ef4444,#f59e0b)}
.tm .nexttier{font-size:12px;margin-top:8px;color:#ffcfae}
.tm .nexttier.warn{color:#fca5a5;font-weight:800}
.tm .times{display:flex;justify-content:space-between;margin-top:14px;gap:10px}
.tm .times .c{flex:1;background:rgba(0,0,0,.3);border:1px solid #33332f;border-radius:12px;padding:9px}
.tm .times .k{font-size:10px;color:var(--sub);letter-spacing:1px}
.tm .times .v{font-size:16px;font-weight:900;margin-top:2px}
.tm .amt{margin-top:14px;font-size:13px;color:#d7d7dd}
.tm .amt b{color:var(--org);font-size:22px;font-weight:900}
.tm .btn{margin-top:15px;width:100%;color:#fff;font-weight:900;font-size:16px;border:none;border-radius:12px;padding:15px;cursor:pointer}
.tm .btn.start{background:var(--grn);box-shadow:0 4px 14px rgba(34,197,94,.3)}
.tm .btn.stop{background:var(--org);box-shadow:0 4px 14px rgba(242,101,34,.3)}
.tm .btn.auth{background:#2563eb;box-shadow:0 4px 14px rgba(37,99,235,.3)}
.tm .btn.dis{background:#3a3a42;color:#888;cursor:default;box-shadow:none}
.tm .subnote{font-size:11px;color:#8a8a95;margin-top:10px;line-height:1.6}
.tm .authwait{margin-top:12px;font-size:13px;color:#93c5fd;background:rgba(37,99,235,.12);border:1px solid rgba(37,99,235,.4);border-radius:10px;padding:10px}
.demo{text-align:center;margin-top:8px}
.demo a{font-size:11px;color:#6a6a73;text-decoration:underline;cursor:pointer}
/* 手続き */
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.item .ic{font-size:24px;flex:0 0 30px;text-align:center}
.item .tx{flex:1;min-width:0}.item .tt{font-size:15px;font-weight:800}.item .ts{font-size:12px;color:var(--sub);margin-top:2px}
.item .badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:8px;white-space:nowrap}
.badge.todo{background:rgba(242,101,34,.15);color:#ffb98a;border:1px solid rgba(242,101,34,.4)}
.badge.done{background:rgba(34,197,94,.14);color:#4ade80;border:1px solid rgba(34,197,94,.4)}
.infobox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.infobox .t{font-size:15px;font-weight:800;margin-bottom:8px}
.infobox .l{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:#d7d7dd;border-top:1px solid #242430}
.infobox .l:first-of-type{border-top:none}.infobox .l .k{color:var(--sub)}
.map{height:120px;border-radius:12px;margin-top:10px;background:linear-gradient(135deg,#1d1d24,#12121a);display:flex;align-items:center;justify-content:center;color:#4a4a55;font-size:12px;border:1px solid var(--line)}
.foot{padding:22px 18px 30px;text-align:center;color:var(--sub);font-size:11px}.foot .logo{height:20px;opacity:.9}
</style></head>
<body>
<div class="mockbar">🖼 デザインモック（DB未接続・利用メーター）</div>
<div class="wrap">
  <div class="hero">
    <img src="images/bt-logo.png" class="logo" alt="BUDDICA TOURISM">
    <h1>ご利用ガイド</h1>
    <div class="who">ご予約 様 ／ <span id="gcar">—</span></div>
  </div>

  <div class="sec">
    <div class="slabel">⏱ 利用時間メーター</div>
    <div class="tm" id="tm"></div>
    <div class="demo"><a onclick="demoReset()">（デモ操作をリセット）</a></div>
  </div>

  <div class="sec">
    <div class="slabel">📋 ご出発前のお手続き</div>
    <div class="item"><div class="ic">🪪</div><div class="tx"><div class="tt">運転免許証のご登録</div><div class="ts">運転される方全員分</div></div><span class="badge todo">未登録</span></div>
    <div class="item"><div class="ic">📝</div><div class="tx"><div class="tt">貸渡約款のご署名</div><div class="ts">内容をご確認のうえご署名ください</div></div><span class="badge todo">未署名</span></div>
    <div class="item"><div class="ic">🚗</div><div class="tx"><div class="tt">お車の状態確認</div><div class="ts">外装のキズ等（お受け取り時）</div></div><span class="badge done">受取時</span></div>
  </div>

  <div class="sec">
    <div class="slabel">🏬 店頭お受け取り・ご返却</div>
    <div class="infobox">
      <div class="t">BUDDICA TOURISM 高松空港店</div>
      <div class="l"><span class="k">ご住所</span><span>香川県高松市…（店頭）</span></div>
      <div class="l"><span class="k">ご予約のお時間</span><span id="ischeduled">—</span></div>
      <div class="l"><span class="k">送迎</span><span>なし（店頭でのお受け取り・ご返却）</span></div>
      <div class="map">🗺 店舗地図（モック）</div>
    </div>
  </div>

  <div class="foot"><img src="images/bt-logo.png" class="logo" alt="BUDDICA TOURISM"><div style="margin-top:8px">高松空港店｜お問い合わせ：reserve.touring@buddica.co.jp</div></div>
</div>

<script>
// 料金は税抜。add=24時間超の超過1時間あたり単価
var CATS=[
  {nm:"ランボルギーニ ウルス",p:{3:80000,6:100000,12:150000,24:200000},add:20000},
  {nm:"Porsche 911",p:{3:48000,6:60000,12:90000,24:120000},add:12000},
  {nm:"Mercedes-Benz G400d",p:{3:40000,6:50000,12:75000,24:100000},add:10000},
  {nm:"Mercedes-Benz E カブリオレ",p:{3:24000,6:30000,12:45000,24:60000},add:6000},
  {nm:"Range Rover イヴォーク",p:{3:18000,6:22500,12:33750,24:45000},add:4500},
  {nm:"アルファード 等",p:{3:10800,6:13500,12:20250,24:27000},add:2700}
];
var q=new URLSearchParams(location.search);
var yen=function(n){return "¥"+Number(n||0).toLocaleString();};
function hhmm(m){m=+m;var d=m>=1440?"翌":"";m=((m%1440)+1440)%1440;return d+("0"+Math.floor(m/60)).slice(-2)+":"+("0"+(m%60)).slice(-2);}
var carNm=q.get("car")||"Porsche 911";
var car=CATS.filter(function(c){return c.nm===carNm;})[0]||CATS[1];
var s=+(q.get("s")||600), e=+(q.get("e")||780), dstr=q.get("d")||"";
document.getElementById("gcar").textContent=carNm;
document.getElementById("ischeduled").textContent=(dstr?dstr+" ":"")+hhmm(s)+" – "+hhmm(e);

// 経過時間→プラン（実測ベース）
var TIERS=[3,6,12,24];
function planFor(hrs){
  var slot=hrs<=3?3:hrs<=6?6:hrs<=12?12:24;
  var base=car.p[slot], over=0, oh=0;
  if(hrs>24){oh=Math.ceil(hrs-24);over=oh*car.add;slot=24;}
  return {slot:slot,base:base,over:over,oh:oh,total:base+over};
}
function nextTier(hrs){for(var i=0;i<TIERS.length;i++){if(hrs<TIERS[i])return TIERS[i];}return null;}
function fmtDur(ms){var t=Math.max(0,Math.floor(ms/1000));var h=Math.floor(t/3600),m=Math.floor(t%3600/60),sec=t%60;return ("0"+h).slice(-2)+":"+("0"+m).slice(-2)+":"+("0"+sec).slice(-2);}
function fmtShort(hrs){var h=Math.floor(hrs),m=Math.round((hrs-h)*60);return h+"時間"+(m?m+"分":"");}

// デモ用ステート（localStorage）
var LS=window.localStorage, KEYP="btq_"+(q.get("d")||"x")+"_"+s;
function gs(k){return LS.getItem(KEYP+k);}
function ss(k,v){LS.setItem(KEYP+k,v);}
function cl(){LS.removeItem(KEYP+"start");LS.removeItem(KEYP+"stop");LS.removeItem(KEYP+"done");}
window.demoReset=function(){cl();render();};
window.doStart=function(){ss("start",Date.now());render();};
window.doStop=function(){ss("stop",Date.now());render();};
window.doAuth=function(){ss("done",Date.now());render();};

function render(){
  var tm=document.getElementById("tm");
  var start=+gs("start")||0, stop=+gs("stop")||0, done=+gs("done")||0;
  // 状態: before / running / pending / done
  if(!start){
    tm.innerHTML='<div class="state">ご利用前</div>'
      +'<div class="cd pre">00:00:00</div>'
      +'<div class="now-plan" style="color:#9a9aa5">お車のお受け取り時に開始してください</div>'
      +'<div class="times"><div class="c"><div class="k">ご予約 お受け取り</div><div class="v">'+hhmm(s)+'</div></div><div class="c"><div class="k">ご予約 ご返却</div><div class="v">'+hhmm(e)+'</div></div></div>'
      +'<div class="subnote">▶ を押すと利用時間の計測が始まります。<b>実際のご利用時間</b>でプランが確定します（1分でも超えると次のプランになります）。</div>'
      +'<button class="btn start" onclick="doStart()">▶ お受け取り・利用を開始する</button>';
    return;
  }
  var endT=stop||Date.now();
  var elapsedMs=endT-start, hrs=elapsedMs/3600000;
  var pl=planFor(hrs);
  if(!stop){ // running（計測中）
    var cslot=pl.slot;                        // 現在のプラン
    var idx=TIERS.indexOf(cslot);
    var boundaryMs=cslot*3600000;             // 現在プランの終了時点
    var toEndMs=boundaryMs-elapsedMs;         // 現在プラン終了まで
    var warn=(toEndMs<=15*60000);
    var ntHtml, prog;
    if(elapsedMs>=boundaryMs){                // 24hプランも超過中
      warn=true; prog=100;
      ntHtml='<div class="nexttier warn">⚠️ 24時間を超過中：1時間ごと <b>+'+yen(car.add)+'</b></div>';
    } else if(idx<TIERS.length-1){            // 次のプランがある(3→6→12→24)
      var nextT=TIERS[idx+1];
      prog=Math.min(100,100*(elapsedMs/boundaryMs));
      ntHtml='<div class="nexttier'+(warn?' warn':'')+'">あと <b>'+fmtDur(toEndMs)+'</b> で <b>'+cslot+'時間プラン</b>のご利用時間が終了します。<br>超過すると <b>'+nextT+'時間プラン（'+yen(car.p[nextT])+'）</b> になります</div>';
    } else {                                  // 24hプラン内（次は時間超過）
      prog=Math.min(100,100*(elapsedMs/boundaryMs));
      ntHtml='<div class="nexttier'+(warn?' warn':'')+'">あと <b>'+fmtDur(toEndMs)+'</b> で <b>24時間プラン</b>のご利用時間が終了します。<br>超過すると <b>1時間ごと +'+yen(car.add)+'</b> になります</div>';
    }
    tm.innerHTML='<div class="state">⏱ ご利用中（計測中）</div>'
      +'<div class="cd run" id="cdv">'+fmtDur(elapsedMs)+'</div>'
      +'<div class="now-plan">現在のプラン <b>'+pl.slot+'時間プラン</b> ／ '+yen(pl.total)+'</div>'
      +'<div class="prog'+(warn?' warn':'')+'"><i style="width:'+prog+'%"></i></div>'
      +ntHtml
      +'<div class="times"><div class="c"><div class="k">利用開始</div><div class="v">'+new Date(start).toTimeString().slice(0,5)+'</div></div><div class="c"><div class="k">現在の請求</div><div class="v" style="color:var(--org)">'+yen(pl.total)+'</div></div></div>'
      +'<button class="btn stop" onclick="doStop()">■ ご返却する（計測を止める）</button>'
      +'<div class="subnote">ご返却は、店頭でスタッフの認証を受けて確定します。</div>';
    return;
  }
  if(stop&&!done){ // pending（返却申請・店舗認証待ち）
    tm.innerHTML='<div class="state">🏬 店舗認証をお待ちください</div>'
      +'<div class="cd pre">'+fmtDur(elapsedMs)+'</div>'
      +'<div class="now-plan">ご利用時間 <b>'+fmtShort(hrs)+'</b>（'+pl.slot+'時間プラン）</div>'
      +'<div class="authwait">■ ご返却を受け付けました。<br>店頭スタッフがお車を確認し、<b>認証</b>すると返却時間が確定します。</div>'
      +'<button class="btn auth" onclick="doAuth()">🏬 店舗スタッフ認証（デモ）</button>'
      +'<div class="subnote">※ 認証時点の実利用時間でプラン・料金が最終確定します。</div>';
    return;
  }
  // done（返却完了・確定）
  var fMs=stop-start, fh=fMs/3600000, fp=planFor(fh);
  tm.innerHTML='<div class="state" style="color:#86efac">✓ ご返却完了・確定</div>'
    +'<div class="cd done">'+fmtDur(fMs)+'</div>'
    +'<div class="now-plan">ご利用時間 <b style="color:#fff">'+fmtShort(fh)+'</b></div>'
    +'<div class="times"><div class="c"><div class="k">確定プラン</div><div class="v">'+fp.slot+'時間プラン</div></div><div class="c"><div class="k">確定ご請求</div><div class="v" style="color:var(--org)">'+yen(fp.total)+'</div></div></div>'
    +(fp.over>0?('<div class="nexttier warn">24時間超過 '+fp.oh+'時間分 超過料金 '+yen(fp.over)+' を含みます</div>'):'')
    +'<div class="subnote">ご利用ありがとうございました。確定内容はメールでもお送りします。</div>';
}
render();
setInterval(function(){var start=+gs("start")||0,stop=+gs("stop")||0;if(start&&!stop)render();},1000);
</script>
</body></html>
