<title>BUDDICA SNS動画ツール</title>
<!-- ★動的転送：現在の公開URLはSupabase(sns_endpoint)から取得＝トンネルが変わっても自動追従。手直し不要 -->
<script>
  var SB = "https://ckrxttbnawkclshczsia.supabase.co";
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8";
  var SNS_URL = "";
  function openTool(){ if(SNS_URL) location.href = SNS_URL + "?cb=" + Date.now(); }
  fetch(SB + "/rest/v1/sns_endpoint?id=eq.1&select=url&t=" + Date.now(), { headers:{ apikey:ANON, Authorization:"Bearer "+ANON } })
    .then(function(r){ return r.json(); })
    .then(function(d){
      SNS_URL = (d && d[0] && d[0].url) ? d[0].url : "";
      if(SNS_URL){ setTimeout(function(){ location.replace(SNS_URL + "?cb=" + Date.now()); }, 500); }
      else { document.getElementById("msg").textContent = "公開URLが未設定です。オーナーのMacでツールを起動してください。"; document.getElementById("sp").style.display="none"; }
    })
    .catch(function(){ document.getElementById("msg").textContent = "接続に失敗しました。しばらくして再度お試しください。"; document.getElementById("sp").style.display="none"; });
</script>
<style>
  body{margin:0;background:#0b0d10;color:#f8f9fb;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{max-width:360px;padding:28px 22px;text-align:center}

  .sp{margin-top:10px;font-size:24px;animation:sp 1s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
