<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BUDDICA SNS動画ツール</title>
<!-- ★SNSツールの公開URL（Mac常駐トンネル）。URLが変わったらここだけ差し替える -->
<script>
  var SNS_URL = "https://tenant-pad-originally-parking.trycloudflare.com/";
  // ★毎回キャッシュ回避（古いapp.jsを掴まないよう時刻付きで開く）
  var SNS_URL_CB = SNS_URL + "?cb=" + Date.now();
  setTimeout(function(){ location.replace(SNS_URL_CB); }, 600);
</script>
<style>
  body{margin:0;background:#0b0d10;color:#f8f9fb;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{max-width:360px;padding:28px 22px;text-align:center}
  .logo{font-weight:900;font-size:22px;color:#F86018;letter-spacing:1px;font-style:italic}
  h1{font-size:16px;margin:14px 0 6px}
  p{font-size:12px;color:#8f98a5;line-height:1.7}
  a.btn{display:block;margin-top:18px;padding:14px;border-radius:12px;background:#F86018;color:#fff;font-weight:800;text-decoration:none;font-size:15px}
  .sp{margin-top:10px;font-size:24px;animation:sp 1s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">BUDDICA TOURISM</div>
    <h1>🎬 SNS動画ツール</h1>
    <div class="sp">⏳</div>
    <p>ツールを開いています…<br>自動で切り替わらない場合は下のボタンを押してください。</p>
    <a class="btn" href="#" onclick="location.href=SNS_URL_CB;return false;">▶ SNS動画ツールを開く</a>
    <p style="margin-top:16px">※オーナーのMacが起動中のときに利用できます。<br>開けない場合はしばらくしてから再度お試しください。</p>
  </div>
</body>
</html>
