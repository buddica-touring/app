<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>マイページ一覧</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1c1a;--sub:#6b6862;--line:#e4e1da;--acc:#1f6feb;--ok:#15803d;--warn:#b26a00;--chip:#efede8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#201f1e;--ink:#eceae5;--sub:#a29e96;--line:#34322f;--acc:#5b9bff;--ok:#4ade80;--warn:#e7a43a;--chip:#2a2927}}
:root[data-theme="dark"]{--bg:#161615;--card:#201f1e;--ink:#eceae5;--sub:#a29e96;--line:#34322f;--acc:#5b9bff;--ok:#4ade80;--warn:#e7a43a;--chip:#2a2927}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{padding:12px 16px 24px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar input{flex:1;min-width:180px;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.n{color:var(--sub);font-size:12px}
.msg{background:var(--chip);border-radius:10px;padding:12px 14px;font-size:13px}
.msg.warn{border-left:4px solid var(--warn)}
.tw{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:var(--sub);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:first-child td{border-top:0}
td.u{white-space:normal;word-break:break-all;min-width:220px;font-size:12px;color:var(--sub)}
.b{display:inline-block;font-size:10px;padding:0 5px;border-radius:4px;background:var(--chip);color:var(--sub);margin-left:4px}
button.cp{font:inherit;font-size:12px;padding:4px 10px;border-radius:6px;border:1px solid var(--acc);background:var(--card);color:var(--acc);cursor:pointer;margin-right:6px}
button.cp.done{border-color:var(--ok);color:var(--ok)}
@media (max-width:600px){.wrap{padding:10px 12px 20px}td.u{min-width:160px}}
</style>
</head>
<body>
<div class="wrap">
 <div class="bar"><input id="q" type="search" placeholder="予約番号・お名前で検索" aria-label="予約番号・お名前で検索"><span class="n" id="n"></span></div>
 <div id="list"><div class="msg">読み込み中…</div></div>
</div>
<script>
// ユーザーマイページ一覧（読むだけ・書き込みなし）。各店APPがマイページを開く時と同じ表・同じURLの作り方。
// 札幌・那覇＝main（管理APPのログインを共有）／高松＝BT（高松APPのサイトに置いた同じファイル・高松APPのログインを共有）。
var MAIN_URL='https://ckrxttbnawkclshczsia.supabase.co',MAIN_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrcnh0dGJuYXdrY2xzaGN6c2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4Nzg1NTAsImV4cCI6MjA4NzQ1NDU1MH0.kDC_UDVWvcrS97wzqQ3NXP79ewjgYwF4vSFdV7y06S8';
var BT_URL='https://ggqugvyskyiblxiycpci.supabase.co',BT_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdncXVndnlza3lpYmx4aXljcGNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMDc3NjksImV4cCI6MjA5MzY4Mzc2OX0.uNhWcBd_Dl5nzemZDQfJ8mQV6iY73MwystGGpTRPC18';
var OTA_L={J:'じゃらん',R:'楽天',S:'スカイチケット',O:'エアトリ',A:'エアトリ',HP:'HP直販',G:'GoGoOut',RC:'レンタカードットコム',SP:'スタッフ予約',direct:'直接',KEYDROP:'KEYDROP'};
var KD='https://keydrop.jp/mypage.html?t=';
function enc(t){return encodeURIComponent(t);}
// 高松：HDMブランド（じゃらん・楽天・スカイチケット・HANDYMAN）＝my-tkm／BUDDICA＝ご利用ガイド（高松APP custPageUrl と同じ判定）
function btUrl(r){var o=String(r.ota||''),ou=o.toUpperCase();var hdm=String(r.brand||'').toUpperCase()==='HDM'||o.indexOf('じゃらん')>=0||o.indexOf('楽天')>=0||o.indexOf('スカイチケット')>=0||ou.indexOf('SKY')>=0||ou.indexOf('HANDYMAN')>=0;return (hdm?'https://nosh2318.github.io/spk-task/my-tkm.html?t=':'https://buddica-touring.github.io/app/guide/?t=')+enc(r.mypage_token);}
var ST={
 spk:{nm:'札幌',url:MAIN_URL,key:MAIN_ANON,tbl:'reservations',sel:'id,name,ota,lend_date,return_date,status,mypage_token',ld:'lend_date',rd:'return_date',
  my:function(r){return (r.ota==='KEYDROP'?KD:'https://nosh2318.github.io/spk-task/my.html?t=')+enc(r.mypage_token);},ota:function(r){return OTA_L[r.ota]||r.ota||'';}},
 nha:{nm:'那覇',url:MAIN_URL,key:MAIN_ANON,tbl:'nha_reservations',sel:'id,name,ota,start_date,end_date,status,mypage_token',ld:'start_date',rd:'end_date',
  my:function(r){return (r.ota==='KEYDROP'?KD:'https://nosh2318.github.io/naha-project/my-nha.html?t=')+enc(r.mypage_token);},ota:function(r){return OTA_L[r.ota]||r.ota||'';}},
 bt:{nm:'高松',url:BT_URL,key:BT_ANON,tbl:'bt_reservations',sel:'id,name,ota,brand,start_date,end_date,status,mypage_token',ld:'start_date',rd:'end_date',
  my:btUrl,ota:function(r){return esc(r.ota||'公式')+(r.brand?'<span class="b">'+esc(r.brand)+'</span>':'');},raw:true}
};
var onBT=location.hostname==='buddica-touring.github.io';
var sk=onBT?'bt':(new URLSearchParams(location.search).get('store')||'spk');
var S=Object.prototype.hasOwnProperty.call(ST,sk)?ST[sk]:null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function todayJst(){var d=new Date(Date.now()+9*3600e3);return d.toISOString().slice(0,10);}
function fmtD(s){s=String(s||'');var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return esc(s);var w='日月火水木金土'[new Date(+m[1],+m[2]-1,+m[3]).getDay()];return m[1]+'/'+(+m[2])+'/'+(+m[3])+'（'+w+'）';}
function isCxl(s){s=String(s||'');return /cancel/i.test(s)||s.indexOf('キャンセル')>=0;}
var ROWS=[];
function draw(){
 var q=document.getElementById('q').value.trim().toLowerCase();
 var a=q?ROWS.filter(function(r){return String(r.id).toLowerCase().indexOf(q)>=0||String(r.name||'').toLowerCase().indexOf(q)>=0;}):ROWS;
 document.getElementById('n').textContent=S.nm+' '+a.length+'件（返却日が今日以降・キャンセル除く）';
 if(!a.length){document.getElementById('list').innerHTML='<div class="msg">該当する予約がありません</div>';return;}
 document.getElementById('list').innerHTML='<div class="tw"><table><thead><tr><th>貸出日</th><th>予約番号</th><th>氏名</th><th>OTA（流入）</th><th>URL</th></tr></thead><tbody>'+
  a.map(function(r,i){var u=r.mypage_token?S.my(r):'';
   return '<tr><td>'+fmtD(r[S.ld])+'</td><td>'+esc(r.id)+'</td><td>'+esc(r.name)+'</td><td>'+(S.raw?S.ota(r):esc(S.ota(r)))+'</td>'+
    '<td class="u">'+(u?'<button class="cp" data-i="'+i+'">コピー</button>'+esc(u):'未発行')+'</td></tr>';}).join('')+'</tbody></table></div>';
 VIS=a;
}
var VIS=[];
document.getElementById('q').addEventListener('input',draw);
document.getElementById('list').addEventListener('click',function(e){
 var b=e.target.closest('button.cp');if(!b)return;var r=VIS[+b.dataset.i];if(!r)return;var u=S.my(r);
 function ok(){b.textContent='コピーしました';b.classList.add('done');setTimeout(function(){b.textContent='コピー';b.classList.remove('done');},1500);}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(ok,function(){fallback(u);ok();});}else{fallback(u);ok();}
});
function fallback(u){var t=document.createElement('textarea');t.value=u;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(t);}
async function load(){
 var L=document.getElementById('list');
 if(!S){L.innerHTML='<div class="msg warn">店舗の指定が正しくありません。</div>';return;}
 if(sk==='bt'&&!onBT){L.innerHTML='<div class="msg">高松は高松APPのサイトで開きます：<a href="https://buddica-touring.github.io/app/mypage-list.html" target="_blank" rel="noopener">高松のマイページ一覧を開く ↗</a></div>';return;}
 var sb=window.supabase.createClient(S.url,S.key,{auth:{persistSession:true,autoRefreshToken:true}});
 var ss=(await sb.auth.getSession()).data.session;
 if(!ss){var inFr=window.top!==window.self;L.innerHTML='<div class="msg warn">⚠️ '+(sk==='bt'?'高松APP':'管理APP')+'にログインしてから開いてください（同じブラウザでログイン済みなら自動で繋がります）。'+(inFr?'<br><a href="'+esc(location.href)+'" target="_blank" rel="noopener">新しいタブで開く ↗</a>':'')+'</div>';return;}
 var all=[],from=0,td=todayJst();
 while(true){
  var res=await sb.from(S.tbl).select(S.sel).gte(S.rd,td).order(S.ld,{ascending:true}).order('id',{ascending:true}).range(from,from+999);
  if(res.error){L.innerHTML='<div class="msg warn">読み込めませんでした（'+esc(res.error.message)+'）。再読込してください。</div>';return;}
  all=all.concat(res.data||[]);if(!res.data||res.data.length<1000)break;from+=1000;
 }
 ROWS=all.filter(function(r){return !isCxl(r.status);});
 draw();
}
load();
</script>
</body>
</html>
